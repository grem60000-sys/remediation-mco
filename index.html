/* ---- Module ---- */
function moduleDayIndex(stu, id) { return stu.planning.findIndex(d => d.modules.includes(id)); }
function stepAccessible(state, id, step) {
  if (step === "mission") return stepDone(state, id, "cours");
  const k = STEP_ORDER.indexOf(step);
  return STEP_ORDER.slice(0, k).filter(s => s !== "mission").every(s => stepDone(state, id, s));
}
function minRead(id) { if (CONFIG.DEMO) return 20; const w = MODULES[id].cours.reduce((s, c) => s + wordCount(c.h), 0); return clamp(Math.round(w / 230 * 60 * 0.55), 150, 600); }

function viewModule(id, step) {
  const stu = APP.stu, state = APP.state, m = MODULES[id];
  const di = moduleDayIndex(stu, id);
  if (!m || di < 0) { location.hash = "#/"; return; }
  if (!dayUnlocked(stu, state, di)) { toast("Cette journée n'est pas encore débloquée."); location.hash = "#/"; return; }
  if (!step || !STEP_ORDER.includes(step)) step = STEP_ORDER.find(s => s !== "mission" && !stepDone(state, id, s)) || "quiz";
  if (!stepAccessible(state, id, step)) step = STEP_ORDER.find(s => s !== "mission" && !stepDone(state, id, s));
  APP.ctx = { module: id, step };
  const ms = mst(state, id);
  if (!ms.startedAt) { ms.startedAt = nowISO(); saveSoon(); }
  const stepsBar = STEP_ORDER.map((s, k) => {
    const acc = stepAccessible(state, id, s), done = stepDone(state, id, s);
    return `<button class="step ${s === step ? "active" : ""} ${done ? "done" : ""} ${acc ? "" : "locked"}" ${acc ? `onclick="location.hash='#/module/${id}/${s}'"` : "disabled"}><span class="n">${done ? "✓" : k + 1}</span>${STEP_LABEL[s]}</button>`;
  }).join("");
  shell(`<div class="crumbs"><a href="#/">Mon parcours</a> › Jour ${stu.planning[di].jour}</div>
    <div class="mod-head bloc-${m.bloc}"><span class="pill bloc bloc-${m.bloc}">${m.bloc ? "Bloc " + m.bloc + " · " + BLOCS[m.bloc].split("·")[0].trim() + " · " + id : "Méthode transversale"}</span><h1>${esc(m.titre)}</h1><div class="muted">${esc(m.sous)} · ${m.duree} min</div></div>
    <div class="steps">${stepsBar}</div>
    <div id="stepc" class="content"></div>`, { narrow: false });
  const box = $("#stepc");
  ({ cours: stepCours, exemple: stepExemple, exercices: stepExercices, situation: stepSituation, quiz: stepQuiz, mission: stepMission })[step](box, id, ms);
}
function nextStepHref(id, step) {
  const k = STEP_ORDER.indexOf(step);
  const nx = STEP_ORDER[k + 1];
  return nx && nx !== "mission" ? `#/module/${id}/${nx}` : `#/module/${id}/quiz`;
}

function stepCours(box, id, ms) {
  const m = MODULES[id]; const c = ms.steps.cours = ms.steps.cours || {};
  const need = minRead(id);
  box.innerHTML = `<div class="objectifs"><b>Objectifs du module</b><ul>${m.objectifs.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>
    ${m.cours.map(s => `<div class="card flat"><h2>${esc(s.t)}</h2>${s.h}</div>`).join("")}
    <div id="endmark"></div>
    <div class="read-gate"><div class="small" id="gateinfo"></div><button class="btn primary" id="gatebtn">${c.done ? "Passer à l'exemple" : "J'ai lu et compris le cours"}</button></div>`;
  const upd = () => {
    const t = c.time || 0, left = Math.max(0, need - t);
    const ok = c.done || (left === 0 && c.end);
    $("#gatebtn").disabled = !ok;
    $("#gateinfo").innerHTML = c.done ? "✓ Cours validé. Tu peux y revenir à tout moment." :
      `${left > 0 ? `Lecture attentive : encore <b>${Math.ceil(left / 60)} min</b> minimum.` : "Temps de lecture atteint."} ${c.end ? "" : " Fais défiler jusqu'en bas du cours."}`;
  };
  onTick = upd; upd();
  new IntersectionObserver(es => { if (es[0].isIntersecting && !c.end) { c.end = true; saveSoon(); upd(); } }).observe($("#endmark"));
  $("#gatebtn").onclick = () => { if (!c.done) { c.done = true; c.at = nowISO(); logEv("step", { module: id, step: "cours", time: c.time }); saveNow(); } location.hash = `#/module/${id}/exemple`; };
}

function stepExemple(box, id, ms) {
  const ex = MODULES[id].exemple; const e = ms.steps.exemple = ms.steps.exemple || { shown: 0 };
  const draw = () => {
    const n = e.done ? ex.etapes.length : e.shown;
    box.innerHTML = `<div class="card"><h2>${esc(ex.titre)}</h2><div class="formule" style="font-weight:500">${esc(ex.enonce)}</div>
      <p class="small muted">Avant d'afficher chaque étape, essaie de la faire toi-même sur une feuille.</p>
      ${ex.etapes.slice(0, n).map((s, i) => `<div class="reveal-step on"><h4>Étape ${i + 1} — ${esc(s.t)}</h4><div>${s.h}</div></div>`).join("")}
      <div class="btn-row" style="margin-top:14px">${n < ex.etapes.length ? `<button class="btn primary" id="nx">Afficher l'étape ${n + 1} / ${ex.etapes.length}</button>` : `<button class="btn primary" id="fin">${e.done ? "Passer aux exercices" : "J'ai compris, passer aux exercices"}</button>`}</div></div>`;
    const nx = $("#nx"); if (nx) nx.onclick = () => { e.shown++; saveSoon(); draw(); };
    const fin = $("#fin"); if (fin) fin.onclick = () => { if (!e.done) { e.done = true; e.at = nowISO(); logEv("step", { module: id, step: "exemple" }); saveNow(); } location.hash = `#/module/${id}/exercices`; };
  };
  draw();
}

function renderOpts(name, opts, order, sel, lockInfo) {
  const L = "ABCDEFGH";
  return `<div class="opts">${order.map((oi, k) => {
    let cls = ""; if (lockInfo) { if (oi === lockInfo.good) cls = "good"; else if (oi === sel) cls = "wrong"; } else if (oi === sel) cls = "sel";
    return `<button class="opt ${cls}" data-name="${name}" data-oi="${oi}" ${lockInfo ? "disabled" : ""}><span class="k">${L[k]}</span><span>${opts[oi]}</span></button>`;
  }).join("")}</div>`;
}

function stepExercices(box, id, ms) {
  const m = MODULES[id]; const E = ms.steps.exercices = ms.steps.exercices || { items: {} }; E.items = E.items || {};
  const code = APP.stu.code;
  const draw = () => {
    const doneN = m.exercices.filter((x, i) => E.items[i] && E.items[i].done).length;
    const firstOk = m.exercices.filter((x, i) => E.items[i] && E.items[i].first).length;
    box.innerHTML = `<div class="sticky-bar"><span><b>${doneN}</b> / ${m.exercices.length} exercices · <span class="muted">${firstOk} réussi(s) du premier coup</span></span><div class="bar" style="width:160px"><span style="width:${pct(doneN, m.exercices.length)}%"></span></div></div>
      <p class="small muted">Calculs : utilise ta calculatrice et ta feuille. Pour les réponses numériques, tu as droit à 2 essais ; la correction s'affiche ensuite. Saisis les nombres sans unité (la virgule est acceptée).</p>
      ${m.exercices.map((x, i) => {
        const it = E.items[i] || {}; let body = "";
        if (x.t === "num") {
          body = `<div class="numrow"><input class="input" id="n${i}" inputmode="decimal" value="${esc(it.val || "")}" ${it.done ? "disabled" : ""} placeholder="Ta réponse"><span class="muted">${esc(x.u || "")}</span>${it.done ? "" : `<button class="btn small primary" data-check="${i}">Vérifier</button>`}</div>
            ${it.tries && !it.done ? `<div class="fb bad">Ce n'est pas encore ça. Reprends ton calcul étape par étape (dernier essai).</div>` : ""}`;
        } else if (x.t === "qcm") {
          const order = shuffled(x.o.map((_, k) => k), code + id + "ex" + i);
          body = renderOpts("e" + i, x.o, order, it.sel, it.done ? { good: x.a } : null);
        } else {
          body = `<div class="opts">${[["Vrai", true], ["Faux", false]].map(([lab, v]) => `<button class="opt ${it.done ? (v === x.a ? "good" : it.sel === v ? "wrong" : "") : ""}" data-vf="${i}" data-v="${v}" ${it.done ? "disabled" : ""}><span>${lab}</span></button>`).join("")}</div>`;
        }
        const fb = it.done ? `<div class="fb ${it.ok ? "ok" : "bad"}"><b>${it.ok ? (it.first ? "Bravo, juste du premier coup." : "Juste au second essai.") : "Correction :"}</b> ${x.c}</div>` : "";
        return `<div class="ex"><div class="q"><span class="n">${i + 1}.</span>${x.q}</div>${body}${fb}</div>`;
      }).join("")}
      ${doneN === m.exercices.length ? `<div class="alert ${firstOk / m.exercices.length >= 0.6 ? "ok" : "warn"}">Exercices terminés : ${firstOk}/${m.exercices.length} réussis du premier coup. ${firstOk / m.exercices.length < 0.6 ? "Relis les corrections ci-dessus et la partie du cours concernée avant la mise en situation." : ""}</div><div class="btn-row"><a class="btn primary" href="#/module/${id}/situation">Passer à la mise en situation</a></div>` : ""}`;
    $$("[data-check]", box).forEach(b => b.onclick = () => {
      const i = +b.dataset.check, x = m.exercices[i], it = E.items[i] = E.items[i] || {};
      const v = $("#n" + i).value; if (isNaN(parseNum(v))) { toast("Saisis un nombre."); return; }
      it.val = v; it.tries = (it.tries || 0) + 1;
      if (numOk(v, x.r, x.tol)) { it.ok = true; it.done = true; it.first = it.tries === 1; }
      else if (it.tries >= 2) { it.ok = false; it.done = true; it.first = false; }
      if (it.done) logEv("exercise", { module: id, i, ok: it.ok, first: it.first });
      finishCheck(); draw();
    });
    $$(".opt[data-name]", box).forEach(b => b.onclick = () => {
      const i = +b.dataset.name.slice(1), x = m.exercices[i], it = E.items[i] = E.items[i] || {};
      it.sel = +b.dataset.oi; it.tries = 1; it.ok = it.sel === x.a; it.first = it.ok; it.done = true;
      logEv("exercise", { module: id, i, ok: it.ok, first: it.first }); finishCheck(); draw();
    });
    $$("[data-vf]", box).forEach(b => b.onclick = () => {
      const i = +b.dataset.vf, x = m.exercices[i], it = E.items[i] = E.items[i] || {};
      it.sel = b.dataset.v === "true"; it.tries = 1; it.ok = it.sel === x.a; it.first = it.ok; it.done = true;
      logEv("exercise", { module: id, i, ok: it.ok, first: it.first }); finishCheck(); draw();
    });
  };
  const finishCheck = () => {
    if (!E.done && m.exercices.every((x, i) => E.items[i] && E.items[i].done)) { E.done = true; E.at = nowISO(); E.firstOk = m.exercices.filter((x, i) => E.items[i].first).length; logEv("step", { module: id, step: "exercices", firstOk: E.firstOk }); saveNow(); }
    else saveSoon();
  };
  const y = window.scrollY; draw(); window.scrollTo(0, y);
}

function minChars() { return APP.stu.profil && APP.stu.profil.analyse < 20 ? 250 : 180; }
function attachPaste(ta, onPaste) {
  ta.addEventListener("paste", e => {
    const txt = (e.clipboardData || window.clipboardData).getData("text") || "";
    if (txt.length < 15) return;
    APP.state.flags.paste = (APP.state.flags.paste || 0) + 1;
    onPaste(txt.length);
    logEv("paste", { where: ta.dataset.where, len: txt.length });
    toast("Collage détecté : il est signalé au formateur. Rédige avec tes propres mots.", 3800);
    saveSoon();
  });
}
function stepSituation(box, id, ms) {
  const sit = MODULES[id].situation; const S = ms.steps.situation = ms.steps.situation || { answers: [], paste: [] };
  const need = minChars();
  const draw = () => {
    if (!S.submittedAt) {
      box.innerHTML = `<div class="card"><h2>${esc(sit.titre)}</h2>${sit.contexte}</div>
        <div class="alert info small">Rédige chaque réponse comme à l'examen : calculs détaillés, puis interprétation et justification (au moins ${need} caractères par réponse). Le corrigé et la grille d'auto-évaluation s'affichent après l'envoi.</div>
        ${sit.questions.map((q, i) => `<div class="ex answer-box"><div class="q"><span class="n">${i + 1}.</span>${esc(q)}</div>
          <textarea class="input" data-i="${i}" data-where="${id}:situation:${i}" placeholder="Ta réponse argumentée…">${esc(S.answers[i] || "")}</textarea>
          <div class="counter"><span id="cc${i}"></span>${S.paste[i] ? `<span class="warn">Collage signalé</span>` : ""}</div></div>`).join("")}
        <div class="btn-row"><button class="btn primary" id="send">Envoyer mes réponses et voir le corrigé</button><span class="small muted">Les réponses sont enregistrées automatiquement.</span></div>`;
      const cnt = () => sit.questions.forEach((q, i) => { const n = (S.answers[i] || "").trim().length; $("#cc" + i).innerHTML = n >= need ? `✓ ${n} caractères` : `${n} / ${need} caractères minimum`; });
      $$("textarea", box).forEach(ta => {
        ta.oninput = () => { S.answers[+ta.dataset.i] = ta.value; cnt(); saveSoon(2000); };
        attachPaste(ta, () => { S.paste[+ta.dataset.i] = (S.paste[+ta.dataset.i] || 0) + 1; });
      });
      cnt();
      $("#send").onclick = () => {
        const short = sit.questions.findIndex((q, i) => (S.answers[i] || "").trim().length < need);
        if (short >= 0) { toast(`La réponse ${short + 1} est trop courte : développe ta justification.`); return; }
        S.submittedAt = nowISO(); logEv("situation", { module: id, len: S.answers.map(a => a.length) }); saveNow(); draw(); window.scrollTo(0, 0);
      };
    } else {
      S.self = S.self || sit.grille.map(() => false);
      box.innerHTML = `<div class="card"><h2>${esc(sit.titre)} — corrigé</h2><p class="small muted">Compare ta réponse au corrigé, question par question.</p>
        ${sit.questions.map((q, i) => `<div class="ex"><div class="q"><span class="n">${i + 1}.</span>${esc(q)}</div><div class="small muted">Ta réponse :</div><div class="prod"><div class="txt" style="margin:0;background:none;padding:0">${esc(S.answers[i] || "")}</div></div><div class="corrige"><b>Corrigé</b>${sit.corrige[i]}</div></div>`).join("")}</div>
        <div class="card"><h3>Auto-évaluation</h3><p class="small muted">Coche honnêtement les critères que ta réponse remplit. Ton formateur verra ta réponse et ton auto-évaluation.</p>
          ${sit.grille.map((g, i) => `<label class="check"><input type="checkbox" data-g="${i}" ${S.self[i] ? "checked" : ""} ${S.done ? "disabled" : ""}><span>${esc(g)}</span></label>`).join("")}
          <div class="btn-row" style="margin-top:14px">${S.done ? `<span class="pill ok">Auto-évaluation : ${S.selfScore}/${sit.grille.length}</span><a class="btn primary" href="#/module/${id}/quiz">Passer au quiz</a>` : `<button class="btn primary" id="val">Valider mon auto-évaluation</button>`}</div></div>`;
      $$("[data-g]", box).forEach(c => c.onchange = () => { S.self[+c.dataset.g] = c.checked; saveSoon(); });
      const v = $("#val"); if (v) v.onclick = () => { S.done = true; S.at = nowISO(); S.selfScore = S.self.filter(Boolean).length; logEv("step", { module: id, step: "situation", self: S.selfScore }); saveNow(); draw(); };
    }
  };
  draw();
}

function stepQuiz(box, id, ms) {
  const m = MODULES[id]; const Q = ms.steps.quiz = ms.steps.quiz || { attempts: [] };
  const code = APP.stu.code;
  const draw = () => {
    APP.evalActive = null;
    const showAll = Q.passed || Q.attempts.length >= 3;
    if (Q.current) {
      APP.evalActive = { type: "quiz", id };
      const cur = Q.current, n = Q.attempts.length + 1;
      const order = shuffled(m.quiz.map((_, k) => k), code + id + "q" + n);
      box.innerHTML = `<div class="sticky-bar"><span><b>Quiz — tentative ${n}</b> · ${Object.keys(cur.answers).length}/${m.quiz.length} répondues</span><span class="small muted">Reste sur cet onglet</span></div>
        ${order.map((qi, k) => { const q = m.quiz[qi]; const oo = shuffled(q.o.map((_, j) => j), code + id + "q" + n + "-" + qi);
          return `<div class="ex"><div class="q"><span class="n">${k + 1}.</span>${q.q}</div>${renderOpts("q" + qi, q.o, oo, cur.answers[qi], null)}</div>`; }).join("")}
        <div class="btn-row"><button class="btn primary" id="sub">Valider mes réponses</button></div>`;
      $$(".opt", box).forEach(b => b.onclick = () => { cur.answers[+b.dataset.name.slice(1)] = +b.dataset.oi; saveSoon(); const y = window.scrollY; draw(); window.scrollTo(0, y); });
      $("#sub").onclick = () => {
        if (Object.keys(cur.answers).length < m.quiz.length) { toast("Réponds à toutes les questions."); return; }
        const wrong = m.quiz.map((q, i) => i).filter(i => cur.answers[i] !== m.quiz[i].a);
        const score = m.quiz.length - wrong.length, p = pct(score, m.quiz.length);
        const dur = Math.round((Date.now() - new Date(cur.start).getTime()) / 1000);
        Q.attempts.push({ score, total: m.quiz.length, pct: p, at: nowISO(), dur, blur: cur.blur || 0, wrong, order, answers: cur.answers });
        delete Q.current;
        if (p >= QUIZ_PASS && !Q.passed) { Q.passed = true; Q.passedAt = nowISO(); }
        logEv("quiz", { module: id, pct: p, dur, attempt: Q.attempts.length });
        saveNow(); draw(); window.scrollTo(0, 0);
      };
      return;
    }
    const last = Q.attempts[Q.attempts.length - 1];
    let html = "";
    if (!last) {
      html = `<div class="card"><h2>Quiz de validation</h2><p>${m.quiz.length} questions. Il faut <b>${QUIZ_PASS} %</b> de bonnes réponses pour valider le module. Les questions et les réponses sont mélangées à chaque tentative.</p>
        <ul class="small"><li>Pas de limite de temps, mais reste sur cet onglet : les sorties sont signalées.</li><li>En cas d'échec, tu vois les questions à revoir ; la correction complète apparaît après validation ou après 3 tentatives.</li></ul>
        <button class="btn primary" id="go">Commencer le quiz</button></div>`;
    } else {
      const lastOrder = last.order;
      html = `<div class="card"><div class="section-title"><h2 class="mb0">Résultat : ${last.score}/${last.total} (${last.pct} %)</h2><span class="pill ${last.pct >= QUIZ_PASS ? "ok" : "bad"}">${last.pct >= QUIZ_PASS ? "Module validé" : "Non validé"}</span></div>
        <p class="small muted">Tentatives : ${Q.attempts.map(a => a.pct + " %").join(" · ")} — meilleur score ${quizBest(APP.state, id)} %</p>
        ${!Q.passed ? `<div class="alert warn">Questions à revoir : <b>${last.wrong.map(w => "n°" + (lastOrder.indexOf(w) + 1)).join(", ")}</b>. Relis le cours (étape 1) avant de recommencer${Q.attempts.length < 3 ? " : la correction détaillée apparaîtra après validation ou à la 3ᵉ tentative." : "."}</div>` : ""}
        <div class="btn-row">${!Q.passed ? `<button class="btn primary" id="go">Nouvelle tentative</button><a class="btn" href="#/module/${id}/cours">Revoir le cours</a>` : nextAfterModule(id)}</div></div>`;
      if (showAll) {
        html += `<div class="card"><h3>Correction détaillée (dernière tentative)</h3>${lastOrder.map((qi, k) => { const q = m.quiz[qi]; const ok = last.answers[qi] === q.a;
          return `<div class="ex"><div class="q"><span class="n">${k + 1}.</span>${q.q}</div><div class="small">Ta réponse : <b>${q.o[last.answers[qi]] || "—"}</b> ${ok ? "✅" : "❌"}</div>${ok ? "" : `<div class="small">Bonne réponse : <b>${q.o[q.a]}</b></div>`}<div class="fb info">${q.c}</div></div>`; }).join("")}</div>`;
      }
    }
    box.innerHTML = html;
    const go = $("#go"); if (go) go.onclick = () => { Q.current = { start: nowISO(), answers: {}, blur: 0 }; saveSoon(); draw(); window.scrollTo(0, 0); };
  };
  draw();
}
function nextAfterModule(id) {
  const stu = APP.stu, state = APP.state, di = moduleDayIndex(stu, id), d = stu.planning[di];
  const nextMod = d.modules.find(x => !moduleDone(state, x));
  const mis = stepDone(state, id, "mission") ? "" : `<a class="btn" href="#/module/${id}/mission">Faire la mission entreprise</a>`;
  if (nextMod) return `<a class="btn primary" href="#/module/${nextMod}">Module suivant : ${esc(MODULES[nextMod].titre)}</a>${mis}`;
  if (d.bilan && !bilanDone(state, d.bilan)) return `<a class="btn primary" href="#/bilan/${d.bilan}">Passer au ${d.bilan === "S1" ? "bilan de mi-parcours" : "bilan final"}</a>${mis}`;
  return `<a class="btn primary" href="#/">Retour au planning</a>${mis}`;
}

/* ---- Bilans ---- */
function viewBilan(key) {
  const stu = APP.stu, state = APP.state;
  const di = stu.planning.findIndex(d => d.bilan === key);
  if (di < 0) { location.hash = "#/"; return; }
  if (!dayUnlocked(stu, state, di) || !stu.planning[di].modules.every(id => moduleDone(state, id))) { toast("Termine d'abord les modules de la journée."); location.hash = "#/"; return; }
  const qs = bilanQuestions(stu, key), dur = bilanDuration(qs.length);
  const B = state.bilans[key];
  const title = key === "S1" ? "Bilan de mi-parcours" : "Bilan final";
  if (!B || !B.start) {
    shell(`<div class="crumbs"><a href="#/">Mon parcours</a> › Jour ${stu.planning[di].jour}</div><div class="card section"><h1>${title}</h1>
      <p>${qs.length} questions inédites sur ${key === "S1" ? "les modules de la première semaine" : "l'ensemble du parcours"}. Durée : <b>${Math.round(dur / 60)} minutes</b>, chronométrées.</p>
      <ul><li>Une seule tentative : prépare ta calculatrice, une feuille et un moment calme.</li><li>Le chronomètre continue même si tu fermes la page ; à la fin du temps, le bilan est envoyé automatiquement.</li><li>Les sorties d'onglet sont comptabilisées et transmises au formateur.</li></ul>
      <button class="btn primary" id="go">Démarrer le bilan</button></div>`, { narrow: true });
    $("#go").onclick = () => { state.bilans[key] = { start: nowISO(), answers: {}, blur: 0 }; logEv("bilan_start", { key }); saveNow(); viewBilan(key); };
    return;
  }
  if (B.submittedAt) return bilanResult(key, qs);
  APP.evalActive = { type: "bilan", id: key };
  const remaining = () => Math.round(dur - (Date.now() - new Date(B.start).getTime()) / 1000);
  if (remaining() <= 0) return submitBilan(key, qs, true);
  shell(`<div class="sticky-bar"><b>${title}</b><span class="timer" id="tm"></span></div>
    ${qs.map((it, k) => { const q = it.q; const name = "b" + k; let body;
      if (q.t === "num") body = `<div class="numrow"><input class="input" data-bnum="${k}" inputmode="decimal" value="${esc(B.answers[k] || "")}" placeholder="Ta réponse"><span class="muted">${esc(q.u || "")}</span></div>`;
      else { const oo = shuffled(q.o.map((_, j) => j), stu.code + key + k); body = renderOpts(name, q.o, oo, B.answers[k], null); }
      return `<div class="ex"><div class="q"><span class="n">${k + 1}.</span>${q.q} <span class="pill bloc bloc-${MODULES[it.mod].bloc}" style="margin-left:6px">${it.mod}</span></div>${body}</div>`; }).join("")}
    <div class="btn-row section"><button class="btn primary" id="sub">Envoyer mon bilan</button><span class="small muted" id="cnt"></span></div>`, { narrow: true });
  const updCnt = () => { $("#cnt").textContent = `${Object.keys(B.answers).filter(k => B.answers[k] !== "" && B.answers[k] != null).length}/${qs.length} réponses`; };
  const tick = () => { const r = remaining(); const el = $("#tm"); if (!el) return; if (r <= 0) { submitBilan(key, qs, true); return; } el.textContent = `${Math.floor(r / 60)}:${String(r % 60).padStart(2, "0")}`; el.classList.toggle("low", r < 120); };
  tick(); const iv = setInterval(() => { if (!$("#tm")) { clearInterval(iv); return; } tick(); }, 1000);
  $$("[data-bnum]").forEach(inp => inp.oninput = () => { B.answers[+inp.dataset.bnum] = inp.value; updCnt(); saveSoon(1500); });
  $$(".opt").forEach(b => b.onclick = () => { const k = +b.dataset.name.slice(1); B.answers[k] = +b.dataset.oi; $$(`.opt[data-name="b${k}"]`).forEach(x => x.classList.toggle("sel", x === b)); updCnt(); saveSoon(1500); });
  updCnt();
  $("#sub").onclick = () => { const miss = qs.length - Object.keys(B.answers).filter(k => B.answers[k] !== "" && B.answers[k] != null).length; if (miss && !confirm(`${miss} question(s) sans réponse. Envoyer quand même ?`)) return; submitBilan(key, qs, false); };
}
function submitBilan(key, qs, auto) {
  const B = APP.state.bilans[key]; if (B.submittedAt) return;
  const detail = qs.map((it, k) => { const q = it.q, a = B.answers[k]; const ok = q.t === "num" ? numOk(a, q.r, q.tol) : a === q.a; return { mod: it.mod, idx: it.idx, ok }; });
  B.score = detail.filter(d => d.ok).length; B.total = qs.length; B.note20 = Math.round(B.score / B.total * 200) / 10;
  B.submittedAt = nowISO(); B.dur = Math.round((new Date(B.submittedAt) - new Date(B.start)) / 1000); B.auto = !!auto; B.detail = detail;
  APP.evalActive = null;
  logEv("bilan", { key, note20: B.note20, dur: B.dur, auto: !!auto });
  saveNow(); if (auto) toast("Temps écoulé : ton bilan a été envoyé."); bilanResult(key, qs);
}
function bilanResult(key, qs) {
  const stu = APP.stu, B = APP.state.bilans[key];
  const byMod = {}; B.detail.forEach(d => { byMod[d.mod] = byMod[d.mod] || [0, 0]; byMod[d.mod][1]++; if (d.ok) byMod[d.mod][0]++; });
  const isFinal = key === "FINAL";
  shell(`<div class="crumbs"><a href="#/">Mon parcours</a></div>
    <div class="card section"><div class="section-title"><h1 class="mb0">${isFinal ? "Bilan final" : "Bilan de mi-parcours"}</h1><span class="pill ${B.note20 >= 10 ? "ok" : B.note20 >= 8 ? "warn" : "bad"}">${fmt1(B.note20)} / 20</span></div>
      <p>${B.score} bonnes réponses sur ${B.total} en ${fmtDuration(B.dur)}${B.auto ? " (envoi automatique à la fin du temps)" : ""}.</p>
      ${isFinal ? `<p class="muted">Positionnement initial : ${fmt1(stu.moyenne_initiale)}/20. Ton formateur fera le point avec toi sur la suite.</p>` : `<p class="muted">Utilise ce résultat pour cibler tes révisions de la semaine 2.</p>`}
      <table class="dt"><tr><th>Module</th><th class="num">Réussite</th></tr>${Object.entries(byMod).map(([id, [o, n]]) => `<tr><td><span class="pill bloc bloc-${MODULES[id].bloc}">${id}</span> ${esc(MODULES[id].titre)}</td><td class="num">${o}/${n}</td></tr>`).join("")}</table>
      <div class="btn-row" style="margin-top:14px"><a class="btn primary" href="#/">Retour au planning</a></div></div>
    <div class="card"><h3>Correction</h3>${qs.map((it, k) => { const q = it.q, a = B.answers[k], ok = B.detail[k].ok;
      const mine = q.t === "num" ? (a || "—") : (q.o[a] || "—"); const good = q.t === "num" ? (String(q.r).replace(".", ",") + " " + (q.u || "")) : q.o[q.a];
      return `<div class="ex"><div class="q"><span class="n">${k + 1}.</span>${q.q}</div><div class="small">Ta réponse : <b>${esc(mine)}</b> ${ok ? "✅" : "❌"}${ok ? "" : ` — bonne réponse : <b>${good}</b>`}</div><div class="fb info">${q.c}</div></div>`; }).join("")}</div>`, { narrow: true });
}

async function routeFormateur(parts) {

    const ses = SS.get("pp_session");

function hydrate(st) {

}

function download(name, content, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

          return d.modules.map((id, k) => { const ms = st.modules[id] || { steps: {} }; const q = ms.steps.quiz; const sit = ms.steps.situation;

function countProductions(s, st) { let n = 0; allModules(s).forEach(id => { const ms = st.modules[id]; if (!ms) return; if (ms.steps.situation && ms.steps.situation.submittedAt) n++; if (ms.steps.mission && ms.steps.mission.at) n++; }); return n; }

function timeChart(s, st) {
  if (!st.startedAt) return `<p class="muted">Aucune activité.</p>`;
  const start = new Date(st.startedAt); const days = [];
  const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()); const today = new Date();
  while (d <= today && days.length < 28) { days.push(new Date(d)); d.setDate(d.getDate() + 1); }
  const vals = days.map(x => Math.round((st.time.byDay[dayKey(x)] || 0) / 60));
  const max = Math.max(90, ...vals); const W = 520, H = 190, pad = 28, bw = (W - pad - 6) / days.length;
  const y = v => H - 22 - (v / max) * (H - 40);
  return `<svg class="svgchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes de travail par jour">
    ${[0, 45, 90].filter(v => v <= max).map(v => `<line class="gridl" x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="0" y="${y(v) + 4}">${v}′</text>`).join("")}
    ${vals.map((v, i) => { const x = pad + i * bw + 2, w = Math.max(3, bw - 4); const we = !isWorkday(days[i]);
      return `<rect class="barr" x="${x}" y="${y(v)}" width="${w}" height="${H - 22 - y(v)}" rx="2" opacity="${we ? .45 : 1}"><title>${fmtDay(days[i])} : ${v} min</title></rect>${v ? `<text class="bart" x="${x + w / 2}" y="${y(v) - 4}" text-anchor="middle">${v}</text>` : ""}<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${days[i].getDate()}</text>`; }).join("")}
  </svg><p class="tiny muted">Minutes d'activité effective (onglet visible et interaction récente). Barres claires : week-ends et jours fériés. Objectif : environ 90 min par jour ouvré.</p>`;
}

function renderProductions(box, s, st, fbs) {
  const fbFor = item => fbs.filter(f => f.item === item);
  const fbBlock = item => `<div>${fbFor(item).map(f => `<div class="feedback-item"><div class="tiny muted">${fmtDateTime(f.created_at)}</div>${esc(f.message)}</div>`).join("")}
    <div class="btn-row" style="margin-top:8px;align-items:flex-start"><textarea class="input" id="fb-${item.replace(/[^a-z0-9]/gi, "_")}" rows="2" style="flex:1;min-width:220px" placeholder="Votre retour à l'élève…"></textarea><button class="btn small primary" onclick="sendFb('${s.code}','${item}')">Envoyer</button></div></div>`;
  let html = `<div class="card"><h3>Message général à ${esc(s.prenom)}</h3>${fbBlock("general")}</div>`;
  allModules(s).forEach(id => {
    const ms = st.modules[id]; const sit = ms && ms.steps.situation; const mis = ms && ms.steps.mission; const m = MODULES[id];
    if (!(sit && sit.submittedAt) && !(mis && mis.at)) return;
    html += `<div class="card section"><div class="section-title"><h3 class="mb0"><span class="pill bloc bloc-${m.bloc}">${id}</span> ${esc(m.titre)}</h3></div>`;
    if (sit && sit.submittedAt) {
      html += `<div class="prod"><div class="head"><b>${esc(m.situation.titre)}</b><span class="small muted">Envoyée le ${fmtDateTime(sit.submittedAt)} · auto-évaluation ${sit.done ? sit.selfScore + "/" + m.situation.grille.length : "non faite"}</span></div>
        ${m.situation.questions.map((q, i) => `<div class="small" style="margin-top:8px"><b>${i + 1}. ${esc(q)}</b></div><div class="txt">${esc(sit.answers[i] || "")}</div><div class="tiny muted">${(sit.answers[i] || "").length} caractères${sit.paste && sit.paste[i] ? ` · <span style="color:var(--bad)">${sit.paste[i]} collage(s) détecté(s)</span>` : ""}</div>`).join("")}
        ${sit.self ? `<details style="margin-top:8px"><summary class="small">Grille d'auto-évaluation</summary><ul class="small">${m.situation.grille.map((g, i) => `<li>${sit.self[i] ? "✅" : "⬜"} ${esc(g)}</li>`).join("")}</ul></details>` : ""}
        <details><summary class="small">Voir le corrigé</summary><div class="corrige small">${m.situation.corrige.map((c, i) => `<b>${i + 1}.</b> ${c}`).join("")}</div></details>
        <h4>Retour sur la mise en situation</h4>${fbBlock(id + ":situation")}</div>`;
    }
    if (mis && mis.at) {
      html += `<div class="prod"><div class="head"><b>${esc(m.mission.titre)}</b><span class="small muted">Rendue le ${fmtDateTime(mis.at)} · ${mis.text.length} caractères${mis.paste ? ` · <span style="color:var(--bad)">${mis.paste} collage(s)</span>` : ""}</span></div>
        <div class="txt">${esc(mis.text)}</div><h4>Retour sur la mission</h4>${fbBlock(id + ":mission")}</div>`;
    }
    html += `</div>`;
  });
  if (!countProductions(s, st)) html += `<div class="card empty section">Aucune production écrite rendue pour l'instant.</div>`;
  box.innerHTML = html;
}
async function sendFb(code, item) {
  const ta = document.getElementById("fb-" + item.replace(/[^a-z0-9]/gi, "_"));
  const msg = ta.value.trim(); if (!msg) return;
  try { await DB.addFeedback(code, item, msg); toast("Retour envoyé à l'élève."); viewTrainerStudent(code, "productions"); }
  catch (e) { toast("Échec de l'envoi : " + e.message); }
}

function renderJournal(box, events) {
  const lab = {
    login: "Connexion", start: "Démarrage du parcours (charte signée)", step: "Étape validée", exercise: "Exercice", situation: "Mise en situation envoyée", quiz: "Quiz", mission: "Mission rendue",
    paste: "⚠️ Collage de texte", blur: "⚠️ Sortie d'onglet pendant une évaluation", bilan_start: "Bilan démarré", bilan: "Bilan envoyé", feedback_read: "Retours lus"
  };

    if (e.type === "step") return `${p.module} · ${STEP_LABEL[p.step] || p.step}${p.time ? " · " + fmtDuration(p.time) : ""}${p.firstOk != null ? " · " + p.firstOk + " réussis 1ᵉʳ essai" : ""}${p.self != null ? " · auto-éval " + p.self : ""}`;
    if (e.type === "exercise") return `${p.module} · n°${p.i + 1} · ${p.ok ? (p.first ? "juste 1ᵉʳ essai" : "juste 2ᵉ essai") : "faux"}`;

}

function copyInvite(code) { const link = location.href.split("#")[0]; const msg = `Bonjour, voici ton parcours personnalisé de remise à niveau BTS MCO : ${link}\nTon code d'accès personnel : ${code}\nUne séance d'environ 1 h 30 par jour ouvré pendant deux semaines.`; (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(() => toast("Message copié"), () => prompt("Copiez ce message :", msg)); }
async function mutateState(code, fn) { const st = hydrate(await DB.getState(code)); fn(st); await DB.saveState(code, st); }
async function resetModule(code, all) {
  const id = $("#modsel").value; if (!confirm(all ? `Effacer toute la progression du module ${id} ?` : `Autoriser de nouvelles tentatives au quiz ${id} (les anciennes tentatives sont conservées dans l'historique) ?`)) return;

  await DB.addEvent(code, "step", { module: id, step: all ? "réinitialisation module (formateur)" : "réinitialisation quiz (formateur)" });
  toast("Fait."); viewTrainerStudent(code, "reglages");
}
async function resetBilan(code, key) {

  await mutateState(code, st => { if (st.bilans[key]) { st.bilans[key + "_archive_" + Date.now()] = Object.assign({}, st.bilans[key], { archived: true, submittedAt: null }); delete st.bilans[key]; } });
  toast("Nouvelle passation autorisée."); viewTrainerStudent(code, "reglages");
}

async function deleteStudent(code) { if (prompt(`Pour supprimer définitivement l'élève et toutes ses données, tapez son code (${code}) :`) !== code) return; await DB.deleteStudent(code); toast("Élève supprimé."); location.hash = "#/formateur"; }

  const f = $("#nf"); const v = n => f[n].value;
  const pos = {}; Object.keys(COMPETENCES).filter(c => c !== "SYNTH").forEach(c => pos[c] = Number(v(c)));
  const blocs = { 1: Number(v("b1")), 2: Number(v("b2")), 3: Number(v("b3")), 4: Number(v("b4")) };
  const profil = { savoirs: Number(v("savoirs")), application: Number(v("application")), analyse: Number(v("analyse")) };
  const p1 = TRAINABLE.filter(c => pos[c] < 40).sort((a, b) => pos[a] - pos[b] || blocWeight(a, blocs) - blocWeight(b, blocs));
  const p2 = TRAINABLE.filter(c => pos[c] >= 40 && pos[c] < 65).sort((a, b) => pos[a] - pos[b]);
  const selected = p1.concat(p2).slice(0, 14);
  PROPOSAL = { pos, blocs, profil, order: selected, synth: profil.analyse < 35, prenom: v("prenom").trim(), nom: v("nom").trim().toUpperCase(), classe: v("classe"), date: v("date"), vigilance: v("vigilance").split("\n").map(x => x.trim()).filter(Boolean) };
  drawProposal();
}
function blocWeight(c, blocs) { return blocs[MODULES[c].bloc]; }
function distribute(mods) {
  const n = mods.length, days = Math.max(5, Math.min(10, n));
  const sizes = Array(days).fill(1); if (n < days) for (let i = n; i < days; i++) sizes[i] = 0;
  const extraOrder = [6, 8, 2, 7, 4, 9, 1, 5, 3, 0];
  for (let k = 0; k < n - days; k++) sizes[extraOrder[k % days] % days]++;
  const plan = []; let idx = 0;
  for (let d = 0; d < days; d++) { const ms = mods.slice(idx, idx + sizes[d]); idx += sizes[d]; if (ms.length) plan.push({ jour: plan.length + 1, modules: ms }); }
  const mid = Math.min(5, plan.length); plan[mid - 1].bilan = "S1"; if (plan.length > mid) plan[plan.length - 1].bilan = "FINAL"; else plan[plan.length - 1].bilan = "FINAL";
  return plan;
}
function drawProposal() {
  const P = PROPOSAL; const mods = P.order.concat(P.synth ? ["SYNTH"] : []);
  if (!mods.length) { $("#proposal").innerHTML = `<div class="alert warn">Aucune compétence sous 65 % : un parcours de remédiation n'est pas nécessaire.</div>`; return; }
  const plan = distribute(mods);
  P.plan = plan;
  $("#proposal").innerHTML = `<div class="card section"><h3>Modules proposés (ordre de priorité)</h3>
    <p class="small muted">Priorité 1 : compétences sous 40 %, de la plus faible à la plus forte. Priorité 2 : entre 40 et 65 %. Ajustez l'ordre ou retirez des modules.</p>
    ${P.order.map((c, i) => `<div class="check" style="align-items:center"><span class="pill ${P.pos[c] < 40 ? "bad" : "warn"}">${P.pos[c]} %</span><span class="pill bloc bloc-${MODULES[c].bloc}">${c}</span><span style="flex:1">${esc(MODULES[c].titre)}</span>
      <button class="btn small ghost" onclick="moveMod(${i},-1)" ${i === 0 ? "disabled" : ""}>↑</button><button class="btn small ghost" onclick="moveMod(${i},1)" ${i === P.order.length - 1 ? "disabled" : ""}>↓</button><button class="btn small ghost" onclick="removeMod(${i})">Retirer</button></div>`).join("")}
    <div class="btn-row" style="margin-top:10px"><select class="input" id="addm" style="max-width:340px"><option value="">Ajouter un module…</option>${TRAINABLE.filter(c => !P.order.includes(c)).map(c => `<option value="${c}">${c} — ${esc(MODULES[c].titre)} (${P.pos[c]} %)</option>`).join("")}</select>
      <label class="check" style="border:none"><input type="checkbox" id="syn" ${P.synth ? "checked" : ""}><span>Journée « Méthode : analyser, décider, argumenter » en fin de parcours</span></label></div></div>
  <div class="card section"><h3>Planning généré</h3><div class="scroll-x"><table class="dt">${plan.map(d => `<tr><td><b>Jour ${d.jour}</b></td><td>${d.modules.map(id => `<span class="pill bloc bloc-${MODULES[id].bloc}">${id}</span> ${esc(MODULES[id].titre)}`).join("<br>")}${d.bilan ? `<br><span class="pill brand">${d.bilan === "S1" ? "Bilan mi-parcours" : "Bilan final"}</span>` : ""}</td><td class="num">${d.modules.reduce((s, id) => s + MODULES[id].duree, 0)} min</td></tr>`).join("")}</table></div>
    <label class="field"><span>Objectif affiché à l'élève</span><input class="input" id="obj" value="Consolider les compétences prioritaires du positionnement et atteindre au moins 10/20 de moyenne aux blocs professionnels."></label>
    <div class="btn-row"><button class="btn primary" onclick="saveProposal()">Créer le parcours et générer le code d'accès</button></div></div>`;
  $("#addm").onchange = e => { if (e.target.value) { P.order.push(e.target.value); drawProposal(); } };
  $("#syn").onchange = e => { P.synth = e.target.checked; drawProposal(); };
}
function moveMod(i, d) { const o = PROPOSAL.order; [o[i], o[i + d]] = [o[i + d], o[i]]; drawProposal(); }
function removeMod(i) { PROPOSAL.order.splice(i, 1); drawProposal(); }
async function saveProposal() {
  const P = PROPOSAL; const existing = (await DB.listStudents()).map(s => s.code);
  const ini = (P.prenom.slice(0, 1) + P.nom.replace(/[^A-Z]/g, "").slice(0, 2)).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  let code; do { code = `MCO-${ini}-${String(10 + Math.floor(Math.random() * 90))}`; } while (existing.includes(code));
  const moy = Math.round((P.blocs[1] + P.blocs[2] + P.blocs[3] + P.blocs[4]) / 4 * 10) / 10;
  const stu = { code, nom: `${P.prenom} ${P.nom}`, prenom: P.prenom, classe: P.classe, date_positionnement: P.date || dayKey().split("-").reverse().join("/"), moyenne_initiale: moy, blocs_initiaux: P.blocs, profil: P.profil, positionnement: P.pos, vigilance: P.vigilance, objectif: $("#obj").value, planning: P.plan };
  try { await DB.saveStudent(stu); toast(`Parcours créé. Code : ${code}`, 5000); location.hash = `#/formateur/eleve/${code}/reglages`; }
  catch (e) { toast("Échec de l'enregistrement : " + e.message); }
}

/* ---- Bibliothèque des contenus (lecture seule) ---- */
let SHOW_ANS = true;
function viewTrainerContent(id) {
  const order = ["C1.2", "C1.3", "C1.4", "C2.2", "C2.3", "C2.4", "C2.5", "C3.1", "C3.2", "C3.3", "C4.1", "C4.2", "C4.3", "C4.4", "SYNTH"].filter(x => MODULES[x]);
  if (!id || !MODULES[id]) {
    const groups = [1, 2, 3, 4, 0];
    shell(`<div class="crumbs"><a href="#/formateur">Élèves</a> › Contenus</div><h1>Bibliothèque des contenus</h1>
      <p class="muted">Les ${order.length} modules tels que les élèves les voient, avec les corrigés. Consultation seule : rien n'est enregistré dans les parcours.</p>
      ${groups.map(b => { const ms = order.filter(x => MODULES[x].bloc === b); if (!ms.length) return "";
        return `<div class="section"><h2>${b ? `<span class="pill bloc bloc-${b}">Bloc ${b}</span> ${esc(BLOCS[b])}` : "Méthode transversale"}</h2><div class="grid g3">${ms.map(x => { const m = MODULES[x];
          return `<a class="card student-card" style="text-decoration:none;color:inherit" href="#/formateur/contenus/${x}"><span class="pill bloc bloc-${m.bloc}">${x === "SYNTH" ? "Méthode" : x}</span><h3 style="margin-top:8px">${esc(m.titre)}</h3><p class="small muted">${esc(m.sous)}</p><p class="tiny muted">${m.duree} min · ${m.exercices.length} exercices · ${m.quiz.length} questions de quiz · ${m.bilan.length} questions de bilan</p></a>`; }).join("")}</div></div>`; }).join("")}`);
    return;
  }
  const m = MODULES[id], k = order.indexOf(id), prev = order[k - 1], next = order[k + 1];
  const L = "ABCD";
  const ans = SHOW_ANS;
  const qcm = (q, seed) => { const ord = shuffled(q.o.map((_, j) => j), seed); return `<div class="opts">${ord.map((oi, j) => `<div class="opt ${ans && oi === q.a ? "good" : ""}"><span class="k">${L[j]}</span><span>${q.o[oi]}</span></div>`).join("")}</div>`; };
  const item = (x, i, pre) => {
    let body = x.t === "num" ? `<div class="small muted">Réponse numérique${x.u ? " en " + esc(x.u) : ""}${ans ? ` · attendu : <b>${String(x.r).replace(".", ",")}</b>${x.tol ? ` (tolérance ± ${String(x.tol).replace(".", ",")})` : ""}` : ""}</div>`
      : x.t === "vf" ? `<div class="small muted">Vrai ou faux${ans ? ` · réponse : <b>${x.a ? "Vrai" : "Faux"}</b>` : ""}</div>` : qcm(x, id + pre + i);
    return `<div class="ex"><div class="q"><span class="n">${i + 1}.</span>${x.q}</div>${body}${ans ? `<div class="fb info">${x.c}</div>` : ""}</div>`;
  };
  const sec = (n, t, html) => `<div class="card section"><div class="section-title"><h2 class="mb0"><span class="muted">${n}.</span> ${t}</h2></div>${html}</div>`;
  shell(`<div class="crumbs"><a href="#/formateur">Élèves</a> › <a href="#/formateur/contenus">Contenus</a> › ${id}</div>
    <div class="mod-head bloc-${m.bloc}"><span class="pill bloc bloc-${m.bloc}">${m.bloc ? "Bloc " + m.bloc + " · " + id : "Méthode transversale"}</span><h1>${esc(m.titre)}</h1><div class="muted">${esc(m.sous)} · ${m.duree} min</div></div>
    <div class="sticky-bar"><label class="check" style="border:none;padding:0"><input type="checkbox" id="ansT" ${ans ? "checked" : ""}><span>Afficher les corrigés</span></label>
      <div class="btn-row">${prev ? `<a class="btn small" href="#/formateur/contenus/${prev}">← ${prev === "SYNTH" ? "Méthode" : prev}</a>` : ""}${next ? `<a class="btn small" href="#/formateur/contenus/${next}">${next === "SYNTH" ? "Méthode" : next} →</a>` : ""}</div></div>
    <div class="content">
    <div class="objectifs"><b>Objectifs du module</b><ul>${m.objectifs.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>
    ${sec(1, "Cours", `<p class="small muted">Temps de lecture minimum imposé à l'élève : ${Math.round(minRead(id) / 60)} min, et défilement jusqu'en bas.</p>${m.cours.map(c => `<h3>${esc(c.t)}</h3>${c.h}`).join("")}`)}
    ${sec(2, "Exemple résolu", `<div class="formule" style="font-weight:500">${esc(m.exemple.enonce)}</div>${m.exemple.etapes.map((e, i) => `<div class="reveal-step on"><h4>Étape ${i + 1} — ${esc(e.t)}</h4><div>${e.h}</div></div>`).join("")}<p class="tiny muted">L'élève découvre les étapes une par une.</p>`)}
    ${sec(3, "Exercices auto-corrigés", `<p class="small muted">Deux essais pour les calculs, un pour les QCM ; la correction s'affiche ensuite. Les propositions des QCM sont mélangées pour chaque élève.</p>${m.exercices.map((x, i) => item(x, i, "ex")).join("")}`)}
    ${sec(4, "Mise en situation", `<h3>${esc(m.situation.titre)}</h3>${m.situation.contexte}<h4>Questions</h4><ol>${m.situation.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ol>
      ${ans ? `<h4>Corrigé</h4>${m.situation.corrige.map((c, i) => `<div class="corrige"><b>Question ${i + 1}</b>${c}</div>`).join("")}` : ""}
      <h4>Grille d'auto-évaluation</h4><ul>${m.situation.grille.map(g => `<li>${esc(g)}</li>`).join("")}</ul>`)}
    ${sec(5, "Quiz de validation", `<p class="small muted">${m.quiz.length} questions, ${QUIZ_PASS} % requis, ordre des questions et des réponses mélangé à chaque tentative.</p>${m.quiz.map((x, i) => item(Object.assign({ t: "qcm" }, x), i, "q")).join("")}`)}
    ${sec(6, "Mission en entreprise", `<h3>${esc(m.mission.titre)}</h3><p>${esc(m.mission.consigne)}</p>`)}
    ${sec("+", "Questions de bilan", `<p class="small muted">Questions inédites réservées aux bilans chronométrés (mi-parcours et final).</p>${m.bilan.map((x, i) => item(x, i, "b")).join("")}`)}
    </div>`);
  $("#ansT").onchange = e => { SHOW_ANS = e.target.checked; const y = window.scrollY; viewTrainerContent(id); window.scrollTo(0, y); };
}

route();

</script>
