<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcours de remédiation BTS MCO</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f4d45'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='12' font-weight='700' fill='white' text-anchor='middle'%3EMCO%3C/text%3E%3C/svg%3E">
<style>:root{
  --bg:#f4f5f2; --surface:#ffffff; --surface-2:#f9faf8; --line:#e2e4de; --line-2:#cfd3ca;
  --ink:#1c2420; --ink-2:#4a554f; --ink-3:#7a847e;
  --brand:#1f4d45; --brand-2:#2f6b60; --brand-soft:#e3eeea;
  --ok:#2e7d4f; --ok-soft:#e2f2e8; --warn:#b26a00; --warn-soft:#fcf0dc; --bad:#b3362c; --bad-soft:#fbe6e3;
  --b1:#2f64a8; --b1s:#e5edf8; --b2:#7a4aa6; --b2s:#f0e9f7; --b3:#c0621b; --b3s:#fbeee3; --b4:#2e7d4f; --b4s:#e2f2e8; --b0:#555f59; --b0s:#ecefec;
  --radius:12px; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.05);--on-brand:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a1f1c; --surface-2:#202622; --line:#2c332f; --line-2:#3a423d;
  --ink:#e7ece9; --ink-2:#b4beb8; --ink-3:#86908a;
  --brand:#7cc4b3; --brand-2:#9bd5c7; --brand-soft:#1f2f2b;
  --ok:#6cc68f; --ok-soft:#1c2e23; --warn:#e3a54a; --warn-soft:#33281a; --bad:#ec7f74; --bad-soft:#36201e;
  --b1:#7fa8e0; --b1s:#1c2735; --b2:#b591d8; --b2s:#2a2133; --b3:#e8975a; --b3s:#33251b; --b4:#6cc68f; --b4s:#1c2e23; --b0:#a3ada7; --b0s:#262c29;
  --shadow:0 1px 2px rgba(0,0,0,.3);--on-brand:#0f1f1b;
;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1c; --surface-2:#202622; --line:#2c332f; --line-2:#3a423d;
  --ink:#e7ece9; --ink-2:#b4beb8; --ink-3:#86908a;
  --brand:#7cc4b3; --brand-2:#9bd5c7; --brand-soft:#1f2f2b;
  --ok:#6cc68f; --ok-soft:#1c2e23; --warn:#e3a54a; --warn-soft:#33281a; --bad:#ec7f74; --bad-soft:#36201e;
  --b1:#7fa8e0; --b1s:#1c2735; --b2:#b591d8; --b2s:#2a2133; --b3:#e8975a; --b3s:#33251b; --b4:#6cc68f; --b4s:#1c2e23; --b0:#a3ada7; --b0s:#262c29;
  --shadow:0 1px 2px rgba(0,0,0,.3);--on-brand:#0f1f1b;
;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.6rem;letter-spacing:-.01em} h2{font-size:1.3rem} h3{font-size:1.08rem} h4{font-size:1rem;margin-top:1.1em}
p{margin:.45em 0 .8em}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);text-decoration:none}
.logo-mark{width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:0}

.logo small{display:block;font-weight:500;color:var(--ink-3);font-size:.76rem;line-height:1.1}
.spacer{flex:1}
.demo-banner{background:var(--warn-soft);color:var(--warn);font-size:.85rem;padding:6px 16px;text-align:center;border-bottom:1px solid var(--line)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Cards & layout */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.grid > .card + .card{margin-top:0}
.card.flat{box-shadow:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.section{margin:26px 0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-title h2{margin:0}
.muted{color:var(--ink-3)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.center{text-align:center}
.mt0{margin-top:0}.mb0{margin-bottom:0}

/* KPI */
.kpi{padding:16px}
.kpi .label{font-size:.78rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .value{font-size:1.75rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.84rem;color:var(--ink-2)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.bloc-1{--bc:var(--b1);--bs:var(--b1s)} .bloc-2{--bc:var(--b2);--bs:var(--b2s)} .bloc-3{--bc:var(--b3);--bs:var(--b3s)} .bloc-4{--bc:var(--b4);--bs:var(--b4s)} .bloc-0{--bc:var(--b0);--bs:var(--b0s)}
.pill.bloc{background:var(--bs);color:var(--bc);border-color:transparent}

/* Progress */
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.bar.ok > span{background:var(--ok)} .bar.warn > span{background:var(--warn)} .bar.bad > span{background:var(--bad)}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring::before{content:"";width:calc(100% - 18px);height:calc(100% - 18px);border-radius:50%;background:var(--surface);grid-area:1/1}
.ring b{grid-area:1/1;font-size:1.1rem;z-index:1;font-variant-numeric:tabular-nums}

/* Login */
.login{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px 16px}
.login .card{width:100%;max-width:440px;padding:28px}
.field{display:block;margin:14px 0}
.field > span{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px;color:var(--ink-2)}
.input,textarea.input,select.input{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input.code{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;font-size:1.1rem;text-align:center}
.error{color:var(--bad);font-size:.88rem;margin-top:8px}

/* Hero */
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero h1{margin:0}
.hero .meta{color:var(--ink-3);font-size:.9rem}

/* Days timeline */
.days{display:grid;gap:10px}
.day{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.day.locked{opacity:.55}
.day.current{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.day .num{font-weight:800;font-size:.8rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.day .num b{display:block;font-size:1.5rem;color:var(--ink);letter-spacing:0}
.day .date{font-size:.78rem;color:var(--ink-3)}
.day .mods{display:flex;flex-direction:column;gap:6px}
.day .mod-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day .mod-line .t{font-weight:600}
@media (max-width:620px){.day{grid-template-columns:56px 1fr}.day .actions{grid-column:1/-1}}

/* Module view */
.crumbs{font-size:.86rem;color:var(--ink-3);margin:18px 0 6px}
.crumbs a{text-decoration:none}
.mod-head{border-left:5px solid var(--bc);padding-left:14px;margin:6px 0 18px}
.mod-head h1{margin:4px 0}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:thin}
.step{flex:1 0 auto;min-width:118px;display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-2);font-size:.86rem;font-weight:600;text-align:left}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;background:var(--surface-2);border:1px solid var(--line-2);flex:none}
.step.active{border-color:var(--brand);color:var(--ink);box-shadow:0 0 0 2px var(--brand-soft)}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.step.locked{opacity:.5;cursor:not-allowed}
.content{font-size:1rem}
.content ul,.content ol{padding-left:1.3em;margin:.4em 0 .9em}
.content li{margin:.25em 0}
.content blockquote{margin:12px 0;padding:12px 16px;border-left:4px solid var(--line-2);background:var(--surface-2);border-radius:0 8px 8px 0;font-style:italic;color:var(--ink-2)}
.formule{background:var(--brand-soft);border-left:4px solid var(--brand);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-weight:600;font-variant-numeric:tabular-nums}
.schema{background:var(--surface-2);border:1px dashed var(--line-2);padding:10px 14px;border-radius:8px;margin:10px 0;text-align:center;font-weight:600}
.attention{background:var(--bad-soft);border-left:4px solid var(--bad);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.astuce{background:var(--ok-soft);border-left:4px solid var(--ok);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.tab{width:100%;border-collapse:collapse;margin:10px 0;font-size:.93rem;display:block;overflow-x:auto}
.tab tbody{display:table;width:100%}
.tab th,.tab td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.tab th{background:var(--surface-2);font-weight:700}
.objectifs{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:16px}
.objectifs ul{margin:.3em 0 0;padding-left:1.2em}
.read-gate{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;padding:14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.ex{border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0;background:var(--surface)}
.ex .q{font-weight:600;margin-bottom:10px}
.ex .q .n{display:inline-block;min-width:26px;color:var(--ink-3)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .k{font-weight:700;color:var(--ink-3);flex:none;width:18px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow .input{max-width:200px}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:.93rem}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.info{background:var(--surface-2);border:1px solid var(--line)}
.reveal-step{border-left:3px solid var(--line-2);padding:4px 0 4px 14px;margin:10px 0}
.reveal-step.on{border-color:var(--brand)}
.reveal-step h4{margin:0 0 4px}
.answer-box textarea{min-height:150px;resize:vertical;line-height:1.5}
.counter{font-size:.78rem;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.counter .warn{color:var(--warn)}
.corrige{background:var(--ok-soft);border-radius:10px;padding:12px 16px;margin-top:10px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--brand)}
.timer{font-family:var(--mono);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.sticky-bar{position:sticky;top:58px;z-index:10;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:12px}

/* Tables (formateur) */
.dt{width:100%;border-collapse:collapse;font-size:.9rem}
.dt th,.dt td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.dt th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700}
.dt td.num,.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.student-card{cursor:pointer;transition:border-color .15s}
.student-card:hover{border-color:var(--brand)}
.student-card .top{display:flex;gap:14px;align-items:center}
.student-card h3{margin:0}
.mini-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.mini-kpis div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.mini-kpis b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.mini-kpis span{font-size:.72rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
@media (max-width:560px){.mini-kpis{grid-template-columns:repeat(2,1fr)}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.comp-row{display:grid;grid-template-columns:62px 1fr 150px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.comp-bars{display:grid;gap:3px}
.comp-bars .bar{height:7px}
.comp-bars .bar.init > span{background:var(--ink-3)}
@media (max-width:560px){.comp-row{grid-template-columns:52px 1fr}.comp-row .vals{grid-column:2}}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:7px;border-radius:4px;margin-right:5px;vertical-align:middle}
.prod{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;background:var(--surface)}
.prod .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.prod .txt{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.92rem;margin:6px 0}
.feedback-item{border-left:3px solid var(--brand);background:var(--brand-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.feedback-item.new{border-color:var(--warn);background:var(--warn-soft)}
.log{font-family:var(--mono);font-size:.8rem}
.log td{padding:5px 8px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700}
.alert{padding:12px 14px;border-radius:10px;margin:10px 0;font-size:.93rem}
.alert.warn{background:var(--warn-soft);color:var(--ink)} .alert.bad{background:var(--bad-soft)} .alert.ok{background:var(--ok-soft)} .alert.info{background:var(--brand-soft)}
.svgchart{width:100%;height:auto;display:block}
.svgchart text{fill:var(--ink-3);font-size:11px;font-family:var(--font)}
.svgchart .gridl{stroke:var(--line)}
.svgchart .barr{fill:var(--brand)}
.svgchart .bart{fill:var(--ink-2);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.92rem;z-index:100;box-shadow:var(--shadow);max-width:90vw}
.footer{padding:30px 0 40px;color:var(--ink-3);font-size:.8rem;text-align:center}
.serious{display:flex;gap:10px;align-items:center}
.serious-dot{width:12px;height:12px;border-radius:50%}
.subscore{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:.86rem;margin:6px 0}
@media print{.topbar,.btn,.steps,.tabs{display:none!important}body{background:#fff}}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.btn:focus-visible,.opt:focus-visible,.step:focus-visible,.linkbtn:focus-visible,.demo-card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.demo-home .lead{font-size:1.08rem;max-width:66ch;color:var(--ink-2)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.flow-step{display:flex;flex-direction:column;gap:4px;padding:14px;border-top:3px solid var(--brand);background:var(--surface);border-radius:0 0 10px 10px}
.flow-n{font-weight:800;color:var(--brand);font-size:.8rem;letter-spacing:.06em}
@media (max-width:760px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.flow{grid-template-columns:1fr}}
.demo-card{text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:border-color .15s,transform .15s}
.demo-card:hover{border-color:var(--brand);transform:translateY(-2px)}
.demo-card h3{margin:4px 0 0}.demo-card p{margin:0 0 6px;flex:1}
.linkbtn{background:none;border:none;padding:0;color:var(--brand);text-decoration:underline;font:inherit;cursor:pointer}
.demo-guide{margin:16px 0 4px;padding:12px 16px;border:1px dashed var(--brand);border-radius:10px;background:var(--brand-soft)}
.demo-guide summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
.demo-guide summary::-webkit-details-marker{display:none}
.demo-guide ul{margin:10px 0 8px;padding-left:1.2em;font-size:.93rem}
.demo-guide .btn-row{gap:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* --- V2 : nouveaux exercices, correction guidée --- */
.ex-tab input.cell{width:112px;min-width:80px;padding:6px 8px;font-variant-numeric:tabular-nums}
.input.ok{border-color:var(--ok);background:var(--ok-soft)}
.input.ko{border-color:var(--bad);background:var(--bad-soft)}

.grade-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;max-height:78vh;overflow:auto}
.grade-col h3{position:sticky;top:-16px;background:var(--surface);padding:6px 0;margin-top:-6px}
.ga{margin:10px 0 14px}
.ga .q{font-weight:600;margin-bottom:6px}

details.ctx summary{cursor:pointer;font-weight:600;font-size:.9rem}
.crit{padding:12px 0;border-bottom:1px solid var(--line)}
.crit-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex:none}
.seg-b{border:none;background:var(--surface);padding:7px 12px;font-weight:600;font-size:.85rem;color:var(--ink-2)}
.seg-b + .seg-b{border-left:1px solid var(--line-2)}
.seg-b.on[data-lv="1"]{background:var(--ok-soft);color:var(--ok)}

<script>
/* =====================================================================
   CORE — utilitaires, stockage (Supabase REST ou local), métriques
   ===================================================================== */
const MODULES = {};
function M(m) { MODULES[m.id] = m; }
function X(id, o) { const m = MODULES[id]; if (!m) return; m.quiz = m.quiz.concat(o.quiz || []); m.bilan = m.bilan.concat(o.bilan || []); m.exercices = m.exercices.concat(o.auto || []); if (o.fiche) m.fiche = o.fiche; m.duree += 40; }

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const fmt1 = x => (Math.round(x * 10) / 10).toLocaleString("fr-FR");
const nowISO = () => new Date().toISOString();

function dayKey(d = new Date()) {
  const z = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}
function parseDayKey(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
const JOURS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
function fmtDay(d) { return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`; }
function fmtDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return `${d.getDate()} ${MOIS[d.getMonth()]} ${String(d.getHours()).padStart(2, "0")}h${String(d.getMinutes()).padStart(2, "0")}`;
}
function fmtDuration(sec) {
  sec = Math.round(sec || 0);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h) return `${h} h ${String(m).padStart(2, "0")}`;
  if (m) return `${m} min`;
  return `${sec} s`;
}
function ago(iso) {
  if (!iso) return "jamais";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return "à l'instant";
  if (s < 3600) return `il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  return `il y a ${Math.round(s / 86400)} j`;
}

/* Jours fériés français (métropole) 2026-2027 */
const FERIES = new Set(["2026-11-01", "2026-11-11", "2026-12-25", "2027-01-01", "2027-03-29", "2027-05-01", "2027-05-06", "2027-05-08", "2027-05-17", "2027-07-14", "2027-08-15", "2027-11-01", "2027-11-11", "2027-12-25"]);
function isWorkday(d) { const w = d.getDay(); return w !== 0 && w !== 6 && !FERIES.has(dayKey(d)); }
function addWorkdays(start, n) {
  const d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  let added = 0;
  while (added < n) { d.setDate(d.getDate() + 1); if (isWorkday(d)) added++; }
  return d;
}
function workdaysBetween(a, b) { // nb de jours ouvrés strictement après a jusqu'à b inclus
  const d = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const end = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  let n = 0;
  while (d < end) { d.setDate(d.getDate() + 1); if (isWorkday(d)) n++; }
  return n;
}

/* Aléatoire reproductible */
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = typeof seed === "number" ? seed : hashStr(String(seed)); return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffled(arr, seed) { const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function parseNum(v) {
  if (v == null) return NaN;
  const s = String(v).replace(/[\s  €%]/g, "").replace(/−/g, "-").replace(",", ".");
  if (s === "" || s === "-") return NaN;
  return Number(s);
}
function numOk(v, r, tol) { const x = parseNum(v); return !isNaN(x) && Math.abs(x - r) <= (tol || 0) + 1e-9; }
function plain(html) { return String(html).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }
function wordCount(html) { return plain(html).split(" ").filter(Boolean).length; }

const SS = {
  get(k) { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch (e) { return SS.mem[k] || null; } },
  set(k, v) { SS.mem[k] = v; try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { delete SS.mem[k]; try { sessionStorage.removeItem(k); } catch (e) { } },
  mem: {}
};
function toast(msg, ms = 2600) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}

/* =====================================================================
   STOCKAGE
   ===================================================================== */
const DB = {
  remote: !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY),
  async req(path, opts = {}) {
    const base = CONFIG.SUPABASE_URL.trim().replace(/\/+$/, "").replace(/\/rest\/v1$/, "");
    const url = base + "/rest/v1/" + path;
    const key = CONFIG.SUPABASE_ANON_KEY.trim();
    const auth = key.startsWith("eyJ") ? { Authorization: "Bearer " + key } : {}; // les clés sb_publishable_ ne s'envoient que dans apikey
    const res = await fetch(url, {
      method: opts.method || "GET",
      keepalive: !!opts.keepalive,
      headers: Object.assign({ apikey: key, "Content-Type": "application/json" }, auth, opts.headers || {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    if (!res.ok) throw new Error("Supabase " + res.status + " : " + (await res.text()).slice(0, 200));
    if (res.status === 204 || opts.noBody) return null;
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  },
  lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },

  async listStudents() {
    if (this.remote) {
      const rows = await this.req("pp_students?select=code,data&order=created_at.asc");
      return rows.map(r => r.data);
    }
    let list = this.lsGet("pp_students", null);
    if (!list) { list = JSON.parse(JSON.stringify(STUDENTS_SEED)); this.lsSet("pp_students", list); }
    return list;
  },
  async getStudent(code) {
    code = code.trim().toUpperCase();
    if (this.remote) {
      const rows = await this.req("pp_students?select=data&code=eq." + encodeURIComponent(code));
      if (rows.length) return rows[0].data;
      const seed = STUDENTS_SEED.find(s => s.code === code);
      if (seed) { await this.saveStudent(seed); return seed; }
      return null;
    }
    return (await this.listStudents()).find(s => s.code === code) || null;
  },
  async saveStudent(stu) {
    if (this.remote) {
      await this.req("pp_students", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: [{ code: stu.code, data: stu }], noBody: true });
      return;
    }
    const list = await this.listStudents();
    const i = list.findIndex(s => s.code === stu.code);
    if (i >= 0) list[i] = stu; else list.push(stu);
    this.lsSet("pp_students", list);
  },
  async deleteStudent(code) {
    if (this.remote) {
      for (const t of ["pp_events", "pp_feedback", "pp_state", "pp_students"]) await this.req(t + "?code=eq." + encodeURIComponent(code), { method: "DELETE", noBody: true });
      return;
    }
    this.lsSet("pp_students", (await this.listStudents()).filter(s => s.code !== code));
    ["pp_state_", "pp_events_", "pp_feedback_"].forEach(p => localStorage.removeItem(p + code));
  },
  async getState(code) {
    if (this.remote) {
      const rows = await this.req("pp_state?select=state,updated_at&code=eq." + encodeURIComponent(code));
      return rows.length ? rows[0].state : null;
    }
    return this.lsGet("pp_state_" + code, null);
  },
  async listStates() {
    if (this.remote) {
      const rows = await this.req("pp_state?select=code,state,updated_at");
      const o = {}; rows.forEach(r => o[r.code] = r.state); return o;
    }
    const o = {};
    (await this.listStudents()).forEach(s => { const st = this.lsGet("pp_state_" + s.code, null); if (st) o[s.code] = st; });
    return o;
  },
  async saveState(code, state, keepalive) {
    if (this.remote) {
      await this.req("pp_state", { method: "POST", keepalive, headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: [{ code, state, updated_at: nowISO() }], noBody: true });
      return;
    }
    this.lsSet("pp_state_" + code, state);
  },
  async addEvent(code, type, payload = {}) {
    const ev = { code, type, payload, created_at: nowISO() };
    try {
      if (this.remote) { await this.req("pp_events", { method: "POST", headers: { Prefer: "return=minimal" }, body: [ev], noBody: true }); return; }
      const l = this.lsGet("pp_events_" + code, []); l.push(ev); if (l.length > 800) l.splice(0, l.length - 800); this.lsSet("pp_events_" + code, l);
    } catch (e) { console.warn("event", e); }
  },
  async listEvents(code, limit = 300) {
    if (this.remote) return await this.req("pp_events?select=type,payload,created_at&code=eq." + encodeURIComponent(code) + "&order=created_at.desc&limit=" + limit);
    return this.lsGet("pp_events_" + code, []).slice().reverse().slice(0, limit);
  },
  async listFeedback(code) {
    if (this.remote) return await this.req("pp_feedback?select=id,item,message,created_at&code=eq." + encodeURIComponent(code) + "&order=created_at.desc");
    return this.lsGet("pp_feedback_" + code, []).slice().reverse();
  },
  async addFeedback(code, item, message) {
    const fb = { code, item, message, created_at: nowISO() };
    if (this.remote) { await this.req("pp_feedback", { method: "POST", headers: { Prefer: "return=minimal" }, body: [fb], noBody: true }); return; }
    const l = this.lsGet("pp_feedback_" + code, []); l.push(Object.assign({ id: Date.now() }, fb)); this.lsSet("pp_feedback_" + code, l);
  }
};

/* =====================================================================
   ÉTAT D'UN ÉLÈVE
   ===================================================================== */
function newState() {
  return { v: 2, startedAt: null, charteAt: null, modules: {}, bilans: {}, exams: {}, retestDone: null, time: { total: 0, byDay: {}, byModule: {} }, flags: { paste: 0, blur: 0 }, lastSeen: null, feedbackSeen: null, unlockAll: false };
}
function mst(state, id) {
  if (!state.modules[id]) state.modules[id] = { steps: {}, time: 0 };
  return state.modules[id];
}
const STEP_ORDER = ["cours", "exemple", "exercices", "situation", "quiz", "mission"];
const STEP_LABEL = { cours: "Cours", exemple: "Exemple résolu", exercices: "Exercices", situation: "Mise en situation", quiz: "Quiz de validation", mission: "Mission entreprise" };
const QUIZ_PASS = 70;

function stepDone(state, id, step) {
  const ms = state.modules[id]; if (!ms) return false;
  const s = ms.steps[step]; if (!s) return false;
  if (step === "quiz") return !!s.passed;
  if (step === "mission") return !!(s.text && s.at);
  return !!s.done;
}
function moduleDone(state, id) { return ["cours", "exemple", "exercices", "situation", "quiz"].every(st => stepDone(state, id, st)); }
function bilanDone(state, key) { return !!(state.bilans[key] && state.bilans[key].submittedAt); }
function examDone(state, id) { return !!(state.exams && state.exams[id] && state.exams[id].submittedAt); }
function retestDone(state) { return !!state.retestDone; }
function dayModulesDone(stu, state, i) { return stu.planning[i].modules.every(id => moduleDone(state, id)); }
function dayDone(stu, state, i) {
  const d = stu.planning[i];
  return dayModulesDone(stu, state, i) && (!d.exam || examDone(state, d.exam)) && (!d.bilan || bilanDone(state, d.bilan)) && (!d.retest || retestDone(state));
}
function dayUnlocked(stu, state, i) { return state.unlockAll || i === 0 || dayDone(stu, state, i - 1); }
function currentDay(stu, state) { const i = stu.planning.findIndex((d, k) => !dayDone(stu, state, k)); return i === -1 ? stu.planning.length : i; }
function plannedDate(stu, state, i) {
  const start = state.startedAt ? new Date(state.startedAt) : new Date();
  return addWorkdays(start, i);
}
function dayFinishedAt(stu, state, i) {
  const d = stu.planning[i]; const ts = [];
  for (const id of d.modules) { const q = state.modules[id] && state.modules[id].steps.quiz; if (!q || !q.passedAt) return null; ts.push(q.passedAt); }
  if (d.exam) { if (!examDone(state, d.exam)) return null; ts.push(state.exams[d.exam].submittedAt); }
  if (d.bilan) { if (!bilanDone(state, d.bilan)) return null; ts.push(state.bilans[d.bilan].submittedAt); }
  if (d.retest) { if (!retestDone(state)) return null; ts.push(state.retestDone); }
  return ts.sort().pop();
}
function allModules(stu) { const a = []; stu.planning.forEach(d => d.modules.forEach(m => { if (!a.includes(m)) a.push(m); })); return a; }
function allExams(stu) { return stu.planning.filter(d => d.exam).map(d => d.exam); }
function weekEndIndex(stu, di) { return Math.min(stu.planning.length - 1, Math.floor(di / 5) * 5 + 4); }

function progressPct(stu, state) {
  let tot = 0, done = 0;
  stu.planning.forEach(d => {
    d.modules.forEach(id => { ["cours", "exemple", "exercices", "situation", "quiz"].forEach(st => { tot++; if (stepDone(state, id, st)) done++; }); });
    if (d.exam) { tot += 4; if (examDone(state, d.exam)) done += 4; }
    if (d.bilan) { tot += 2; if (bilanDone(state, d.bilan)) done += 2; }
    if (d.retest) { tot += 1; if (retestDone(state)) done += 1; }
  });
  return pct(done, tot);
}

function scheduleStatus(stu, state, now = new Date()) {
  if (!state.startedAt) return { code: "none", label: "Pas encore commencé", cls: "", lateDays: 0 };
  const i = currentDay(stu, state);
  if (i >= stu.planning.length) return { code: "done", label: "Parcours terminé", cls: "ok", lateDays: 0 };
  const due = plannedDate(stu, state, i);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (today > due) { const n = workdaysBetween(due, today); return { code: "late", label: n >= 1 ? `En retard de ${n} jour${n > 1 ? "s" : ""}` : "En retard", cls: n >= 2 ? "bad" : "warn", lateDays: n }; }
  if (dayKey(today) === dayKey(due)) return { code: "ontime", label: "Dans les temps", cls: "ok", lateDays: 0 };
  return { code: "ahead", label: "En avance", cls: "ok", lateDays: 0 };
}

/* ---- Canal formateur → élève (table pp_feedback) : messages, notes, visios, re-test ---- */
function parseChannel(rows) {
  const out = { messages: [], grades: {}, visios: {}, retest: null };
  (rows || []).slice().sort((a, b) => (a.created_at < b.created_at ? -1 : 1)).forEach(r => {
    const it = r.item || "";
    if (it.startsWith("note:")) { try { out.grades[it.slice(5)] = Object.assign(JSON.parse(r.message), { at: r.created_at }); } catch (e) { } }
    else if (it.startsWith("visio:")) { try { out.visios[it.slice(6)] = Object.assign(JSON.parse(r.message), { at_saved: r.created_at }); } catch (e) { } }
    else if (it === "retest") { try { out.retest = Object.assign(JSON.parse(r.message), { at: r.created_at }); } catch (e) { } }
    else out.messages.push(r);
  });
  out.messages.reverse();
  return out;
}
/* Productions notées : kind situation|fiche|exam ; ref = module ou examen */
function productions(stu, state) {
  const list = [];
  allModules(stu).forEach(id => {
    const ms = state.modules[id]; if (!ms) return;
    const sit = ms.steps.situation; if (sit && sit.submittedAt) list.push({ kind: "situation", ref: id, at: sit.submittedAt, title: MODULES[id].situation.titre.replace("Mise en situation — ", "").replace("Cas de synthèse — ", ""), mod: id });
    const mi = ms.steps.mission; if (MODULES[id].fiche && mi && mi.at) list.push({ kind: "fiche", ref: id, at: mi.at, title: "Fiche de situation professionnelle — " + MODULES[id].titre, mod: id });
  });
  allExams(stu).forEach(ex => { const e = state.exams && state.exams[ex]; if (e && e.submittedAt) list.push({ kind: "exam", ref: ex, at: e.submittedAt, title: EXAMS[ex].titre }); });
  return list;
}
function gradeKey(p) { return p.kind + ":" + p.ref; }
function criteriaFor(kind, ref) {
  if (kind === "exam") return EXAMS[ref].criteres;
  if (kind === "fiche") return FICHE_GRILLE;
  const g = MODULES[ref].situation.grille; const pts = Math.round(20 / g.length * 100) / 100;
  return g.map(t => ({ t, pts, hint: "" }));
}
function pendingCopies(stu, state, grades) { return productions(stu, state).filter(p => { const g = grades[gradeKey(p)]; return !g || g.at < p.at; }); }
function gradesAverage(grades) { const v = Object.values(grades).map(g => g.note20).filter(x => typeof x === "number"); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null; }

function quizBest(state, id) { const q = state.modules[id] && state.modules[id].steps.quiz; return q && q.attempts && q.attempts.length ? Math.max(...q.attempts.map(a => a.pct)) : null; }
function exerciseFirstTry(state, id) {
  const m = MODULES[id]; const e = state.modules[id] && state.modules[id].steps.exercices;
  if (!e || !e.items) return null;

/* Indice de sérieux et de suivi (0-100) */
function seriousness(stu, state, now = new Date()) {
  const notes = [];
  if (!state.startedAt) return { score: null, parts: {}, notes: ["Parcours non commencé."] };
  const start = new Date(state.startedAt);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const elapsed = 1 + workdaysBetween(new Date(start.getFullYear(), start.getMonth(), start.getDate()), today);
  const expectedDays = Math.min(elapsed, stu.planning.length);
  const activeDays = Object.entries(state.time.byDay || {}).filter(([k, s]) => s >= 20 * 60).length;
  const regularite = clamp(Math.round(100 * activeDays / Math.max(1, expectedDays)), 0, 100);
  if (regularite < 60) notes.push("Travail irrégulier : peu de jours avec au moins 20 minutes d'activité.");
  let pSum = 0, pN = 0;
  stu.planning.forEach((d, i) => {
    const due = plannedDate(stu, state, i);
    if (due > today) return;
    pN++;
    const fin = dayFinishedAt(stu, state, i);
    if (fin) { const f = new Date(fin); pSum += (dayKey(f) <= dayKey(due)) ? 1 : (workdaysBetween(due, f) <= 1 ? 0.6 : 0.3); }
  });
  const ponctualite = pN ? Math.round(100 * pSum / pN) : 100;
  if (ponctualite < 60) notes.push("Plusieurs journées n'ont pas été terminées à la date prévue.");
  let iSum = 0, iN = 0, shortAns = 0;
  allModules(stu).forEach(id => {
    if (!moduleDone(state, id)) return; iN++;
    const ms = state.modules[id]; const exp = MODULES[id].duree * 60;
    iSum += clamp((ms.time || 0) / (0.6 * exp), 0, 1);
    const sit = ms.steps.situation; if (sit && sit.answers) sit.answers.forEach(a => { if ((a || "").trim().length < 200) shortAns++; });
  });
  let investissement = iN ? Math.round(100 * iSum / iN) : 100;
  if (shortAns) { investissement = Math.max(0, investissement - shortAns * 4); notes.push(`${shortAns} réponse(s) rédigée(s) très courte(s) (moins de 200 caractères).`); }
  if (iN && iSum / iN < 0.6) notes.push("Temps passé nettement inférieur au temps attendu sur les modules validés.");
  let pen = 0;
  const paste = state.flags.paste || 0, blur = state.flags.blur || 0;
  pen += paste * 6 + Math.max(0, blur - 1) * 4;
  let rushed = 0;
  allModules(stu).forEach(id => { const q = state.modules[id] && state.modules[id].steps.quiz; if (q && q.attempts) q.attempts.forEach(a => { if (a.dur < 90) rushed++; }); });
  pen += rushed * 3;
  const missionsDue = allModules(stu).filter(id => { const di = stu.planning.findIndex(d => d.modules.includes(id)); return plannedDate(stu, state, weekEndIndex(stu, di)) < today; });
  const missionsDone = missionsDue.filter(id => stepDone(state, id, "mission")).length;
  const missionRate = missionsDue.length ? missionsDone / missionsDue.length : 1;
  const rigueur = clamp(Math.round(0.6 * clamp(100 - pen, 0, 100) + 0.4 * 100 * missionRate), 0, 100);
  if (paste) notes.push(`${paste} collage(s) de texte détecté(s) dans les réponses rédigées.`);
  if (blur > 1) notes.push(`${blur} sortie(s) de l'onglet pendant un quiz ou un bilan.`);
  if (rushed) notes.push(`${rushed} tentative(s) de quiz réalisée(s) en moins de 90 secondes.`);
  if (missionsDue.length && missionRate < 1) notes.push(`${missionsDue.length - missionsDone} mission(s) ou fiche(s) de situation non rendue(s) à échéance.`);
  const score = Math.round(0.25 * regularite + 0.25 * ponctualite + 0.25 * investissement + 0.25 * rigueur);
  return { score, parts: { regularite, ponctualite, investissement, rigueur }, notes };
}
function seriousLevel(score) {
  if (score == null) return { label: "—", cls: "", color: "var(--ink-3)" };
  if (score >= 75) return { label: "Engagement solide", cls: "ok", color: "var(--ok)" };
  if (score >= 50) return { label: "À encourager", cls: "warn", color: "var(--warn)" };
  return { label: "Alerte", cls: "bad", color: "var(--bad)" };
}

function alertsFor(stu, state, now = new Date()) {
  const a = [];
  if (!state || !state.startedAt) { a.push({ cls: "warn", t: "Le parcours n'a pas encore été commencé." }); return a; }
  const st = scheduleStatus(stu, state, now);
  if (st.lateDays >= 2) a.push({ cls: "bad", t: `Retard de ${st.lateDays} jours ouvrés sur le planning.` });
  else if (st.code === "late") a.push({ cls: "warn", t: "Léger retard sur le planning." });
  if (state.lastSeen && (now - new Date(state.lastSeen)) / 86400000 >= 3 && st.code !== "done") a.push({ cls: "bad", t: `Aucune connexion depuis ${Math.floor((now - new Date(state.lastSeen)) / 86400000)} jours.` });
  if (state.flags.paste) a.push({ cls: "warn", t: `${state.flags.paste} collage(s) détecté(s) dans les productions écrites.` });
  if (state.flags.blur >= 3) a.push({ cls: "warn", t: `${state.flags.blur} sorties d'onglet pendant les évaluations.` });
  return a;
}

function bilanModules(stu, key) {
  if (key === "S1") return stu.planning.filter(d => d.jour <= 5).flatMap(d => d.modules);

    items = items.concat(pick);

<p>Le client passe d'un canal à l'autre : il se renseigne en ligne puis achète en magasin (<b>web-to-store</b>, ou ROPO : <i>research online, purchase offline</i>), essaie en magasin puis commande en ligne (<b>showrooming</b>), commande en ligne et retire en magasin (<b>click & collect</b>), réserve en ligne un produit en stock (e-réservation).</p>
<p>Conséquences pour le vendeur : le client arrive souvent <b>informé</b> (prix, avis, caractéristiques) ; le vendeur doit apporter ce qu'internet n'apporte pas (conseil personnalisé, démonstration, service, relation) et utiliser les outils numériques : tablette, consultation du stock en ligne, commande en magasin livrée à domicile, fiche client, envoi d'un devis par e-mail.</p>` },
    { t: "2. Les étapes de la vente conseil", h: `
<table class="tab"><tr><th>Étape</th><th>Objectif et techniques</th></tr>
<tr><td><b>1. Prise de contact</b></td><td>Accueillir (sourire, regard, salutation), règle des 4 × 20 : 20 premières secondes, 20 premiers mots, 20 premiers gestes, 20 cm du visage. Ne pas agresser : « Je vous laisse découvrir, je reste à votre disposition ».</td></tr>
<tr><td><b>2. Découverte</b></td><td>Comprendre les besoins et les mobiles : questions ouvertes (« Comment allez-vous l'utiliser ? »), fermées pour préciser, alternatives ; écoute active ; <b>reformulation</b> pour valider.</td></tr>

<tr><td><b>5. Conclusion</b></td><td>Repérer les signaux d'achat (questions sur la livraison, le paiement, manipulation prolongée) ; techniques : alternative (« Le bleu ou le gris ? »), récapitulatif des avantages, conclusion directe.</td></tr>
<tr><td><b>6. Vente additionnelle</b></td><td>Produit <b>complémentaire</b> (housse pour un téléphone), <b>supplémentaire</b> (deuxième article), montée en gamme, service (garantie, livraison).</td></tr>
<tr><td><b>7. Prise de congé et suivi</b></td><td>Remercier, rassurer sur le choix, proposer la carte de fidélité ou l'inscription au fichier, inviter à laisser un avis, relance par e-mail ou SMS (suivi omnicanal).</td></tr></table>` },
    { t: "3. Les mobiles d'achat et l'argumentation", h: `
<table class="tab"><tr><th>Mobile SONCAS</th><th>Le client dit…</th><th>Argument à privilégier</th></tr>
<tr><td><b>S</b>écurité</td><td>« Et s'il tombe en panne ? » « Je ne veux pas de mauvaise surprise »</td><td>Garantie, fiabilité, SAV, label</td></tr>
<tr><td><b>O</b>rgueil</td><td>« Je veux ce qui se fait de mieux » « Mes amis ont… »</td><td>Haut de gamme, exclusivité, image</td></tr>
<tr><td><b>N</b>ouveauté</td><td>« C'est le dernier modèle ? »</td><td>Innovation, dernière génération</td></tr>
<tr><td><b>C</b>onfort</td><td>« Je veux que ce soit simple et pratique »</td><td>Facilité d'utilisation, gain de temps, ergonomie</td></tr>
<tr><td><b>A</b>rgent</td><td>« C'est combien ? » « Il y a moins cher ? »</td><td>Rapport qualité-prix, économies d'usage, offre</td></tr>
<tr><td><b>S</b>ympathie</td><td>« J'aime bien venir ici » « Vous m'avez bien conseillé la dernière fois »</td><td>Relation, confiance, marque appréciée</td></tr></table>
<p>On ajoute souvent <b>E</b> pour <b>Environnement</b> (SONCASE) : durabilité, réparabilité, origine.</p>
<div class="formule">CAP : Caractéristique (ce qu'est le produit) → Avantage (ce que cela apporte AU CLIENT) → Preuve (ce qui le démontre)</div>
<p>Exemple : « Cet aspirateur a une autonomie de 60 minutes (C), vous faites toute la maison sans le recharger (A) : regardez, il a été testé par une association de consommateurs, et vous pouvez l'essayer ici (P). »</p>` },
    { t: "4. Objections et indicateurs", h: `
<table class="tab"><tr><th>Méthode</th><th>Principe</th></tr>
<tr><td>Reformulation / questionnement</td><td>« Trop cher par rapport à quoi ? » : faire préciser l'objection</td></tr>
<tr><td>Oui, mais…</td><td>Reconnaître puis nuancer avec un argument</td></tr>
<tr><td>Compensation</td><td>Admettre le point faible et le compenser par un avantage plus important</td></tr>
<tr><td>Boomerang (retournement)</td><td>Transformer l'objection en argument : « Justement, c'est parce qu'il est plus lourd qu'il est plus stable »</td></tr>
<tr><td>Preuve</td><td>Démonstration, essai, avis clients, comparatif</td></tr></table>
<p>Face à un prix vu moins cher en ligne : rappeler la valeur des services (conseil, essai, disponibilité immédiate, SAV de proximité, reprise de l'ancien appareil) ou appliquer la politique d'alignement de l'enseigne si elle existe.</p>

  cours: [
    { t: "1. Pourquoi et comment fidéliser", h: `
<p>Conquérir un nouveau client coûte en moyenne <b>5 fois plus cher</b> que conserver un client existant. Un client fidèle achète plus souvent, se montre moins sensible au prix et recommande le magasin.</p>
<p><b>Outils de fidélisation</b> : carte de fidélité et programme à points, club ou statut VIP, personnalisation grâce à la gestion de la relation client (GRC / CRM), communications ciblées (anniversaire, relance après achat), services (SAV, livraison, retouches, conseils d'entretien), événements réservés, application mobile.</p>
<div class="attention">Une carte de fidélité ne fidélise pas à elle seule : c'est la qualité de l'<b>expérience client</b> (accueil, conseil, simplicité, résolution des problèmes) qui crée l'attachement.</div>` },
    { t: "2. Les indicateurs de la relation client", h: `
<div class="formule">Taux de réachat (de fidélité) = Clients ayant racheté sur la période ÷ Clients de la période de référence × 100</div>
<div class="formule">Taux d'attrition = Clients perdus ÷ Clients en début de période × 100</div>
<h4>Le Net Promoter Score (NPS)</h4>
<p>Question : « Sur une échelle de 0 à 10, recommanderiez-vous notre magasin à un proche ? »</p>
<ul><li>9 ou 10 : <b>promoteurs</b> ; 7 ou 8 : <b>passifs</b> ; 0 à 6 : <b>détracteurs</b>.</li></ul>
<div class="formule">NPS = % de promoteurs − % de détracteurs (résultat entre −100 et +100)</div>
<p>Un NPS positif est correct ; au-dessus de 30 il est bon ; au-dessus de 50 il est excellent. Il peut être négatif.</p>
<h4>La valeur client (Customer Lifetime Value)</h4>
<div class="formule">Valeur client = Panier moyen × Nombre d'achats par an × Durée de la relation (années) × Taux de marque</div>
<p>Elle indique combien de marge un client rapporte sur toute sa relation avec le magasin, et donc combien on peut dépenser pour le conquérir ou le garder.</p>` },

<ol><li><b>Écouter</b> sans interrompre, s'isoler si le client est énervé.</li>
<li><b>Reformuler</b> pour montrer qu'on a compris, faire preuve d'<b>empathie</b>, s'excuser pour la gêne.</li>
<li><b>Rechercher une solution</b> (dans le cadre des procédures et de la loi : garantie légale de conformité de 2 ans), la proposer, obtenir l'accord du client.</li>
<li><b>Agir</b> rapidement et <b>assurer le suivi</b> (rappeler le client).</li>
<li><b>Enregistrer</b> la réclamation pour en analyser les causes et éviter qu'elle se reproduise.</li></ol>
<p>Une réclamation bien traitée peut rendre un client plus fidèle qu'avant (« paradoxe de la réclamation »).</p>
<h4>Répondre à un avis négatif</h4>
<p>Répondre rapidement, de façon personnalisée et courtoise ; remercier ; reconnaître le problème sans se justifier longuement ; expliquer ce qui est fait ; inviter à poursuivre l'échange en privé. La réponse est lue par tous les futurs clients.</p>` },

<p>Évaluer une action commerciale, c'est <b>comparer ce qui était visé à ce qui a été obtenu</b>, comprendre pourquoi, et en tirer des enseignements pour la prochaine fois. Sans évaluation, on répète les mêmes erreurs.</p>
<p>L'indicateur dépend toujours de l'<b>objectif</b> de l'action :</p>
<table class="tab"><tr><th>Objectif de l'action</th><th>Indicateurs adaptés</th></tr>
<tr><td>Attirer du trafic</td><td>Nombre d'entrées, évolution vs période comparable</td></tr>

<div class="formule">CA au m² = CA du rayon ÷ Surface (m²) &nbsp;|&nbsp; CA au mètre linéaire = CA ÷ Linéaire développé</div>

<li>Indice <b>&lt; 100</b> : le rayon est sous-performant par rapport à son espace → réduire le linéaire, revoir l'assortiment ou l'implantation.</li></ul>
<p>On peut faire la même analyse avec la <b>marge</b> au lieu du CA : c'est souvent plus pertinent pour la rentabilité.</p>` },

<p>Le CA réalisé pendant une opération n'est pas le résultat de l'opération : une partie aurait été réalisée de toute façon. On compare à une <b>période de référence</b> (même période N−1, semaine précédente, magasin témoin).</p>

<h4>Les effets à ne pas oublier</h4>
<ul><li><b>Effet d'aubaine</b> : des clients qui auraient acheté de toute façon profitent de la réduction (perte de marge).</li>
<li><b>Cannibalisation</b> : le produit en promotion prend des ventes à d'autres produits du magasin.</li>
<li><b>Report d'achat</b> : les clients ont anticipé un achat, les ventes baisseront après l'opération.</li>
<li><b>Effets indirects positifs</b> : trafic sur les autres rayons, nouveaux clients recrutés, image, données clients collectées.</li></ul>
<div class="attention">Un bilan « l'opération a fait 39 600 € de CA, c'est bien » ne vaut rien au BTS. Il faut : écart à l'objectif, comparaison à une référence, rentabilité, effets indirects.</div>` },

<p>Le marchandisage (merchandising) regroupe les techniques qui mettent <b>le bon produit, au bon endroit, au bon moment, en bonne quantité, au bon prix, avec la bonne information</b> (règle des 5 B / 6 B). Il concilie l'intérêt du client (trouver facilement, être inspiré) et celui du magasin (vendre plus, avec plus de marge).</p>
<p>L'implantation organise la <b>circulation</b> : une allée principale (« boulevard ») qui fait le tour du magasin, des allées secondaires. Dans la plupart des magasins, les clients tournent spontanément dans le sens inverse des aiguilles d'une montre et regardent à droite.</p>
<table class="tab"><tr><th>Zones chaudes (fort passage)</th><th>Zones froides (faible passage)</th></tr>
<tr><td>Après le sas d'entrée, allée principale, côté droit, têtes de gondole, zone caisses</td><td>Angles, fond du magasin, allées sans issue, recoins, côté gauche à l'entrée, étages</td></tr></table>
<h4>Réchauffer une zone froide</h4>
<ul><li>Y placer des <b>produits de première nécessité</b> ou d'appel (les clients traversent le magasin pour les trouver).</li>
<li>Éclairage renforcé, couleurs, signalétique, PLV, animations, produits en promotion.</li>

<div class="formule">Capacité d'exposition d'une référence = Nombre de facings × Produits en profondeur × Produits en hauteur</div>

<div class="formule">Répartition proportionnelle au CA : Linéaire de la famille = Linéaire total × Part de la famille dans le CA</div>
<p>On peut aussi répartir selon la <b>marge</b> (pour favoriser la rentabilité) ou selon les quantités vendues (pour éviter les ruptures). L'<b>indice de sensibilité</b> (part du CA ÷ part du linéaire × 100) permet de repérer les familles sur- ou sous-exposées.</p>` },

<table class="tab"><tr><th>Niveau</th><th>Hauteur</th><th>Usage conseillé</th></tr>

<ol><li><b>Objectif</b> : cognitif (faire connaître), affectif (faire aimer, image), conatif (faire agir : venir, acheter, s'inscrire).</li>

<li><b>Message</b> : une <b>promesse</b> (le bénéfice client), une <b>preuve</b> (ce qui rend la promesse crédible), un <b>ton</b> (humoristique, sérieux, chaleureux…) et un appel à l'action.</li>
<li><b>Moyens et supports</b>, choisis selon la cible, l'objectif et le budget.</li>

    { t: "3. Réglementation des annonces de réduction de prix", h: `
<p>Depuis la transposition de la directive européenne « Omnibus » (2022), toute annonce de réduction de prix doit indiquer le <b>prix antérieur</b>, qui est le <b>prix le plus bas pratiqué par le vendeur au cours des 30 jours précédant</b> l'application de la réduction (Code de la consommation).</p>
<ul><li>En cas de <b>réductions successives</b> pendant une même opération, le prix de référence reste celui d'avant la première réduction.</li>
<li>Certaines exceptions existent (produits périssables, produits en stock depuis moins de 30 jours, prix d'appel « prix bas permanent »…).</li>
<li>Une annonce de réduction fictive ou trompeuse est une <b>pratique commerciale trompeuse</b> (sanctions pénales et amendes).</li>
<li><b>Soldes</b> : deux périodes par an ; produits proposés à la vente depuis au moins un mois ; la revente à perte y est autorisée.</li></ul>
<p>Autres règles utiles : <b>consentement préalable</b> (opt-in) obligatoire pour envoyer e-mails et SMS de prospection à des particuliers (RGPD) et lien de désinscription ; loi Évin pour l'alcool ; mentions obligatoires sur les offres (durée, conditions).</p>` },

<tr><td><b>Taux de conversion</b></td><td>Conversions (achats, inscriptions) ÷ Clics × 100</td></tr>

<tr><td>ROAS</td><td>CA généré ÷ Coût de la campagne</td></tr>
<tr><td>Taux d'ouverture (e-mail)</td><td>E-mails ouverts ÷ E-mails délivrés × 100</td></tr></table>

<p>Tout calcul commercial part de la même chaîne. Retiens-la par cœur : elle sert dans les quatre blocs.</p>
<div class="schema">Prix d'achat HT (coût d'achat) <b>+ marge</b> = Prix de vente HT <b>+ TVA</b> = Prix de vente TTC</div>
<ul>
<li><b>Prix d'achat HT (PAHT)</b> ou <b>coût d'achat</b> : ce que paie le magasin au fournisseur, hors taxes, frais d'approche compris.</li>
<li><b>Prix de vente HT (PVHT)</b> : ce que le magasin garde réellement après avoir reversé la TVA à l'État.</li>
<li><b>Prix de vente TTC (PVTTC)</b> : le prix affiché, payé par le client.</li>
</ul>
<p>Taux de TVA en France métropolitaine : <b>20 %</b> (taux normal), <b>10 %</b> (restauration, certains travaux), <b>5,5 %</b> (alimentation, livres), <b>2,1 %</b> (médicaments remboursables, presse).</p>
<div class="formule">PVTTC = PVHT × (1 + taux de TVA) &nbsp;&nbsp;⇔&nbsp;&nbsp; PVHT = PVTTC ÷ (1 + taux de TVA)</div>
<div class="attention"><b>Piège n°1 du jury :</b> pour retirer 20 % de TVA, on <u>divise par 1,20</u>. Multiplier par 0,80 est faux : 120 × 0,80 = 96, alors que 120 ÷ 1,20 = 100.</div>` },

<tr><td><b>Taux de marque</b></td><td>Marge ÷ <u>PVHT</u> × 100</td><td>« Quelle part de mon prix de vente est de la marge ? » (vision vendeur)</td></tr>
<tr><td><b>Coefficient multiplicateur</b></td><td>PVTTC ÷ PAHT</td><td>« Par combien je multiplie mon coût d'achat pour obtenir le prix affiché ? »</td></tr></table>
<p>Le taux de marque est <b>toujours inférieur</b> au taux de marge, car on divise la même marge par un nombre plus grand (le PVHT).</p>
<div class="formule">Taux de marque = Taux de marge ÷ (1 + Taux de marge) &nbsp;&nbsp;|&nbsp;&nbsp; Taux de marge = Taux de marque ÷ (1 − Taux de marque)</div>
<div class="astuce"><b>Retrouver un prix à partir d'un taux de marque visé :</b> PVHT = PAHT ÷ (1 − taux de marque). Exemple : PAHT 26 €, taux de marque visé 35 % → PVHT = 26 ÷ 0,65 = 40 €.</div>
<div class="astuce"><b>Le coefficient en commerce de détail</b> se calcule du PAHT au PVTTC : il intègre donc à la fois la marge et la TVA. Un coefficient de 2 avec une TVA à 20 % donne un taux de marque de 40 % (PVHT = 2 ÷ 1,2 = 1,667 fois le PAHT).</div>` },

<p>Une rotation élevée signifie que le stock se renouvelle vite : moins d'argent immobilisé, moins de risque de démarque (casse, vol, obsolescence). Une rotation trop élevée peut entraîner des ruptures.</p>
<div class="formule">Stock d'alerte = Consommation (ventes) journalière × Délai de livraison (jours) + Stock de sécurité</div>

<div class="formule">Marge commerciale = Ventes de marchandises HT − Coût d'achat des marchandises vendues</div>
<div class="formule">Taux de marge commerciale = Marge commerciale ÷ Coût d'achat des marchandises vendues × 100</div>
<div class="attention">On ne retire pas simplement les achats : il faut corriger de la <b>variation de stock</b>. Si le stock augmente, une partie des achats n'a pas été vendue ; on la retire.</div>
<p>On calcule aussi souvent le <b>taux de marque global</b> = marge commerciale ÷ CA HT × 100.</p>` },
    { t: "2. Les soldes intermédiaires de gestion (SIG)", h: `
<p>Les SIG décomposent le résultat en étapes, du plus « commercial » au plus « global ».</p>
<table class="tab"><tr><th>Solde</th><th>Calcul</th><th>Ce qu'il mesure</th></tr>
<tr><td><b>Marge commerciale</b></td><td>Ventes de marchandises − coût d'achat des marchandises vendues</td><td>La performance de l'achat-revente</td></tr>
<tr><td><b>Valeur ajoutée (VA)</b></td><td>Marge commerciale (+ production) − consommations en provenance des tiers (autres achats et charges externes : loyer, énergie, publicité, assurances…)</td><td>La richesse créée par l'entreprise</td></tr>
<tr><td><b>Excédent brut d'exploitation (EBE)</b></td><td>VA + subventions d'exploitation − impôts et taxes − charges de personnel (salaires + charges sociales)</td><td>La rentabilité de l'exploitation, avant amortissements et éléments financiers</td></tr>
<tr><td>Résultat d'exploitation</td><td>EBE + autres produits − dotations aux amortissements et provisions − autres charges</td><td>Le résultat de l'activité normale</td></tr></table>
<div class="astuce">L'EBE est l'indicateur préféré des banquiers et des enseignes pour comparer des magasins : il ne dépend ni de la politique d'amortissement ni du mode de financement.</div>` },
    { t: "3. Le seuil de rentabilité", h: `
<p>On classe les charges en deux familles :</p>
<ul><li><b>Charges variables</b> : évoluent avec l'activité (achats consommés, commissions, emballages).</li>
<li><b>Charges fixes</b> : indépendantes de l'activité à court terme (loyer, salaires fixes, assurances, amortissements).</li></ul>
<div class="formule">Marge sur coût variable (MCV) = CA − Charges variables &nbsp;|&nbsp; Taux de MCV = MCV ÷ CA</div>
<div class="formule">Seuil de rentabilité (SR) = Charges fixes ÷ Taux de MCV</div>
<div class="formule">Point mort (en jours) = SR ÷ CA × 360 &nbsp;|&nbsp; Marge de sécurité = CA − SR &nbsp;|&nbsp; Indice de sécurité = Marge de sécurité ÷ CA × 100</div>
<p>Le SR est le CA pour lequel le résultat est <b>nul</b> : en dessous, perte ; au-dessus, bénéfice. Le point mort est la <b>date</b> à laquelle ce CA est atteint (si l'activité est régulière). Pour une activité saisonnière, on cumule le CA mois par mois.</p>` },
    { t: "4. Le tableau de bord et le compte rendu", h: `
<p>Un tableau de bord rassemble quelques indicateurs clés (5 à 10), comparés à un objectif ou à N−1, avec des alertes visuelles.</p>
<div class="formule">Écart en valeur = Réalisé − Objectif &nbsp;|&nbsp; Écart en % = (Réalisé − Objectif) ÷ Objectif × 100</div>
<p>Indicateurs fréquents en MCO : CA, fréquentation (entrées), nombre de tickets, <b>taux de transformation</b> = tickets ÷ entrées, <b>panier moyen</b> = CA ÷ tickets, CA au m², taux de marque, démarque.</p>
<div class="schema">CA = Entrées × Taux de transformation × Panier moyen</div>
<p>Cette décomposition permet de trouver <b>la cause</b> d'un écart de CA : manque de trafic ? problème de conversion en caisse ? panier trop faible ?</p>
<h4>Structure d'un compte rendu au manager</h4>
<ol><li><b>Constat chiffré</b> : les écarts significatifs, en valeur et en %.</li>
<li><b>Analyse des causes</b> : quel facteur explique l'écart (décomposition du CA), causes internes / externes.</li>
<li><b>Mesures correctrices</b> : 2 ou 3 actions précises, réalistes, avec responsable et échéance.</li>
<li><b>Indicateurs de suivi</b> : comment on saura que l'action fonctionne.</li></ol>` }

  cours: [
    { t: "1. Prévoir les ventes", h: `
<p>Les prévisions de ventes sont la base de tous les budgets (achats, personnel, trésorerie). Méthodes : jugement des vendeurs, prolongement de tendance, et <b>ajustement linéaire</b> par la méthode des moindres carrés.</p>
<p>On cherche une droite <b>y = ax + b</b> où x est le rang de la période (1, 2, 3…) et y les ventes.</p>
<div class="formule">a = Σ (xᵢ − x̄)(yᵢ − ȳ) ÷ Σ (xᵢ − x̄)² &nbsp;&nbsp;|&nbsp;&nbsp; b = ȳ − a × x̄</div>
<p>Méthode pas à pas : 1) calculer les moyennes x̄ et ȳ ; 2) calculer les écarts à la moyenne pour chaque période ; 3) faire les produits des écarts et les carrés des écarts de x ; 4) additionner ; 5) calculer a puis b ; 6) remplacer x par le rang de la période à prévoir.</p>
<div class="astuce">Sur tableur : =PENTE(ventes;rangs) donne a, =ORDONNEE.ORIGINE(ventes;rangs) donne b, =PREVISION(rang;ventes;rangs) donne directement la prévision.</div>
<p>Si l'activité est saisonnière, on corrige ensuite la tendance par des <b>coefficients saisonniers</b>.</p>` },
    { t: "2. Le budget de trésorerie", h: `
<p>Le budget de trésorerie prévoit, mois par mois, les entrées et sorties d'argent réelles. On raisonne en <b>TTC</b> et à la <b>date du paiement</b>, pas à la date de la vente.</p>
<table class="tab"><tr><th>Budget des encaissements</th><th>Budget des décaissements</th></tr>
<tr><td>Ventes TTC encaissées selon les conditions de paiement (comptant, à 30 jours…) ; créances clients du bilan ; apports ; emprunts reçus ; subventions</td><td>Achats TTC payés selon les délais fournisseurs ; salaires et charges sociales ; loyer et charges externes ; TVA à décaisser ; investissements ; remboursements d'emprunt</td></tr></table>
<div class="formule">Trésorerie fin de mois = Trésorerie début de mois + Encaissements − Décaissements</div>
<p>La trésorerie de fin de mois devient la trésorerie de début du mois suivant.</p>
<div class="attention">Piège fréquent : encaisser toutes les ventes le mois où elles sont réalisées. Une vente de mars payée à 30 jours est encaissée en <b>avril</b>.</div>` },
    { t: "3. Financer un besoin, placer un excédent", h: `
<table class="tab"><tr><th>Situation</th><th>Solution adaptée</th></tr>
<tr><td>Besoin de trésorerie ponctuel et court (quelques jours, un mois)</td><td>Facilité de caisse, découvert autorisé, escompte d'effets, affacturage, négociation d'un délai fournisseur</td></tr>
<tr><td>Besoin saisonnier (constitution de stock avant Noël)</td><td>Crédit de campagne</td></tr>
<tr><td>Financement d'un investissement durable (agencement, véhicule)</td><td>Emprunt à moyen terme, crédit-bail, location longue durée, apport — <b>jamais</b> la trésorerie courante</td></tr>
<tr><td>Excédent de trésorerie</td><td>Compte à terme, placement sans risque, remboursement anticipé</td></tr></table>
<div class="astuce">Règle d'équilibre financier : un emploi durable se finance par une ressource durable. Payer un agencement de 12 000 € comptant fait souvent « plonger » la trésorerie alors qu'un emprunt l'étalerait.</div>` },
    { t: "4. Évaluer un investissement", h: `
<p>Un investissement génère des <b>flux nets de trésorerie</b> (encaissements supplémentaires − décaissements supplémentaires) sur plusieurs années.</p>
<div class="formule">Délai de récupération du capital investi (DRCI) = temps nécessaire pour que le cumul des flux égale l'investissement</div>
<p>Si les flux sont constants : DRCI = Investissement ÷ Flux annuel. Sinon, on cumule année par année puis on interpole. Plus le DRCI est court, moins le projet est risqué.</p>
<p>Un euro dans un an vaut moins qu'un euro aujourd'hui. On <b>actualise</b> les flux futurs au taux t :</p>
<div class="formule">Flux actualisé de l'année n = Flux × (1 + t)⁻ⁿ &nbsp;&nbsp;|&nbsp;&nbsp; VAN = Σ flux actualisés − Investissement</div>
<p><b>VAN &gt; 0</b> : le projet est rentable au taux choisi (il rapporte plus que ce taux). <b>VAN &lt; 0</b> : on le rejette. Entre deux projets, on retient la VAN la plus élevée.</p>` }
  ],

<table class="tab"><tr><th>Règle</th><th>Seuil</th></tr>

<p>Ces règles sont un socle : la <b>convention collective</b> de la branche (commerce de détail non alimentaire, habillement, alimentaire…) et les accords d'entreprise peuvent les aménager. Les salariés de moins de 18 ans bénéficient de règles plus protectrices.</p>` },

<h4>Temps plein : heures supplémentaires</h4>
<p>Au-delà de 35 h par semaine. Majoration légale (à défaut d'accord) : <b>+25 %</b> de la 36ᵉ à la 43ᵉ heure (8 premières heures), <b>+50 %</b> à partir de la 44ᵉ. Un accord peut prévoir un taux différent, au minimum 10 %. Contingent annuel par défaut : 220 h. Elles peuvent être remplacées par un repos compensateur équivalent.</p>
<h4>Temps partiel : heures complémentaires</h4>
<ul><li>Limitées à <b>10 %</b> de la durée prévue au contrat (jusqu'à un tiers si un accord de branche ou d'entreprise le prévoit).</li>
<li>Majorées de <b>10 %</b> dans la limite du dixième, de 25 % au-delà (si l'accord autorise à dépasser le dixième).</li>
<li>Elles ne peuvent jamais porter la durée de travail au niveau de la durée légale (35 h).</li>
<li>Le salarié à temps partiel doit être prévenu de son planning, en principe, au moins <b>7 jours ouvrés</b> à l'avance.</li></ul>` },

<p>Principe : le repos hebdomadaire est donné <b>le dimanche</b>. Dérogations principales dans le commerce de détail :</p>
<ul><li><b>Commerce de détail alimentaire</b> : peut employer des salariés le dimanche <b>jusqu'à 13 h</b> (contreparties prévues pour les grandes surfaces).</li>
<li><b>Dimanches du maire</b> : le maire peut autoriser jusqu'à <b>12 dimanches par an</b> ; salariés volontaires, payés au moins le double et bénéficiant d'un repos compensateur.</li>
<li><b>Zones touristiques, zones commerciales, zones touristiques internationales, certaines gares</b> : ouverture possible, sous conditions d'accord collectif et de contreparties.</li>
<li>Certains secteurs (fleuristes, ameublement, jardinerie…) bénéficient de dérogations permanentes.</li></ul>
<div class="attention">Dans les cas de dérogation sur autorisation, seuls des salariés <b>volontaires, ayant donné leur accord par écrit</b>, peuvent travailler le dimanche. Un refus ne peut pas être sanctionné.</div>` },
    { t: "4. Construire un planning", h: `
<ol><li><b>Analyser les besoins</b> : amplitude d'ouverture, fréquentation par jour et par tranche horaire (pics du samedi, de la pause déjeuner, de fin de journée), tâches hors clientèle (réception, mise en rayon, inventaire).</li>
<li><b>Recenser les ressources</b> : contrats (durées, temps partiels), compétences (caisse, conseil, ouverture/fermeture), congés, formations, contraintes des salariés.</li>
<li><b>Répartir</b> en respectant les règles légales, en couvrant les pics et en assurant l'équité (week-ends, fermetures).</li>
<li><b>Contrôler</b> : total d'heures par salarié, repos de 11 h, maximum de 10 h par jour, pauses, effectif minimum à chaque créneau.</li>
<li><b>Communiquer</b> le planning à l'avance et l'ajuster.</li></ol>
<div class="astuce">Sur tableur : une ligne par salarié, une colonne par jour avec heure d'arrivée, de départ et pause, une formule pour le total quotidien et hebdomadaire, et une mise en forme conditionnelle qui colore en rouge tout jour &gt; 10 h ou toute semaine &gt; 48 h.</div>` }

M({

  cours: [
    { t: "1. Le processus de recrutement", h: `
<div class="schema">Besoin → Fiche de poste et profil → Choix du contrat → Canaux → Annonce → Présélection → Entretiens → Décision → Intégration</div>
<ol><li><b>Analyser le besoin</b> : remplacement, création de poste, renfort saisonnier ? Le besoin peut-il être couvert autrement (réorganisation, heures complémentaires, mobilité interne) ?</li>
<li><b>Définir le poste</b> (fiche de poste) et <b>le profil</b> recherché.</li>
<li><b>Choisir le contrat</b> : CDI, CDD (motif obligatoire : remplacement, accroissement temporaire, saisonnier), intérim, apprentissage, temps partiel.</li>
<li><b>Choisir les canaux</b> : <i>internes</i> (mobilité, promotion, cooptation) ou <i>externes</i> (France Travail, sites d'emploi, réseaux sociaux professionnels, écoles et CFA, candidatures spontanées, cabinet).</li>
<li><b>Présélectionner</b> les candidatures avec une grille de critères objectifs.</li>
<li><b>Mener les entretiens</b>, éventuellement des mises en situation (jeu de rôle de vente).</li>
<li><b>Décider</b>, informer tous les candidats, préparer l'arrivée.</li></ol>` },

<table class="tab"><tr><th>Fiche de poste (le poste)</th><th>Profil (la personne)</th></tr>
<tr><td>Intitulé, rattachement hiérarchique, missions et activités, conditions de travail (horaires, lieu), rémunération, évolution possible</td><td>Savoirs (connaissances), savoir-faire (compétences techniques), savoir-être (qualités relationnelles) ; critères <b>indispensables</b> et <b>souhaités</b></td></tr></table>
<p><b>L'annonce</b> présente l'entreprise, le poste, le profil, le contrat, la rémunération (de plus en plus attendue), le lieu et la manière de candidater. Elle doit être rédigée en français, sans critère discriminatoire, et mentionner « H/F » ou une formulation inclusive.</p>` },
    { t: "3. La non-discrimination", h: `
<p>Le Code du travail interdit d'écarter un candidat en raison notamment de : son origine, son sexe, ses mœurs, son orientation sexuelle, son identité de genre, son âge, sa situation de famille, sa grossesse, ses caractéristiques génétiques, sa vulnérabilité économique, son appartenance ou non-appartenance (vraie ou supposée) à une ethnie, une nation ou une prétendue race, ses opinions politiques, ses activités syndicales, ses convictions religieuses, son apparence physique, son nom de famille, son lieu de résidence, sa domiciliation bancaire, son état de santé, sa perte d'autonomie, son handicap, sa capacité à s'exprimer dans une autre langue que le français, sa qualité de lanceur d'alerte.</p>
<p>Les informations demandées au candidat doivent avoir un <b>lien direct et nécessaire avec le poste</b>. Questions interdites en entretien : « Avez-vous des enfants ? », « Êtes-vous enceinte ? », « Quelle est votre religion ? », « D'où viennent vos parents ? »…</p>
<div class="attention">Une annonce « Vendeuse 25-35 ans, dynamique, bonne présentation » contient trois problèmes : sexe (vendeuse sans H/F), âge, et apparence physique (« bonne présentation » est un critère flou et risqué). La discrimination est un délit pénal.</div>` },
    { t: "4. L'entretien et l'intégration", h: `
<p><b>Entretien structuré</b> : mêmes questions pour tous les candidats, notées sur une grille pondérée, pour comparer objectivement. Questions comportementales (méthode <b>STAR</b> : Situation, Tâche, Action, Résultat) : « Racontez-moi une situation où un client était mécontent : qu'avez-vous fait ? »</p>
<div class="formule">Note pondérée = Σ (note du critère × coefficient) ÷ Σ des coefficients</div>
<h4>L'intégration (onboarding)</h4>
<ul><li><b>Avant l'arrivée</b> : préparer le poste, le badge, le planning, prévenir l'équipe.</li>
<li><b>Jour 1</b> : accueil par le manager, visite, présentation de l'équipe, livret d'accueil (règlement intérieur, sécurité, procédures), désignation d'un <b>tuteur</b>.</li>
<li><b>Premières semaines</b> : formation aux produits et à la caisse, objectifs progressifs, points réguliers.</li>
<li><b>Fin de période d'essai</b> : entretien de bilan, <b>rapport d'étonnement</b> (le nouveau salarié note ce qui l'a surpris, en bien ou en mal : un regard neuf utile au magasin).</li></ul>
<p>Une intégration réussie réduit le turnover et accélère l'autonomie du salarié.</p>` }
  ],
  exemple: {
    titre: "Exemple résolu — Grille d'entretien pondérée",
    enonce: "Pour un poste de vendeur, le manager note les candidats sur 5 selon 4 critères : accueil client (coef. 3), techniques de vente (coef. 4), disponibilité le samedi (coef. 2), esprit d'équipe (coef. 1). Candidat A : 4 ; 3 ; 5 ; 4.",

    { t: "qcm", q: "Pour recruter rapidement un vendeur polyvalent dans le quartier avec un budget minimal, le canal le plus adapté est :", o: ["un cabinet de recrutement national", "une annonce sur France Travail et la cooptation par l'équipe", "une annonce dans un quotidien national", "un stand dans un salon international de l'emploi et de la mobilité"], a: 1, c: "Gratuits ou peu coûteux, locaux et rapides." },

<p>Annonce conforme (présentation du magasin, missions, profil, contrat, salaire, candidature par e-mail). Canaux : France Travail (gratuit, local) et réseaux sociaux du magasin et des clubs de course locaux (cible passionnée et compétente).</p>`,

M({
  id: "C4.3", bloc: 4, duree: 75,
  titre: "Animer l'équipe commerciale",
  sous: "Motivation (Maslow, Herzberg), styles de management, réunions, conflits, risques psychosociaux",
  objectifs: [
    "Mobiliser les théories de la motivation pour choisir des leviers adaptés",
    "Choisir le type de réunion et le style de management selon la situation",
    "Résoudre un conflit avec une démarche complète : diagnostic, entretiens, solution, prévention, suivi",
    "Identifier et prévenir les risques psychosociaux"
  ],
  cours: [
    { t: "1. La motivation", h: `
<p><b>Maslow</b> hiérarchise cinq besoins : physiologiques, sécurité, appartenance, estime, accomplissement. Un besoin supérieur ne motive que si les besoins inférieurs sont satisfaits.</p>
<p><b>Herzberg</b> distingue deux familles de facteurs :</p>
<table class="tab"><tr><th>Facteurs d'hygiène (ou d'ambiance)</th><th>Facteurs moteurs (de motivation)</th></tr>
<tr><td>Salaire, conditions de travail, sécurité de l'emploi, relations avec le manager et les collègues, politique de l'entreprise</td><td>Reconnaissance, accomplissement, intérêt du travail, responsabilités, possibilité d'évolution</td></tr>
<tr><td>Leur <b>absence crée de l'insatisfaction</b>, mais leur présence ne motive pas durablement</td><td>Leur <b>présence crée la motivation</b></td></tr></table>
<p>Conséquence managériale : une prime ne suffit pas à motiver durablement ; il faut aussi reconnaître le travail, confier des responsabilités, enrichir les tâches. Motivation <b>extrinsèque</b> (récompense extérieure) et <b>intrinsèque</b> (plaisir, sens du travail).</p>
<h4>Styles de management (Hersey et Blanchard)</h4>
<p>Le style s'adapte à l'autonomie du collaborateur : <b>directif</b> (débutant enthousiaste : consignes précises), <b>persuasif</b> (débutant découragé : expliquer, encourager), <b>participatif</b> (compétent mais hésitant : associer aux décisions), <b>délégatif</b> (autonome et motivé : confier).</p>` },
    { t: "2. Les réunions et la stimulation", h: `
<table class="tab"><tr><th>Type de réunion</th><th>Objectif</th></tr>
<tr><td>Information (briefing)</td><td>Transmettre des consignes, des résultats, des objectifs</td></tr>
<tr><td>Consultation</td><td>Recueillir l'avis de l'équipe avant une décision</td></tr>
<tr><td>Résolution de problème / créativité</td><td>Analyser un problème, faire émerger des idées (brainstorming)</td></tr>
<tr><td>Décision</td><td>Choisir collectivement une solution</td></tr>
<tr><td>Stimulation</td><td>Lancer un challenge, motiver, célébrer une réussite</td></tr></table>
<p><b>Préparer</b> (objectif, ordre du jour, convocation, durée), <b>animer</b> (cadrer, distribuer la parole, reformuler, gérer le temps), <b>conclure</b> (décisions, qui fait quoi, quand) et diffuser un <b>compte rendu</b>.</p>
<p><b>Challenge commercial</b> : objectif clair et atteignable, règles équitables (selon les horaires et rayons de chacun), récompense attractive (pas forcément financière), suivi visible des résultats, budget maîtrisé.</p>` },
    { t: "3. Gérer un conflit — la démarche en 5 éléments", h: `
<p>Sources de conflit : intérêts divergents (planning, primes), organisation floue (rôles mal définis), valeurs, personnalités, communication défaillante.</p>
<div class="attention">Le jury attend une démarche <b>complète</b>. Au positionnement, la réponse type se limitait à « organiser une réunion » : c'est insuffisant.</div>
<ol><li><b>Diagnostic</b> : les faits (pas les rumeurs), les personnes concernées, l'origine, l'ancienneté, les conséquences (clients, ambiance, absentéisme).</li>
<li><b>Entretiens individuels</b> avec chaque partie : écoute active, neutralité. Puis un <b>entretien de médiation</b> commun si nécessaire. Méthode <b>DESC</b> pour s'exprimer : <b>D</b>écrire les faits, <b>E</b>xprimer le ressenti ou l'impact, <b>S</b>pécifier la solution attendue, <b>C</b>onséquences positives.</li>
<li><b>Solution organisationnelle</b> qui traite la cause : planning équitable et transparent, clarification des rôles, règles écrites, rotation.</li>
<li><b>Prévention des RPS</b> : vérifier l'impact sur la santé des salariés, mettre à jour le document unique, prévoir un point régulier.</li>
<li><b>Suivi</b> : rendez-vous de suivi à une date fixée, indicateurs (absentéisme, climat, réclamations clients), sanction en dernier recours si un comportement fautif persiste.</li></ol>` },
    { t: "4. Les risques psychosociaux (RPS)", h: `
<p>Les RPS regroupent le stress au travail, les violences internes (harcèlement, conflits) et externes (agressions de clients) et l'épuisement professionnel. Facteurs de risque : intensité et temps de travail, exigences émotionnelles (clients agressifs), manque d'autonomie, rapports sociaux dégradés, conflits de valeurs, insécurité de la situation de travail.</p>
<p>L'employeur a une <b>obligation de sécurité</b> : il doit évaluer les risques et prendre les mesures nécessaires pour protéger la santé physique et mentale des salariés. Les risques sont consignés dans le <b>document unique d'évaluation des risques professionnels (DUERP)</b>, obligatoire dès le premier salarié.</p>
<table class="tab"><tr><th>Prévention primaire</th><th>Prévention secondaire</th><th>Prévention tertiaire</th></tr>
