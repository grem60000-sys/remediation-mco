  corrige: [
    `<p>PVHT = 119,90 ÷ 1,2 = <b>99,92 €</b> ; marge = 99,92 − 64 = <b>35,92 €</b> ; taux de marque = 35,92 ÷ 99,92 = <b>35,9 %</b> ; coefficient = 119,90 ÷ 64 = <b>1,87</b>. Le prix ne respecte pas la politique (35,9 % &lt; 38 %).</p>
<p>Prix minimum : PVHT = 64 ÷ 0,62 = 103,23 € HT, soit 123,87 € TTC. Mais le concurrent est à 119,00 € : passer à 124,90 € ferait perdre des ventes sur un produit très comparé. Décision attendue (argumentée) : négocier le prix d'achat (pour 38 % à 119,90 € TTC, il faut un PAHT ≤ 99,92 × 0,62 = 61,95 €) ; à défaut, maintenir 119,90 € en le traitant comme produit d'appel et compenser par des ventes associées (huile, gants, rallonge) à forte marge.</p>`,
    `<p>MCV = 480 000 − 312 000 = <b>168 000 €</b> ; taux de MCV = <b>35 %</b> ; résultat = 168 000 − 132 000 = <b>36 000 €</b> ; SR = 132 000 ÷ 0,35 = <b>377 143 €</b>. Point mort régulier = 377 143 ÷ 480 000 × 360 = <b>283 jours</b>, soit vers le 13 octobre.</p>
<p>SR en % du CA annuel = 78,6 %. Cumul : fin juillet 73 %, fin août 78 %, fin septembre 85 % → point mort réel <b>début septembre</b> (environ le 3). L'activité saisonnière fait atteindre le seuil plus tôt ; inversement, un printemps raté (météo) compromettrait toute l'année : il faut piloter de près mars-juin.</p>`,
    `<p>DRCI = 36 000 ÷ 10 000 = <b>3,6 ans</b> (3 ans et environ 7 mois). VAN = 10 000 × [1 − 1,06⁻⁵] ÷ 0,06 − 36 000 = 10 000 × 4,2124 − 36 000 = <b>≈ 6 124 €</b> &gt; 0 : projet rentable au taux de 6 %.</p>
<p>Financement : un investissement durable doit être financé par une ressource durable — <b>emprunt à moyen terme ou crédit-bail</b> sur 5 ans — plutôt que par la trésorerie, pour ne pas fragiliser le magasin avant la saison de printemps où les achats de stock sont lourds.</p>`,
    `<p>Note attendue : 1) Taille-haie : taux de marque de 35,9 % sous la norme de 38 % ; renégocier le prix d'achat à 61,95 € HT maximum, sinon garder 119,90 € comme produit d'appel avec ventes associées. 2) Rayon : rentable (résultat 36 000 €, point mort début septembre), mais très dépendant du printemps (60 % du CA de mars à juin) : renforcer stock et personnel sur cette période. 3) Serre : VAN de 6 124 € et récupération en 3,6 ans ; investir, financé par emprunt ou crédit-bail. Structure, chiffres et formulation professionnelle sont évalués.</p>`
  ],
  criteres: [

EXAMS["EXAM-B4"] = {
  id: "EXAM-B4", bloc: 4, duree: 120,
  titre: "Cas d'examen — Management de l'équipe commerciale",
  sous: "Chaussures Catalanes (Perpignan)",
  contexte: `<p>Vous êtes responsable adjoint(e) d'un magasin de chaussures de 4 vendeurs. Les soldes d'hiver approchent ; le maire a autorisé l'ouverture de deux dimanches pendant cette période.</p>
<table class="tab"><tr><th>Vendeur</th><th>Heures</th><th>Contacts</th><th>Ventes</th><th>Articles</th><th>CA (€)</th><th>Objectif (€)</th></tr>
<tr><td>Manon</td><td>150</td><td>620</td><td>186</td><td>279</td><td>13 020</td><td>12 500</td></tr>
<tr><td>Théo</td><td>150</td><td>600</td><td>132</td><td>145</td><td>9 900</td><td>12 500</td></tr>
<tr><td>Sofia (temps partiel)</td><td>105</td><td>430</td><td>129</td><td>232</td><td>9 030</td><td>8 750</td></tr>
<tr><td>Kevin (arrivé il y a 6 semaines)</td><td>105</td><td>420</td><td>105</td><td>126</td><td>6 300</td><td>8 750</td></tr></table>
<p>Théo, 6 ans d'ancienneté, avait demandé le poste de responsable adjoint, finalement attribué à Manon il y a deux mois. Depuis, il arrive régulièrement en retard, refuse d'aider en réserve et des tensions sont apparues avec Manon devant les clients.</p>
<p>Pour les soldes, la direction veut recruter un renfort de 6 semaines. Votre collègue propose cette annonce : <i>« Recherche vendeuse H/F 20-30 ans, étudiante de préférence, disponible tous les dimanches, photo obligatoire. »</i></p>`,
  questions: [
    "Calculez pour chaque vendeur le taux de transformation, le panier moyen, l'indice de vente, le taux de réalisation de l'objectif et le CA par heure. Analysez les performances de chacun.",
    "Proposez un accompagnement individualisé pour Théo et pour Kevin (objectifs SMART, moyens, suivi).",
    "Analysez le projet d'annonce et le recours au travail du dimanche. Précisez le contrat et son motif, rédigez une annonce conforme et choisissez deux canaux de diffusion.",
    "Présentez la démarche complète que vous mettez en œuvre face à la situation de Théo et Manon, en mobilisant une théorie de la motivation."
  ],
  corrige: [
    `<table class="tab"><tr><th></th><th>Transfo.</th><th>Panier</th><th>Indice</th><th>Réalisation</th><th>CA/h</th></tr><tr><td>Manon</td><td>30 %</td><td>70 €</td><td>1,50</td><td>104,2 %</td><td>86,80 €</td></tr><tr><td>Théo</td><td>22 %</td><td>75 €</td><td>1,10</td><td>79,2 %</td><td>66,00 €</td></tr><tr><td>Sofia</td><td>30 %</td><td>70 €</td><td>1,80</td><td>103,2 %</td><td>86,00 €</td></tr><tr><td>Kevin</td><td>25 %</td><td>60 €</td><td>1,20</td><td>72,0 %</td><td>60,00 €</td></tr></table>
<p>Manon et Sofia atteignent leurs objectifs avec une productivité équivalente (Sofia, à temps partiel, a un CA inférieur mais un CA/h identique : on compare des ratios). Théo garde un bon panier mais sa transformation (22 %) et son indice (1,10) ont chuté : problème de comportement et d'implication plus que de compétence. Kevin, débutant, a un panier et un indice faibles : manque de connaissance produits et de vente additionnelle.</p>`,
    `<p><b>Théo</b> : entretien individuel (constat chiffré, écoute de sa déception), objectif « retrouver 28 % de transformation d'ici fin février », lui confier une responsabilité valorisante (référent d'une gamme, tuteur de Kevin sur la technique produit), point toutes les deux semaines. <b>Kevin</b> : tutorat par Sofia (indice 1,8), formation produits sur les 20 modèles phares, fiches d'associations (entretien, semelles, chaussettes), objectif « indice de vente 1,4 et panier 65 € d'ici 6 semaines », point hebdomadaire.</p>`,
    `<p>Mentions discriminatoires : « vendeuse » avec H/F (contradictoire), « 20-30 ans » (âge), « étudiante de préférence » (situation), « photo obligatoire » (apparence). « Disponible tous les dimanches » : pour les dimanches du maire, seuls des salariés <b>volontaires</b> ayant donné leur accord écrit peuvent travailler, payés au moins le double avec repos compensateur ; on ne peut pas l'exiger dans l'annonce. Contrat : <b>CDD pour accroissement temporaire d'activité</b> (soldes), 6 semaines.</p>
<p>Annonce conforme : présentation du magasin, missions (accueil, conseil, encaissement, réassort), profil (sens du service, première expérience en vente appréciée), CDD 6 semaines, temps plein, horaires, salaire, candidature par e-mail. Canaux : France Travail (gratuit, local) et réseaux sociaux du magasin ou établissements d'enseignement locaux.</p>`,
    `<p>Démarche : 1) <b>Diagnostic</b> factuel : retards datés, refus, tensions observées ; cause probable : déception après le refus de promotion (sentiment d'injustice). 2) <b>Entretiens</b> individuels avec Théo puis Manon, puis médiation (méthode DESC), posture neutre. 3) <b>Solution organisationnelle</b> : clarifier les rôles de Manon, répartition écrite des tâches de réserve, planning équitable. 4) <b>Prévention des RPS</b> : vigilance sur la souffrance de Théo, mise à jour du DUERP, point d'équipe hebdomadaire. 5) <b>Suivi</b> : points à 15 jours et 1 mois, indicateurs (retards, transformation, climat). Herzberg : le salaire (hygiène) n'est pas en cause ; ce qui manque à Théo, ce sont des facteurs moteurs (reconnaissance, responsabilités, perspectives) : lui confier une mission de référent et construire avec lui un projet d'évolution (entretien professionnel).</p>`
  ],
  criteres: [
    { t: "Indicateurs exacts pour les quatre vendeurs", pts: 2, hint: "Voir tableau du corrigé" },
    { t: "Analyse fondée sur les ratios et reliée à une compétence pour chaque vendeur", pts: 3, hint: "Sofia = Manon en CA/h ; Théo implication ; Kevin produits et vente additionnelle" },
    { t: "Accompagnements adaptés avec objectifs SMART et suivi", pts: 3, hint: "Théo : responsabilité et objectif de transformation ; Kevin : tutorat et indice de vente" },
    { t: "Annonce analysée, contrat et motif corrects, règles du dimanche", pts: 3, hint: "4 mentions discriminatoires ; CDD accroissement temporaire ; volontariat écrit et salaire doublé" },
    { t: "Annonce conforme et canaux justifiés", pts: 2, hint: "Missions, profil, contrat, salaire ; France Travail + canal local" },
    { t: "Démarche de conflit complète et théorie de la motivation mobilisée", pts: 5, hint: "Diagnostic, entretiens, solution, RPS, suivi + Herzberg appliqué à Théo" },

  contexte: `<p>Vous êtes vendeur(se) conseil dans une boutique de thés et d'épicerie fine (TVA 5,5 % sur les produits alimentaires). La gérante prépare la saison de Noël.</p>
<h4>Relation client</h4>
<p>Enquête de recommandation du trimestre : 180 répondants, 72 promoteurs, 54 passifs, 54 détracteurs. Taux de réachat annuel : 28 %. Extraits d'avis :</p>

  corrige: [
    `<p>Promoteurs 40 %, détracteurs 30 % → <b>NPS = +10</b>, faiblement positif. Points forts : accueil, conseil, qualité, coffrets. Frictions : absence de retrait en boutique d'une commande en ligne (avant l'achat), attente le samedi faute de personnel (pendant l'achat). Actions : 1) click & collect sur le site (coût de mise en place estimé, indicateur : part des ventes retirées en boutique, objectif 8 %) ; 2) renfort le samedi de 11 h à 17 h (indicateur : temps d'attente, avis citant l'attente) ; 3) programme de fidélité : 1 thé offert au 10ᵉ achat, relance anniversaire (indicateur : taux de réachat de 28 % à 35 % en 12 mois). Objectif NPS : +25.</p>`,
    `<p>Découverte : « Quels thés votre belle-fille boit-elle habituellement ? », « Plutôt thé vert, noir, infusion ? », « Comment le prépare-t-elle ? », « C'est pour quelle occasion ? ». Mobiles : <b>Sécurité</b> (« ne pas me tromper »), <b>Argent</b> (« pas plus de 40 € »), <b>Sympathie/Orgueil</b> (offrir un beau cadeau). Arguments CAP : coffret découverte de 4 thés (C) → elle choisira ses préférés, vous ne vous trompez pas (A) → sélection des 4 thés les plus vendus, je vous fais sentir chacun (P) ; carte d'échange de 30 jours (C) → aucun risque (A) → ticket cadeau joint (P) ; présentation en boîte métal (C) → cadeau élégant réutilisable (A) → modèle en vitrine (P). Objection : reformuler, ramener au prix par tasse (environ 0,30 € la tasse), compensation par la qualité et le conseil. Vente additionnelle : une boule à thé ou une carte de vœux, cohérente avec le budget.</p>`,

    `<p>Cause principale de la baisse du CA : <b>la transformation</b> (−4 points), liée aux files d'attente du soir (2 caisses sur 3, absentéisme de 7 %) : des clients renoncent à acheter. Cause principale de la baisse de marge : <b>la démarque du rayon frais</b> (+0,9 point de CA), due au manque de formation de Clara aux règles de rotation. Causes secondaires : organisation du planning sur la tranche 17 h-19 h.</p>`,

const APP = { role: null, stu: null, state: null, ctx: null, saveTimer: null, lastAct: Date.now(), lastSave: 0, evalActive: null, feedback: [], drafts: {} };

function saveSoon(delay = 1200) {
  if (!APP.stu || APP.role !== "eleve") return;
  clearTimeout(APP.saveTimer);
  APP.saveTimer = setTimeout(saveNow, delay);
}
async function saveNow(keepalive) {
  if (!APP.stu || APP.role !== "eleve") return;
  clearTimeout(APP.saveTimer);
  APP.state.lastSeen = nowISO();
  APP.lastSave = Date.now();
  try { await DB.saveState(APP.stu.code, APP.state, keepalive); }
  catch (e) { console.warn(e); toast("Sauvegarde impossible pour l'instant : vérifie ta connexion."); }
}
function logEv(type, payload) { if (APP.stu && APP.role === "eleve") DB.addEvent(APP.stu.code, type, payload); }

/* ---- Suivi d'activité réelle (onglet visible + interaction < 90 s) ---- */
["mousemove", "keydown", "scroll", "touchstart", "click"].forEach(ev => window.addEventListener(ev, () => { APP.lastAct = Date.now(); }, { passive: true }));
setInterval(() => {
  if (APP.role !== "eleve" || !APP.state || !APP.state.startedAt) return;
  if (document.visibilityState !== "visible" || Date.now() - APP.lastAct > 90000) return;
  const st = APP.state, k = dayKey();
  st.time.total = (st.time.total || 0) + 5;
  st.time.byDay[k] = (st.time.byDay[k] || 0) + 5;
  if (APP.ctx && APP.ctx.module) {
    const ms = mst(st, APP.ctx.module);
    ms.time = (ms.time || 0) + 5;
    st.time.byModule[APP.ctx.module] = (st.time.byModule[APP.ctx.module] || 0) + 5;
    if (APP.ctx.step) { ms.steps[APP.ctx.step] = ms.steps[APP.ctx.step] || {}; ms.steps[APP.ctx.step].time = (ms.steps[APP.ctx.step].time || 0) + 5; }
  }
  if (typeof onTick === "function") onTick();
  if (Date.now() - APP.lastSave > 30000) saveNow();
}, 5000);
document.addEventListener("visibilitychange", () => {
  if (APP.role !== "eleve" || !APP.state) return;
  if (document.visibilityState === "hidden") {
    if (APP.evalActive) {
      APP.state.flags.blur = (APP.state.flags.blur || 0) + 1;
      const cur = APP.evalActive.type === "quiz" ? mst(APP.state, APP.evalActive.id).steps.quiz.current : APP.state.bilans[APP.evalActive.id];
      if (cur) cur.blur = (cur.blur || 0) + 1;
      logEv("blur", APP.evalActive);
    }
    saveNow(true);
  }
});
window.addEventListener("pagehide", () => saveNow(true));
let onTick = null;

/* ---- Coquille ---- */
function shell(inner, opts = {}) {
  const who = APP.role === "eleve" && APP.stu ? `<span class="muted small">${esc(APP.stu.prenom)}</span><button class="btn small ghost" onclick="logout()">Se déconnecter</button>`
    : APP.role === "formateur" ? `<a class="btn small ghost" href="#/formateur">Élèves</a><a class="btn small ghost" href="#/formateur/contenus">Contenus</a><button class="btn small ghost" onclick="logout()">Quitter</button>` : "";
  const fbCount = APP.role === "eleve" ? unreadFeedback() : 0;
  document.getElementById("app").innerHTML = `
  ${CONFIG.DEMO ? `<div class="demo-banner">Démonstration avec des élèves fictifs — rien n'est enregistré en ligne.</div>` : DB.remote ? "" : `<div class="demo-banner">Mode démonstration : les données restent dans ce navigateur. Renseignez Supabase dans la configuration pour le suivi en ligne.</div>`}
  <header class="topbar"><div class="wrap">
    <a class="logo" href="#/${APP.role === "formateur" ? "formateur" : ""}"><span class="logo-mark">MCO</span><span>Parcours de remédiation<small>${esc(CONFIG.ETABLISSEMENT)} · BTS MCO</small></span></a>
    <span class="spacer"></span>
    ${APP.role === "eleve" && APP.stu && APP.state && APP.state.charteAt ? `<a class="btn small ghost" href="#/notes">Mes notes ${unreadGrades() ? `<span class="badge">${unreadGrades()}</span>` : ""}</a><a class="btn small ghost" href="#/retours">Retours ${fbCount ? `<span class="badge">${fbCount}</span>` : ""}</a>` : ""}
    ${who}
  </div></header>
  <main class="${opts.full ? "" : "wrap"} ${opts.narrow ? "narrow" : ""}">${CONFIG.DEMO && !opts.full ? `<div class="${opts.narrow ? "" : ""}">${demoGuide()}</div>` : ""}${inner}</main>
  <div class="footer">Parcours personnalisé de remise à niveau — blocs professionnels du BTS MCO</div>`;
  window.scrollTo({ top: opts.keepScroll ? window.scrollY : 0 });
}
function unreadFeedback() {
  const seen = APP.state && APP.state.feedbackSeen;
  return (APP.chan ? APP.chan.messages : []).filter(f => !seen || f.created_at > seen).length;
}
function unreadGrades() {
  const seen = APP.state && APP.state.gradesSeen;
  return Object.values(APP.chan ? APP.chan.grades : {}).filter(g => !seen || g.at > seen).length;
}
async function refreshChannel() { if (!APP.stu) return; try { APP.chan = parseChannel(await DB.listFeedback(APP.stu.code)); APP.feedback = APP.chan.messages; APP.chanAt = Date.now(); } catch (e) { } }
function logout() { saveNow(); SS.del("pp_session"); APP.role = null; APP.stu = null; APP.state = null; location.hash = "#/"; route(); }

/* ---- Routeur ---- */
async function route() {
  onTick = null; APP.ctx = null; APP.evalActive = null;
  const parts = (location.hash || "#/").replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (parts[0] === "formateur") return routeFormateur(parts.slice(1));
  if (!APP.stu) {
    const ses = SS.get("pp_session");
    if (ses && ses.role === "eleve") { if (await loginEleve(ses.code, true)) return route(); }
    return viewLogin();
  }
  if (!APP.state.charteAt) return viewWelcome();
  if (parts[0] === "module" && parts[1]) return viewModule(parts[1], parts[2]);
  if (parts[0] === "bilan" && parts[1]) return viewBilan(parts[1]);
  if (parts[0] === "retours") return viewRetours();
  if (parts[0] === "notes") return viewNotes();
  if (parts[0] === "examen" && parts[1]) return viewExam(parts[1]);
  if (!APP.chanAt || Date.now() - APP.chanAt > 60000) await refreshChannel();
  return viewDashboard();
}
window.addEventListener("hashchange", () => { if (APP.role === "eleve") saveNow(); route(); });

/* ---- Connexion ---- */
function viewLogin(err) {

async function loginEleve(code, silent) {
  try {
    const stu = await DB.getStudent(code);
    if (!stu) { if (!silent) viewLogin("Code inconnu. Vérifie la saisie (tirets compris)."); return false; }
    APP.role = "eleve"; APP.stu = stu;
    APP.state = Object.assign(newState(), (await DB.getState(stu.code)) || {});
    APP.state.time = Object.assign({ total: 0, byDay: {}, byModule: {} }, APP.state.time || {});
    APP.state.flags = Object.assign({ paste: 0, blur: 0 }, APP.state.flags || {});
    APP.chan = { messages: [], grades: {}, visios: {}, retest: null }; await refreshChannel();
    SS.set("pp_session", { role: "eleve", code: stu.code });
    if (!silent) { logEv("login", {}); }
    APP.state.lastSeen = nowISO(); saveSoon(300);
    if (!silent) { location.hash = "#/"; route(); }
    return true;
  } catch (e) {
    console.error(e);
    if (!silent) viewLogin("Connexion au serveur impossible. Réessaie dans un instant.");
    return false;
  }
}

  }).join("");
}
function planList(stu, state) {
  return stu.planning.map((d, i) => `<tr><td><b>Jour ${d.jour}</b>${state && state.startedAt ? `<br><span class="tiny muted">${fmtDay(plannedDate(stu, state, i))}</span>` : ""}</td>

function dayContentHTML(d) {

}
function dayMinutes(stu, d) { return d.modules.reduce((s, id) => s + MODULES[id].duree, 0) + (d.exam ? EXAMS[d.exam].duree : 0) + (d.bilan ? Math.round(bilanDuration(bilanQuestions(stu, d.bilan).length) / 60) : 0) + (d.retest ? 60 : 0) + (d.visio ? 20 : 0);
}

/* ---- Tableau de bord élève ---- */
function nextAction(stu, state) {
  const i = currentDay(stu, state);
  if (i >= stu.planning.length) return null;
  const d = stu.planning[i];
  for (const id of d.modules) {
    if (!moduleDone(state, id)) { const st = ["cours", "exemple", "exercices", "situation", "quiz"].find(s => !stepDone(state, id, s)); return { href: `#/module/${id}/${st}`, label: `${MODULES[id].titre} — ${STEP_LABEL[st]}`, day: i }; }
  }
  if (d.exam && !examDone(state, d.exam)) return { href: `#/examen/${d.exam}`, label: EXAMS[d.exam].titre, day: i };
  if (d.bilan && !bilanDone(state, d.bilan)) return { href: `#/bilan/${d.bilan}`, label: BILAN_LABEL[d.bilan], day: i };
  if (d.retest && !retestDone(state)) return { href: `#/`, label: "Nouveau passage du test de positionnement (voir le jour " + d.jour + ")", day: i };
  return null;
}
function moduleStatusPill(state, id) {
  if (moduleDone(state, id)) return `<span class="pill ok">Validé</span>`;
  const n = ["cours", "exemple", "exercices", "situation", "quiz"].filter(s => stepDone(state, id, s)).length;
  return n ? `<span class="pill warn">${n}/5 étapes</span>` : `<span class="pill">À faire</span>`;
}
function seriousCard(stu, state, forTrainer) {

  </div>`;
}

  ${mods.map(id => { const init = stu.positionnement[id] || 0; const now = moduleMastery(state, id, grades || (APP.chan && APP.role === "eleve" ? APP.chan.grades : {}));
    return `<div class="comp-row"><span class="pill bloc bloc-${MODULES[id].bloc}">${id}</span><div><div class="small" style="margin-bottom:4px">${esc(COMPETENCES[id])}</div><div class="comp-bars"><div class="bar init"><span style="width:${init}%"></span></div><div class="bar"><span style="width:${now || 0}%"></span></div></div></div><div class="vals small num" style="text-align:right">${init} % → <b>${now == null ? "…" : now + " %"}</b></div></div>`; }).join("")}
  <p class="tiny muted" style="margin-top:10px">Niveau actuel = meilleur score au quiz (40 %), exercices réussis au premier essai (25 %), questions de bilan (15 %) et note du formateur sur la mise en situation (20 %).</p></div>`;
}

            ${dayExtrasHTML(stu, state, d, unlocked)}

        ${missions.map(m => `<div class="check" style="align-items:center"><span>${m.done ? "✅" : "⬜"}</span><a class="small" href="#/module/${m.id}/mission">${MODULES[m.id].fiche ? "<b>Fiche</b> — " + esc(MODULES[m.id].titre) : esc(MODULES[m.id].mission.titre.replace("Mission en entreprise — ", ""))}</a></div>`).join("")}
      </div>
    </div>
  </div>
  <div class="section">${competencesCard(stu, state)}</div>`);
}

/* ---- Module ---- */
function moduleDayIndex(stu, id) { return stu.planning.findIndex(d => d.modules.includes(id)); }
function stepAccessible(state, id, step) {
  if (step === "mission") return stepDone(state, id, "cours");
  const k = STEP_ORDER.indexOf(step);
  return STEP_ORDER.slice(0, k).filter(s => s !== "mission").every(s => stepDone(state, id, s));
}
function minRead(id) { if (CONFIG.DEMO) return 20; const w = MODULES[id].cours.reduce((s, c) => s + wordCount(c.h), 0); return clamp(Math.round(w / 230 * 60 * 0.55), 150, 600); }

function viewModule(id, step) {
  const stu = APP.stu, state = APP.state, m = MODULES[id];
  const di = moduleDayIndex(stu, id);
  if (!m || di < 0) { location.hash = "#/"; return; }
  if (!dayUnlocked(stu, state, di)) { toast("Cette journée n'est pas encore débloquée."); location.hash = "#/"; return; }
  if (!step || !STEP_ORDER.includes(step)) step = STEP_ORDER.find(s => s !== "mission" && !stepDone(state, id, s)) || "quiz";
  if (!stepAccessible(state, id, step)) step = STEP_ORDER.find(s => s !== "mission" && !stepDone(state, id, s));
  APP.ctx = { module: id, step };
  const ms = mst(state, id);
  if (!ms.startedAt) { ms.startedAt = nowISO(); saveSoon(); }
  const stepsBar = STEP_ORDER.map((s, k) => {
    const acc = stepAccessible(state, id, s), done = stepDone(state, id, s);
    return `<button class="step ${s === step ? "active" : ""} ${done ? "done" : ""} ${acc ? "" : "locked"}" ${acc ? `onclick="location.hash='#/module/${id}/${s}'"` : "disabled"}><span class="n">${done ? "✓" : k + 1}</span>${stepLabel(id, s)}</button>`;
  }).join("");
  shell(`<div class="crumbs"><a href="#/">Mon parcours</a> › Jour ${stu.planning[di].jour}</div>

function stepCours(box, id, ms) {

    <div id="endmark"></div>

function renderOpts(name, opts, order, sel, lockInfo) {

  }).join("")}</div>`;
}

function stepExercices(box, id, ms) {
  const m = MODULES[id]; const E = ms.steps.exercices = ms.steps.exercices || { items: {} }; E.items = E.items || {};

            ${it.done ? "" : `<div class="btn-row" style="margin-top:8px"><button class="btn small primary" data-ascheck="${i}">Vérifier</button>${it.tries ? `<span class="small" style="color:var(--bad)">Associations en rouge à corriger (dernier essai).</span>` : ""}</div>`}`;

    const after = (i, ok) => { const it = E.items[i]; it.tries = (it.tries || 0) + 1; if (ok) { it.ok = true; it.done = true; it.first = it.tries === 1; } else if (it.tries >= 2) { it.ok = false; it.done = true; it.first = false; } if (it.done) logEv("exercise", { module: id, i, ok: it.ok, first: it.first }); finishCheck(); redraw(); };

      it.sel = +b.dataset.oi; it.tries = 1; it.ok = it.sel === x.a; it.first = it.ok; it.done = true;

    $$("[data-vf]", box).forEach(b => b.onclick = () => {

    });
    $$("[data-tab]", box).forEach(inp => inp.oninput = () => { const i = +inp.dataset.tab; const it = E.items[i] = E.items[i] || {}; it.vals = it.vals || {}; it.vals[inp.dataset.key] = inp.value; saveSoon(2000); });
    $$("[data-tabcheck]", box).forEach(b => b.onclick = () => {
      const i = +b.dataset.tabcheck, x = m.exercices[i], it = E.items[i] = E.items[i] || {}; it.vals = it.vals || {};
      let all = true, empty = false; x.rows.forEach((r, ri) => r.cells.forEach((c, ci) => { if (c.v != null) return; const v = it.vals[ri + "-" + ci]; if (v == null || v === "") empty = true; if (!numOk(v, c.r, c.tol)) all = false; }));
      if (empty) { toast("Remplis toutes les cases du tableau."); return; }
      after(i, all);
    });
    $$("[data-up],[data-down]", box).forEach(b => b.onclick = () => {
      const [i, pos] = (b.dataset.up || b.dataset.down).split(":").map(Number); const it = E.items[i]; const d = b.dataset.up ? -1 : 1;
      [it.order[pos], it.order[pos + d]] = [it.order[pos + d], it.order[pos]]; saveSoon(); redraw();
    });
    $$("[data-ordcheck]", box).forEach(b => b.onclick = () => { const i = +b.dataset.ordcheck; const it = E.items[i]; after(i, it.order.every((k, pos) => k === pos)); });
    $$("[data-as]", box).forEach(sel => sel.onchange = () => { const i = +sel.dataset.as; const it = E.items[i] = E.items[i] || {}; it.sel = it.sel || {}; it.sel[sel.dataset.k] = sel.value; saveSoon(); });
    $$("[data-ascheck]", box).forEach(b => b.onclick = () => {
      const i = +b.dataset.ascheck, x = m.exercices[i], it = E.items[i] = E.items[i] || {}; it.sel = it.sel || {};

  };
  const redraw = () => { const y = window.scrollY; draw(); window.scrollTo(0, y); };
  const finishCheck = () => {
    if (!E.done && m.exercices.every((x, i) => E.items[i] && E.items[i].done)) { E.done = true; E.at = nowISO(); E.firstOk = m.exercices.filter((x, i) => E.items[i].first).length; logEv("step", { module: id, step: "exercices", firstOk: E.firstOk }); saveNow(); }
    else saveSoon();
  };
  redraw();
}


function minChars() { return APP.stu.profil && APP.stu.profil.analyse < 20 ? 250 : 180; }
function attachPaste(ta, onPaste) {
  ta.addEventListener("paste", e => {
    const txt = (e.clipboardData || window.clipboardData).getData("text") || "";
    if (txt.length < 15) return;
    APP.state.flags.paste = (APP.state.flags.paste || 0) + 1;
    onPaste(txt.length);
    logEv("paste", { where: ta.dataset.where, len: txt.length });
    toast("Collage détecté : il est signalé au formateur. Rédige avec tes propres mots.", 3800);
    saveSoon();
  });
}
function stepSituation(box, id, ms) {
  const sit = MODULES[id].situation; const S = ms.steps.situation = ms.steps.situation || { answers: [], paste: [] };

  const draw = () => {
    if (!S.submittedAt) {
      box.innerHTML = `<div class="card"><h2>${esc(sit.titre)}</h2>${sit.contexte}</div>
        <div class="alert info small">Rédige chaque réponse comme à l'examen : calculs détaillés, puis interprétation et justification (au moins ${need} caractères par réponse). Le corrigé et la grille d'auto-évaluation s'affichent après l'envoi. Ta copie est ensuite <b>corrigée et notée sur 20</b> par ton formateur.</div>
        ${sit.questions.map((q, i) => `<div class="ex answer-box"><div class="q"><span class="n">${i + 1}.</span>${esc(q)}</div>
          <textarea class="input" data-i="${i}" data-where="${id}:situation:${i}" placeholder="Ta réponse argumentée…">${esc(S.answers[i] || "")}</textarea>
          <div class="counter"><span id="cc${i}"></span>${S.paste[i] ? `<span class="warn">Collage signalé</span>` : ""}</div></div>`).join("")}
        <div class="btn-row"><button class="btn primary" id="send">Envoyer mes réponses et voir le corrigé</button><span class="small muted">Les réponses sont enregistrées automatiquement.</span></div>`;
      const cnt = () => sit.questions.forEach((q, i) => { const n = (S.answers[i] || "").trim().length; $("#cc" + i).innerHTML = n >= need ? `✓ ${n} caractères` : `${n} / ${need} caractères minimum`; });
      $$("textarea", box).forEach(ta => {
        ta.oninput = () => { S.answers[+ta.dataset.i] = ta.value; cnt(); saveSoon(2000); };
        attachPaste(ta, () => { S.paste[+ta.dataset.i] = (S.paste[+ta.dataset.i] || 0) + 1; });
      });
      cnt();
      $("#send").onclick = () => {
        const short = sit.questions.findIndex((q, i) => (S.answers[i] || "").trim().length < need);
        if (short >= 0) { toast(`La réponse ${short + 1} est trop courte : développe ta justification.`); return; }
        S.submittedAt = nowISO(); logEv("situation", { module: id, len: S.answers.map(a => a.length) }); saveNow(); draw(); window.scrollTo(0, 0);
      };
    } else {
      S.self = S.self || sit.grille.map(() => false);
      box.innerHTML = `${gradeBlock("situation:" + id, "situation", id)}<div class="card"><h2>${esc(sit.titre)} — corrigé</h2><p class="small muted">Compare ta réponse au corrigé, question par question.</p>
        ${sit.questions.map((q, i) => `<div class="ex"><div class="q"><span class="n">${i + 1}.</span>${esc(q)}</div><div class="small muted">Ta réponse :</div><div class="prod"><div class="txt" style="margin:0;background:none;padding:0">${esc(S.answers[i] || "")}</div></div><div class="corrige"><b>Corrigé</b>${sit.corrige[i]}</div></div>`).join("")}</div>
        <div class="card"><h3>Auto-évaluation</h3><p class="small muted">Coche honnêtement les critères que ta réponse remplit. Ton formateur verra ta réponse et ton auto-évaluation.</p>
          ${sit.grille.map((g, i) => `<label class="check"><input type="checkbox" data-g="${i}" ${S.self[i] ? "checked" : ""} ${S.done ? "disabled" : ""}><span>${esc(g)}</span></label>`).join("")}
          <div class="btn-row" style="margin-top:14px">${S.done ? `<span class="pill ok">Auto-évaluation : ${S.selfScore}/${sit.grille.length}</span><a class="btn primary" href="#/module/${id}/quiz">Passer au quiz</a>` : `<button class="btn primary" id="val">Valider mon auto-évaluation</button>`}</div></div>`;
      $$("[data-g]", box).forEach(c => c.onchange = () => { S.self[+c.dataset.g] = c.checked; saveSoon(); });

    }
  };
  draw();
}

const QUIZ_DRAW = 8;
function drawQuiz(id, attemptsBefore, seed) {
  const m = MODULES[id]; const n = Math.min(QUIZ_DRAW, m.quiz.length);
  const seen = new Set(); attemptsBefore.forEach(a => (a.order || []).forEach(q => seen.add(q)));
  const fresh = shuffled(m.quiz.map((_, k) => k).filter(k => !seen.has(k)), seed);
  const old = shuffled(m.quiz.map((_, k) => k).filter(k => seen.has(k)), seed + "old");
  return fresh.concat(old).slice(0, n);
}
function stepQuiz(box, id, ms) {
  const m = MODULES[id]; const Q = ms.steps.quiz = ms.steps.quiz || { attempts: [] };
  const code = APP.stu.code;
  const draw = () => {
    APP.evalActive = null;
    if (Q.current) {
      APP.evalActive = { type: "quiz", id };
      const cur = Q.current, n = Q.attempts.length + 1;
      if (!cur.order) cur.order = drawQuiz(id, Q.attempts, code + id + "q" + n);
      const order = cur.order;
      box.innerHTML = `<div class="sticky-bar"><span><b>Quiz — tentative ${n}</b> · ${order.filter(q => cur.answers[q] != null).length}/${order.length} répondues</span><span class="small muted">Reste sur cet onglet</span></div>
        ${order.map((qi, k) => { const q = m.quiz[qi]; const oo = shuffled(q.o.map((_, j) => j), code + id + "q" + n + "-" + qi);
          return `<div class="ex"><div class="q"><span class="n">${k + 1}.</span>${q.q}</div>${renderOpts("q" + qi, q.o, oo, cur.answers[qi], null)}</div>`; }).join("")}
        <div class="btn-row"><button class="btn primary" id="sub">Valider mes réponses</button></div>`;
      $$(".opt", box).forEach(b => b.onclick = () => { cur.answers[+b.dataset.name.slice(1)] = +b.dataset.oi; saveSoon(); const y = window.scrollY; draw(); window.scrollTo(0, y); });
      $("#sub").onclick = () => {
        if (order.some(q => cur.answers[q] == null)) { toast("Réponds à toutes les questions."); return; }
        const wrong = order.filter(i => cur.answers[i] !== m.quiz[i].a);
        const score = order.length - wrong.length, p = pct(score, order.length);
        const dur = Math.round((Date.now() - new Date(cur.start).getTime()) / 1000);
        Q.attempts.push({ score, total: order.length, pct: p, at: nowISO(), dur, blur: cur.blur || 0, wrong, order, answers: cur.answers });
        delete Q.current;
        if (p >= QUIZ_PASS && !Q.passed) { Q.passed = true; Q.passedAt = nowISO(); }
        logEv("quiz", { module: id, pct: p, dur, attempt: Q.attempts.length });
        saveNow(); draw(); window.scrollTo(0, 0);
      };
      return;
    }
    const last = Q.attempts[Q.attempts.length - 1];
    let html = "";
    if (!last) {
      html = `<div class="card"><h2>Quiz de validation</h2><p>${QUIZ_DRAW} questions tirées au hasard dans une banque de ${m.quiz.length}. Il faut <b>${QUIZ_PASS} %</b> de bonnes réponses pour valider le module.</p>
        <ul class="small"><li>À chaque nouvelle tentative, les questions changent : relire la correction ne suffit pas, il faut comprendre.</li><li>Pas de limite de temps, mais reste sur cet onglet : les sorties sont signalées.</li></ul>
        <button class="btn primary" id="go">Commencer le quiz</button></div>`;
    } else {
      html = `<div class="card"><div class="section-title"><h2 class="mb0">Résultat : ${last.score}/${last.total} (${last.pct} %)</h2><span class="pill ${last.pct >= QUIZ_PASS ? "ok" : "bad"}">${last.pct >= QUIZ_PASS ? "Module validé" : "Non validé"}</span></div>
        <p class="small muted">Tentatives : ${Q.attempts.map(a => a.pct + " %").join(" · ")} — meilleur score ${quizBest(APP.state, id)} %</p>
        ${!Q.passed ? `<div class="alert warn">Lis attentivement la correction ci-dessous, puis relis la partie du cours concernée. La prochaine tentative portera sur d'autres questions.</div>` : ""}
        <div class="btn-row">${!Q.passed ? `<button class="btn primary" id="go">Nouvelle tentative</button><a class="btn" href="#/module/${id}/cours">Revoir le cours</a>` : nextAfterModule(id)}${Q.passed ? `<button class="btn" id="go">M'entraîner sur d'autres questions</button>` : ""}</div></div>
        <div class="card"><h3>Correction de la tentative ${Q.attempts.length}</h3>${last.order.map((qi, k) => { const q = m.quiz[qi]; const ok = last.answers[qi] === q.a;
          return `<div class="ex"><div class="q"><span class="n">${k + 1}.</span>${q.q}</div><div class="small">Ta réponse : <b>${q.o[last.answers[qi]] || "—"}</b> ${ok ? "✅" : "❌"}</div>${ok ? "" : `<div class="small">Bonne réponse : <b>${q.o[q.a]}</b></div>`}<div class="fb info">${q.c}</div></div>`; }).join("")}</div>`;
    }
    box.innerHTML = html;
    const go = $("#go"); if (go) go.onclick = () => { Q.current = { start: nowISO(), answers: {}, blur: 0 }; saveSoon(); draw(); window.scrollTo(0, 0); };
  };
  draw();
}

function nextAfterModule(id) {
  const stu = APP.stu, state = APP.state, di = moduleDayIndex(stu, id), d = stu.planning[di];
  const nextMod = d.modules.find(x => !moduleDone(state, x));
  const mis = stepDone(state, id, "mission") ? "" : `<a class="btn" href="#/module/${id}/mission">Faire la mission entreprise</a>`;
  if (nextMod) return `<a class="btn primary" href="#/module/${nextMod}">Module suivant : ${esc(MODULES[nextMod].titre)}</a>${mis}`;
  if (d.bilan && !bilanDone(state, d.bilan)) return `<a class="btn primary" href="#/bilan/${d.bilan}">Passer au ${BILAN_LABEL[d.bilan].toLowerCase()}</a>${mis}`;
  return `<a class="btn primary" href="#/">Retour au planning</a>${mis}`;
}

function stepMission(box, id, ms) {
  const m = MODULES[id]; const mi = m.mission; const S = ms.steps.mission = ms.steps.mission || {};
  const fbs = (APP.chan ? APP.chan.messages : []).filter(f => f.item === id + ":mission" || f.item === id + ":fiche");
  if (m.fiche) {
    S.fields = S.fields || {};
    const comps = Object.keys(COMPETENCES).filter(c => c !== "SYNTH" && (c.startsWith("C1") || c.startsWith("C2")));
    S.comps = S.comps || [];
    box.innerHTML = `${gradeBlock("fiche:" + id, "fiche", id)}<div class="card"><h2>Fiche de situation professionnelle</h2>
      <p><b>Situation à décrire :</b> ${esc(m.fiche)}</p>

      ${S.at ? `<span class="pill ok">Envoyée le ${fmtDateTime(S.at)}</span>` : ""}</div>
      ${FICHE_CHAMPS.map(f => `<div class="ex answer-box"><div class="q">${esc(f.t)}</div><p class="small muted" style="margin-top:-6px">${esc(f.aide)}</p>
        <textarea class="input" data-f="${f.k}" data-where="${id}:fiche:${f.k}" style="min-height:${f.min > 300 ? 200 : 130}px">${esc(S.fields[f.k] || "")}</textarea>
        <div class="counter"><span id="fc-${f.k}"></span></div></div>`).join("")}
      <div class="ex"><div class="q">Compétences du référentiel mobilisées</div><div class="comp-check">${comps.map(c => `<label class="check" style="border:none;padding:3px 0"><input type="checkbox" data-c="${c}" ${S.comps.includes(c) ? "checked" : ""}><span><b>${c}</b> ${esc(COMPETENCES[c])}</span></label>`).join("")}</div></div>
      ${S.paste ? `<p class="small" style="color:var(--warn)">Collage signalé au formateur.</p>` : ""}
      <div class="btn-row"><button class="btn primary" id="fs">${S.at ? "Renvoyer ma fiche mise à jour" : "Envoyer ma fiche au formateur"}</button><span class="small muted">Enregistrement automatique du brouillon.</span></div>
      ${fbs.length ? `<div class="card"><h3>Retours du formateur</h3>${fbs.map(f => `<div class="feedback-item"><div class="tiny muted">${fmtDateTime(f.created_at)}</div>${esc(f.message)}</div>`).join("")}</div>` : ""}`;
    const cnt = () => FICHE_CHAMPS.forEach(f => { const n = (S.fields[f.k] || "").trim().length; $("#fc-" + f.k).innerHTML = n >= f.min ? `✓ ${n} caractères` : `${n} / ${f.min} caractères minimum`; });
    $$("[data-f]", box).forEach(ta => { ta.oninput = () => { S.fields[ta.dataset.f] = ta.value; cnt(); saveSoon(2000); }; attachPaste(ta, () => { S.paste = (S.paste || 0) + 1; }); });
    $$("[data-c]", box).forEach(c => c.onchange = () => { S.comps = $$("[data-c]", box).filter(x => x.checked).map(x => x.dataset.c); saveSoon(); });
    cnt();
    $("#fs").onclick = () => {
      const short = FICHE_CHAMPS.find(f => (S.fields[f.k] || "").trim().length < f.min);
      if (short) { toast(`Rubrique « ${short.t} » trop courte : développe-la.`); return; }
      if (!S.comps.length) { toast("Coche au moins une compétence mobilisée."); return; }
      S.at = nowISO(); S.text = FICHE_CHAMPS.map(f => f.t.toUpperCase() + "\n" + S.fields[f.k]).join("\n\n");
      logEv("mission", { module: id, fiche: true, len: S.text.length }); saveNow(); toast("Fiche envoyée à ton formateur."); viewModule(id, "mission");
    };
    return;
  }
  box.innerHTML = `<div class="card"><h2>${esc(mi.titre)}</h2><p>${esc(mi.consigne)}</p>
    <p class="small muted">À rendre avant la fin de la semaine du module. Tu peux compléter ta réponse et la renvoyer tant que nécessaire.</p>
    <div class="answer-box"><textarea class="input" id="mt" data-where="${id}:mission" style="min-height:220px" placeholder="Ton compte rendu de mission…">${esc(S.draft != null ? S.draft : S.text || "")}</textarea>
    <div class="counter"><span id="mc"></span>${S.paste ? `<span class="warn">Collage signalé</span>` : ""}</div></div>
    <div class="btn-row" style="margin-top:10px"><button class="btn primary" id="ms">${S.at ? "Mettre à jour ma mission" : "Rendre ma mission"}</button>${S.at ? `<span class="pill ok">Rendue le ${fmtDateTime(S.at)}</span>` : ""}</div></div>
    ${fbs.length ? `<div class="card"><h3>Retours du formateur</h3>${fbs.map(f => `<div class="feedback-item"><div class="tiny muted">${fmtDateTime(f.created_at)}</div>${esc(f.message)}</div>`).join("")}</div>` : ""}`;
  const ta = $("#mt");

  ta.oninput = () => { S.draft = ta.value; cnt(); saveSoon(2000); };
  attachPaste(ta, () => { S.paste = (S.paste || 0) + 1; });
  cnt();
  $("#ms").onclick = () => {
    if (ta.value.trim().length < 150) { toast("Ta mission est trop courte : détaille davantage."); return; }
    S.text = ta.value; S.at = nowISO(); delete S.draft; logEv("mission", { module: id, len: S.text.length }); saveNow(); toast("Mission enregistrée."); viewModule(id, "mission");
  };
}

}

function markRetest() { APP.state.retestDone = nowISO(); logEv("retest", {}); saveNow(); toast("Merci ! Ton formateur saisira tes nouveaux résultats."); route(); }
function notesSummaryCard(stu, state) {

function gradeBlock(key, kind, ref) {

    <table class="dt"><tr><th>Critère</th><th>Niveau</th><th class="num">Points</th></tr>${crit.map((c, i) => { const lv = g.levels[i]; const lab = lv === 1 ? "Acquis" : lv === 0.5 ? "Partiel" : "Non acquis";
      return `<tr><td>${esc(c.t)}${g.comments && g.comments[i] ? `<div class="small muted">${esc(g.comments[i])}</div>` : ""}</td><td><span class="pill ${lv === 1 ? "ok" : lv === 0.5 ? "warn" : "bad"}">${lab}</span></td><td class="num">${fmt1(c.pts * lv)} / ${fmt1(c.pts)}</td></tr>`; }).join("")}</table>
    ${g.general ? `<div class="feedback-item" style="margin-top:12px"><b>Appréciation :</b> ${esc(g.general)}</div>` : ""}<p class="tiny muted">Corrigé le ${fmtDateTime(g.at)}</p></div>`;

function retestCompare(stu, rt) {

/* ---- Cas d'examen ---- */
function viewExam(exId) {
  const stu = APP.stu, state = APP.state, ex = EXAMS[exId];
  const di = stu.planning.findIndex(d => d.exam === exId);
  if (!ex || di < 0) { location.hash = "#/"; return; }
  if (!dayUnlocked(stu, state, di) || !dayModulesDone(stu, state, di)) { toast("Cette journée n'est pas encore débloquée."); location.hash = "#/"; return; }
  state.exams = state.exams || {};
  const E = state.exams[exId] = state.exams[exId] || { answers: [], paste: [] };
  APP.ctx = { exam: exId };
  const need = 300;
  if (!E.start) {
    shell(`<div class="crumbs"><a href="#/">Mon parcours</a> › Jour ${stu.planning[di].jour}</div><div class="card section"><span class="pill bad">Cas d'examen</span><h1>${esc(ex.titre)}</h1><p class="muted">${esc(ex.sous)}</p>
      <p>Durée conseillée : <b>${ex.duree} minutes</b>, comme à l'épreuve. ${ex.questions.length} questions rédigées, corrigées et notées sur 20 par ton formateur selon une grille de critères.</p>
      <ul><li>Prépare ta calculatrice et une feuille de brouillon. Le chronomètre indique le temps écoulé ; tu peux enregistrer et reprendre plus tard.</li><li>Chaque réponse doit être justifiée par des chiffres du cas (au moins ${need} caractères par réponse).</li><li>Le corrigé s'affichera quand ton formateur aura noté ta copie. Les collages sont signalés.</li></ul>
      <button class="btn primary" id="go">Commencer le cas</button></div>`, { narrow: true });
    $("#go").onclick = () => { E.start = nowISO(); logEv("exam_start", { exam: exId }); saveNow(); viewExam(exId); };
    return;
  }
  if (E.submittedAt) {
    const g = APP.chan && APP.chan.grades["exam:" + exId];
    shell(`<div class="crumbs"><a href="#/">Mon parcours</a> › Jour ${stu.planning[di].jour}</div><div class="mod-head bloc-${ex.bloc}"><span class="pill bad">Cas d'examen</span><h1>${esc(ex.titre)}</h1><div class="muted">Copie envoyée le ${fmtDateTime(E.submittedAt)} · ${fmtDuration(E.dur)} de travail</div></div>
      ${g ? gradeBlock("exam:" + exId, "exam", exId) : `<div class="alert info">Ta copie est en cours de correction par ton formateur. Tu recevras ta note et le corrigé dans « Mes notes ».</div>`}
      <div class="card"><h3>Ta copie</h3>${ex.questions.map((q, i) => `<div class="ex"><div class="q"><span class="n">${i + 1}.</span>${esc(q)}</div><div class="prod"><div class="txt" style="margin:0;background:none;padding:0">${esc(E.answers[i] || "")}</div></div>${g ? `<div class="corrige"><b>Corrigé</b>${ex.corrige[i]}</div>` : ""}</div>`).join("")}</div>
      <div class="btn-row section"><a class="btn primary" href="#/">Retour au planning</a></div>`, { narrow: true });
    return;
  }
  const elapsed = () => Math.round((Date.now() - new Date(E.start).getTime()) / 1000);
  shell(`<div class="sticky-bar"><b>${esc(ex.titre)}</b><span class="timer" id="tm"></span></div>
    <div class="card"><p class="muted">${esc(ex.sous)}</p>${ex.contexte}</div>
    ${ex.questions.map((q, i) => `<div class="ex answer-box"><div class="q"><span class="n">${i + 1}.</span>${esc(q)}</div>
      <textarea class="input" data-i="${i}" data-where="${exId}:${i}" style="min-height:220px" placeholder="Ta réponse argumentée et chiffrée…">${esc(E.answers[i] || "")}</textarea>
      <div class="counter"><span id="ec${i}"></span>${E.paste[i] ? `<span class="warn">Collage signalé</span>` : ""}</div></div>`).join("")}
    <div class="btn-row section"><button class="btn primary" id="send">Envoyer ma copie au formateur</button><span class="small muted">Brouillon enregistré automatiquement.</span></div>`, { narrow: true });
  const cnt = () => ex.questions.forEach((q, i) => { const n = (E.answers[i] || "").trim().length; $("#ec" + i).innerHTML = n >= need ? `✓ ${n} caractères` : `${n} / ${need} caractères minimum`; });
  $$("textarea").forEach(ta => { ta.oninput = () => { E.answers[+ta.dataset.i] = ta.value; cnt(); saveSoon(2000); }; attachPaste(ta, () => { E.paste[+ta.dataset.i] = (E.paste[+ta.dataset.i] || 0) + 1; }); });
  cnt();
  const tick = () => { const el = $("#tm"); if (!el) return false; const t = elapsed(); const left = ex.duree * 60 - t; el.textContent = left >= 0 ? `${Math.floor(t / 60)} min écoulées · ${Math.ceil(left / 60)} min conseillées restantes` : `${Math.floor(t / 60)} min écoulées (temps conseillé dépassé)`; el.classList.toggle("low", left < 600); return true; };
  tick(); const iv = setInterval(() => { if (!tick()) clearInterval(iv); }, 15000);
  $("#send").onclick = () => {
    const short = ex.questions.findIndex((q, i) => (E.answers[i] || "").trim().length < need);
    if (short >= 0) { toast(`La réponse ${short + 1} est trop courte : développe et chiffre ta justification.`); return; }
    E.submittedAt = nowISO(); E.dur = elapsed(); logEv("exam", { exam: exId, dur: E.dur, len: E.answers.map(a => a.length) }); saveNow(); toast("Copie envoyée à ton formateur."); viewExam(exId);
  };
}

/* ---- Bilans ---- */
function viewBilan(key) {
  const stu = APP.stu, state = APP.state;
  const di = stu.planning.findIndex(d => d.bilan === key);
  if (di < 0) { location.hash = "#/"; return; }
  if (!dayUnlocked(stu, state, di) || !dayModulesDone(stu, state, di) || (stu.planning[di].exam && !examDone(state, stu.planning[di].exam))) { toast("Termine d'abord les modules et le cas d'examen de la journée."); location.hash = "#/"; return; }
  const qs = bilanQuestions(stu, key), dur = bilanDuration(qs.length);
  const B = state.bilans[key];
  const title = BILAN_LABEL[key];
  if (!B || !B.start) {
    shell(`<div class="crumbs"><a href="#/">Mon parcours</a> › Jour ${stu.planning[di].jour}</div><div class="card section"><h1>${title}</h1>
      <p>${qs.length} questions inédites sur ${key === "FINAL" ? "l'ensemble du parcours" : "les modules de la semaine"}. Durée : <b>${Math.round(dur / 60)} minutes</b>, chronométrées.</p>
      <ul><li>Une seule tentative : prépare ta calculatrice, une feuille et un moment calme.</li><li>Le chronomètre continue même si tu fermes la page ; à la fin du temps, le bilan est envoyé automatiquement.</li><li>Les sorties d'onglet sont comptabilisées et transmises au formateur.</li></ul>
      <button class="btn primary" id="go">Démarrer le bilan</button></div>`, { narrow: true });
    $("#go").onclick = () => { state.bilans[key] = { start: nowISO(), answers: {}, blur: 0 }; logEv("bilan_start", { key }); saveNow(); viewBilan(key); };
    return;
  }
  if (B.submittedAt) return bilanResult(key, qs);
  APP.evalActive = { type: "bilan", id: key };

  const tick = () => { const r = remaining(); const el = $("#tm"); if (!el) return; if (r <= 0) { submitBilan(key, qs, true); return; } el.textContent = `${Math.floor(r / 60)}:${String(r % 60).padStart(2, "0")}`; el.classList.toggle("low", r < 120); };
  tick(); const iv = setInterval(() => { if (!$("#tm")) { clearInterval(iv); return; } tick(); }, 1000);

  updCnt();
  $("#sub").onclick = () => { const miss = qs.length - Object.keys(B.answers).filter(k => B.answers[k] !== "" && B.answers[k] != null).length; if (miss && !confirm(`${miss} question(s) sans réponse. Envoyer quand même ?`)) return; submitBilan(key, qs, false); };
}
function submitBilan(key, qs, auto) {

      return items.map((it, k) => `<tr>${k === 0 ? `<td rowspan="${items.length}"><b>J${d.jour}</b></td><td rowspan="${items.length}" class="small">${st.startedAt ? fmtDay(due) : "—"}</td>` : ""}${it}</tr>`).join("");

        <div class="card kpi"><div class="label">Temps effectif</div><div class="value">${fmtDuration(st.time.total)}</div><div class="sub">sur ≈ ${fmtDuration(expected)} prévues</div></div>
        <div class="card kpi"><div class="label">Moyenne des copies</div><div class="value">${avg == null ? "—" : fmt1(avg)}</div><div class="sub">${Object.keys(ch.grades).length} corrigée(s) · ${pend.length} en attente</div></div>
        <div class="card kpi"><div class="label">Bilans auto-corrigés</div><div class="value" style="font-size:1.25rem">${B("S1")} · ${B("S2")} · ${B("FINAL")}</div><div class="sub">S1 · S2 · final (/20) — départ ${fmt1(s.moyenne_initiale)}</div></div>
      </div>

      <div class="card section"><h3>Planning et résultats</h3><div class="scroll-x"><table class="dt">
        <tr><th>Jour</th><th>Prévu</th><th>Contenu</th><th>Statut</th><th>Terminé</th><th class="num">Temps</th><th class="num">Quiz</th><th class="num">Exos 1ᵉʳ essai</th><th class="num">Note /20</th><th>Mission / fiche</th></tr>
        ${s.planning.map(rowsFor).join("")}

        <div class="grid g3"><div><div class="small muted">Savoirs</div><b>${s.profil.savoirs} %</b></div><div><div class="small muted">Mise en application</div><b>${s.profil.application} %</b></div><div><div class="small muted">Analyse et justification</div><b>${s.profil.analyse} %</b></div></div>
        ${blocBars(s)}<h4>Points de vigilance</h4><ul class="small">${(s.vigilance || []).map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>`;
    bindVisio(s); bindRetest(s);
  }
  if (tab === "productions") renderProductions(box, s, st, fbs, ch);

  if (tab === "reglages") renderReglages(box, s, st);
}

/* ---- Visios ---- */
function visioCard(s, st, ch) {
  const keys = s.planning.filter(d => d.visio).map(d => ({ k: d.visio, i: s.planning.indexOf(d) }));
  return `<div class="card"><h3>Visios de suivi</h3><p class="small muted">Date, heure et lien apparaissent dans le planning de l'élève.</p>
    ${keys.map(({ k, i }) => { const v = ch.visios[k] || {};
      return `<div class="visio-row" data-v="${k}"><div class="small"><b>Point ${k.slice(1)}</b> — fin de semaine ${k.slice(1)}${st.startedAt ? `, vers le ${fmtDay(plannedDate(s, st, i))}` : ""}</div>
        <div class="grid g2" style="gap:8px;margin-top:6px"><input class="input" type="datetime-local" data-vf="date" value="${esc(v.date || "")}"><input class="input" data-vf="link" placeholder="Lien de la visio (Meet, Teams, Zoom…)" value="${esc(v.link || "")}"></div>
        <textarea class="input" data-vf="notes" rows="2" style="margin-top:6px" placeholder="Notes de l'entretien (visibles par l'élève)">${esc(v.notes || "")}</textarea>
        <div class="btn-row" style="margin-top:6px"><label class="check" style="border:none;padding:0"><input type="checkbox" data-vf="done" ${v.done ? "checked" : ""}><span>Visio réalisée</span></label><button class="btn small primary" data-vsave="${k}">Enregistrer</button></div></div>`; }).join("<hr class=\"sep\">")}</div>`;
}
function bindVisio(s) {
  $$("[data-vsave]").forEach(b => b.onclick = async () => {
    const row = b.closest("[data-v]"); const g = n => row.querySelector(`[data-vf="${n}"]`);
    const v = { date: g("date").value, link: g("link").value.trim(), notes: g("notes").value.trim(), done: g("done").checked };
    try { await DB.addFeedback(s.code, "visio:" + row.dataset.v, JSON.stringify(v)); toast("Visio enregistrée."); } catch (e) { toast("Échec : " + e.message); }
  });
}

/* ---- Re-test du positionnement ---- */
function retestCard(s, st, ch) {
  const rt = ch.retest;
  return `<div class="card"><h3>Nouveau passage du test de positionnement</h3>
    <p class="small muted">${st.retestDone ? `L'élève a indiqué avoir terminé le test le ${fmtDateTime(st.retestDone)}.` : "Prévu le dernier jour du parcours."} Saisissez les notes par bloc de la nouvelle fiche ; la comparaison s'affiche ici et chez l'élève.</p>
    <div class="grid g4" style="gap:8px">${[1, 2, 3, 4].map(b => `<label class="field" style="margin:4px 0"><span>Bloc ${b} (/20)</span><input class="input" inputmode="decimal" data-rt="${b}" placeholder="ex. 10,5" value="${rt ? rt.blocs[b] : ""}"></label>`).join("")}</div>
    <div class="btn-row"><button class="btn small primary" id="rtsave">Enregistrer les résultats</button></div>
    ${rt ? `<table class="dt" style="margin-top:12px"><tr><th>Bloc</th><th class="num">Départ</th><th class="num">Arrivée</th><th class="num">Écart</th></tr>${[1, 2, 3, 4].map(b => { const a = s.blocs_initiaux[b], z = rt.blocs[b]; return `<tr><td>Bloc ${b}</td><td class="num">${fmt1(a)}</td><td class="num"><b>${fmt1(z)}</b></td><td class="num" style="color:${z >= a ? "var(--ok)" : "var(--bad)"}">${z - a >= 0 ? "+" : ""}${fmt1(z - a)}</td></tr>`; }).join("")}<tr><td><b>Moyenne</b></td><td class="num">${fmt1(s.moyenne_initiale)}</td><td class="num"><b>${fmt1(rt.moyenne)}</b></td><td class="num" style="color:${rt.moyenne >= s.moyenne_initiale ? "var(--ok)" : "var(--bad)"}"><b>${rt.moyenne - s.moyenne_initiale >= 0 ? "+" : ""}${fmt1(rt.moyenne - s.moyenne_initiale)}</b></td></tr></table>
      <p class="small">${rt.moyenne >= 10 ? `<span class="pill ok">Seuil de 10/20 atteint</span>` : `<span class="pill bad">Seuil de 10/20 non atteint</span>`}</p>` : ""}</div>`;
}
function bindRetest(s) {
  const b = $("#rtsave"); if (!b) return;
  b.onclick = async () => {
    const blocs = {}; let ok = true; [1, 2, 3, 4].forEach(k => { const v = parseNum($(`[data-rt="${k}"]`).value); if (isNaN(v) || v < 0 || v > 20) ok = false; blocs[k] = v; });
    if (!ok) { toast("Saisissez les quatre notes entre 0 et 20."); return; }
    const moyenne = Math.round((blocs[1] + blocs[2] + blocs[3] + blocs[4]) / 4 * 10) / 10;
    try { await DB.addFeedback(s.code, "retest", JSON.stringify({ blocs, moyenne })); toast("Résultats enregistrés."); viewTrainerStudent(s.code, "synthese"); } catch (e) { toast("Échec : " + e.message); }
  };
}

function timeChart(s, st) {
  if (!st.startedAt) return `<p class="muted">Aucune activité.</p>`;
  const start = new Date(st.startedAt); const days = [];
  const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()); const today = new Date();
  while (d <= today && days.length < 28) { days.push(new Date(d)); d.setDate(d.getDate() + 1); }
  const vals = days.map(x => Math.round((st.time.byDay[dayKey(x)] || 0) / 60));
  const max = Math.max(90, ...vals); const W = 520, H = 190, pad = 28, bw = (W - pad - 6) / days.length;
  const y = v => H - 22 - (v / max) * (H - 40);
  return `<svg class="svgchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes de travail par jour">
    ${[0, 45, 90].filter(v => v <= max).map(v => `<line class="gridl" x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="0" y="${y(v) + 4}">${v}′</text>`).join("")}
    ${vals.map((v, i) => { const x = pad + i * bw + 2, w = Math.max(3, bw - 4); const we = !isWorkday(days[i]);
      return `<rect class="barr" x="${x}" y="${y(v)}" width="${w}" height="${H - 22 - y(v)}" rx="2" opacity="${we ? .45 : 1}"><title>${fmtDay(days[i])} : ${v} min</title></rect>${v ? `<text class="bart" x="${x + w / 2}" y="${y(v) - 4}" text-anchor="middle">${v}</text>` : ""}<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${days[i].getDate()}</text>`; }).join("")}
  </svg><p class="tiny muted">Minutes d'activité effective (onglet visible et interaction récente). Barres claires : week-ends et jours fériés. Objectif : environ 90 min par jour ouvré.</p>`;
}

function renderProductions(box, s, st, fbs, ch) {

  const fbFor = item => ch.messages.filter(f => f.item === item);
  const fbBlock = item => `<div>${fbFor(item).map(f => `<div class="feedback-item"><div class="tiny muted">${fmtDateTime(f.created_at)}</div>${esc(f.message)}</div>`).join("")}
    <div class="btn-row" style="margin-top:8px;align-items:flex-start"><textarea class="input" id="fb-${item.replace(/[^a-z0-9]/gi, "_")}" rows="2" style="flex:1;min-width:220px" placeholder="Votre message à l'élève…"></textarea><button class="btn small primary" onclick="sendFb('${s.code}','${item}')">Envoyer</button></div></div>`;
  const prods = productions(s, st);
  let html = `<div class="card"><h3>Message général à ${esc(s.prenom)}</h3>${fbBlock("general")}</div>
    <div class="card section"><div class="section-title"><h3 class="mb0">Copies notées</h3><span class="small muted">Moyenne : ${gradesAverage(ch.grades) == null ? "—" : fmt1(gradesAverage(ch.grades)) + "/20"}</span></div>
    ${prods.length ? `<table class="dt"><tr><th>Copie</th><th>Envoyée</th><th class="num">Note</th><th></th></tr>${prods.map(p => { const g = ch.grades[gradeKey(p)]; const stale = g && g.at < p.at;
      return `<tr><td>${p.kind === "exam" ? `<span class="pill bad">Examen</span> ` : p.kind === "fiche" ? `<span class="pill">Fiche</span> ` : `<span class="pill">Situation</span> `}${esc(p.title)}</td><td class="small">${fmtDateTime(p.at)}</td><td class="num">${g ? `<b>${fmt1(g.note20)}/20</b>${stale ? ` <span class="pill warn">renvoyée depuis</span>` : ""}` : `<span class="pill warn">À corriger</span>`}</td><td><a class="btn small ${g && !stale ? "" : "primary"}" href="#/formateur/corriger/${s.code}/${p.kind}/${p.ref}">${g ? "Revoir" : "Corriger"}</a></td></tr>`; }).join("")}</table>` : `<p class="muted">Aucune copie envoyée pour l'instant.</p>`}</div>`;
  const missions = allModules(s).filter(id => !MODULES[id].fiche && st.modules[id] && st.modules[id].steps.mission && st.modules[id].steps.mission.at);
  if (missions.length) html += `<div class="card section"><h3>Missions en entreprise (non notées)</h3>${missions.map(id => { const mis = st.modules[id].steps.mission;
    return `<div class="prod"><div class="head"><b>${esc(MODULES[id].mission.titre)}</b><span class="small muted">Rendue le ${fmtDateTime(mis.at)} · ${mis.text.length} caractères${mis.paste ? ` · <span style="color:var(--bad)">${mis.paste} collage(s)</span>` : ""}</span></div><div class="txt">${esc(mis.text)}</div><h4>Retour sur la mission</h4>${fbBlock(id + ":mission")}</div>`; }).join("")}</div>`;
  box.innerHTML = html;
}
async function sendFb(code, item) {
  const ta = document.getElementById("fb-" + item.replace(/[^a-z0-9]/gi, "_"));

  try { await DB.addFeedback(code, item, msg); toast("Message envoyé à l'élève."); viewTrainerStudent(code, "productions"); }
  catch (e) { toast("Échec de l'envoi : " + e.message); }
}

/* ---- Correction guidée ---- */
async function viewGrade(code, kind, ref) {
  shell(`<div class="section"><p class="muted">Chargement…</p></div>`);
  let s, st, ch;
  try { s = await DB.getStudent(code); st = hydrate(await DB.getState(code)); ch = parseChannel(await DB.listFeedback(code)); } catch (e) { shell(`<div class="alert bad">Erreur : ${esc(e.message)}</div>`); return; }
  const key = kind + ":" + ref; const crit = criteriaFor(kind, ref); const prev = ch.grades[key];
  let title, sub, answersHTML, corrigeHTML, sentAt, flags = "";
  if (kind === "exam") {
    const ex = EXAMS[ref], E = st.exams[ref] || {}; title = ex.titre; sub = ex.sous; sentAt = E.submittedAt;
    answersHTML = `<details class="ctx"><summary>Voir l'énoncé et les données du cas</summary><div class="content">${ex.contexte}</div></details>` + ex.questions.map((q, i) => `<div class="ga"><div class="q"><span class="n">${i + 1}.</span>${esc(q)}</div><div class="txt">${esc(E.answers ? E.answers[i] || "" : "")}</div><div class="tiny muted">${(E.answers && E.answers[i] || "").length} caractères${E.paste && E.paste[i] ? ` · <span style="color:var(--bad)">${E.paste[i]} collage(s)</span>` : ""}</div></div>`).join("");
    corrigeHTML = ex.corrige.map((c, i) => `<div class="corrige small"><b>Question ${i + 1}</b>${c}</div>`).join("");
    flags = E.dur ? `Temps de travail : ${fmtDuration(E.dur)} (conseillé ${ex.duree} min)` : "";
  } else if (kind === "fiche") {
    const m = MODULES[ref], F = (st.modules[ref] && st.modules[ref].steps.mission) || {}; title = "Fiche de situation professionnelle"; sub = m.titre + " — " + m.fiche; sentAt = F.at;
    answersHTML = FICHE_CHAMPS.map(f => `<div class="ga"><div class="q">${esc(f.t)}</div><div class="txt">${esc((F.fields || {})[f.k] || "")}</div></div>`).join("") + `<div class="ga"><div class="q">Compétences mobilisées</div><div class="small">${(F.comps || []).map(c => `<span class="pill">${c}</span>`).join(" ") || "—"}</div></div>`;
    corrigeHTML = `<div class="small"><p><b>Points d'attention pour la correction</b></p><ul><li>Le contexte permet-il au jury de situer l'entreprise, le rayon et le rôle exact de l'élève ?</li><li>L'objectif est-il formulé précisément et, si possible, chiffré ?</li><li>La démarche décrit-elle ce que l'élève a fait lui-même, avec les outils et notions du module « ${esc(m.titre)} » ?</li><li>Les résultats sont-ils mesurés et comparés à l'objectif ?</li><li>L'analyse montre-t-elle du recul : causes, limites, axes d'amélioration réalistes ?</li></ul><p>Repères du cours : ${m.objectifs.map(esc).join(" ; ")}.</p></div>`;
    flags = F.paste ? `<span style="color:var(--bad)">${F.paste} collage(s) détecté(s)</span>` : "";
  } else {
    const m = MODULES[ref], S = (st.modules[ref] && st.modules[ref].steps.situation) || {}; title = m.situation.titre; sub = m.titre; sentAt = S.submittedAt;
    answersHTML = `<details class="ctx"><summary>Voir le contexte de la mise en situation</summary><div class="content">${m.situation.contexte}</div></details>` + m.situation.questions.map((q, i) => `<div class="ga"><div class="q"><span class="n">${i + 1}.</span>${esc(q)}</div><div class="txt">${esc(S.answers ? S.answers[i] || "" : "")}</div><div class="tiny muted">${(S.answers && S.answers[i] || "").length} caractères${S.paste && S.paste[i] ? ` · <span style="color:var(--bad)">${S.paste[i]} collage(s)</span>` : ""}</div></div>`).join("");
    corrigeHTML = m.situation.corrige.map((c, i) => `<div class="corrige small"><b>Question ${i + 1}</b>${c}</div>`).join("");
    flags = S.self ? `Auto-évaluation de l'élève : ${S.selfScore}/${m.situation.grille.length} critères cochés` : "";
  }
  if (!sentAt) { shell(`<div class="section"><div class="alert warn">Cette copie n'a pas encore été envoyée par l'élève.</div><a class="btn" href="#/formateur/eleve/${code}/productions">Retour</a></div>`); return; }
  const levels = prev ? prev.levels.slice() : crit.map(() => null);
  const comments = prev ? (prev.comments || []).slice() : crit.map(() => "");
  shell(`<div class="crumbs"><a href="#/formateur">Élèves</a> › <a href="#/formateur/eleve/${code}/productions">${esc(s.nom)}</a> › Correction</div>
    <div class="section-title"><div><span class="pill ${kind === "exam" ? "bad" : ""}">${kind === "exam" ? "Cas d'examen" : kind === "fiche" ? "Fiche de situation" : "Mise en situation"}</span><h1 style="margin-top:6px">${esc(title)}</h1><div class="muted small">${esc(sub)} · envoyée le ${fmtDateTime(sentAt)}${flags ? " · " + flags : ""}</div></div></div>
    ${prev && prev.at < sentAt ? `<div class="alert warn">L'élève a renvoyé sa copie après votre correction du ${fmtDateTime(prev.at)}. Vérifiez et republiez la note.</div>` : ""}
    <div class="grade-layout">
      <div class="grade-col"><h3>Copie de l'élève</h3>${answersHTML}</div>
      <div class="grade-col"><h3>${kind === "fiche" ? "Repères de correction" : "Corrigé"}</h3>${corrigeHTML}</div>
    </div>
    <div class="card section grade-panel"><div class="section-title"><h2 class="mb0">Grille de notation</h2><span class="pill brand" id="tot">— / 20</span></div>
      <p class="small muted">Pour chaque critère : acquis (tous les points), partiel (moitié), non acquis (0). Le commentaire par critère est facultatif mais aide l'élève à progresser.</p>
      ${crit.map((c, i) => `<div class="crit"><div class="crit-head"><div><b>${esc(c.t)}</b> <span class="muted small">(${fmt1(c.pts)} pt${c.pts > 1 ? "s" : ""})</span>${c.hint ? `<div class="tiny muted">Attendu : ${esc(c.hint)}</div>` : ""}</div>
        <div class="seg" role="radiogroup">${[[1, "Acquis"], [0.5, "Partiel"], [0, "Non acquis"]].map(([v, l]) => `<button class="seg-b ${levels[i] === v ? "on" : ""}" data-ci="${i}" data-lv="${v}" role="radio" aria-checked="${levels[i] === v}">${l}</button>`).join("")}</div></div>
        <input class="input crit-c" data-cc="${i}" placeholder="Commentaire sur ce critère (facultatif)" value="${esc(comments[i] || "")}"></div>`).join("")}
      <label class="field"><span>Appréciation générale</span><textarea class="input" id="gen" rows="3" placeholder="Points forts, priorités de progrès…">${esc(prev ? prev.general || "" : "")}</textarea></label>
      <div class="btn-row"><button class="btn primary" id="pub">${prev ? "Republier la note" : "Publier la note à l'élève"}</button><a class="btn" href="#/formateur/eleve/${code}/productions">Annuler</a><span class="small muted" id="hint"></span></div>
    </div>`);
  const max = crit.reduce((a, c) => a + c.pts, 0);
  const upd = () => { const done = levels.every(l => l != null); const sum = crit.reduce((a, c, i) => a + c.pts * (levels[i] || 0), 0); $("#tot").textContent = `${done ? fmt1(Math.round(sum / max * 200) / 10) : "—"} / 20`; $("#hint").textContent = done ? "" : `${levels.filter(l => l == null).length} critère(s) à évaluer`; };
  $$(".seg-b").forEach(b => b.onclick = () => { const i = +b.dataset.ci; levels[i] = +b.dataset.lv; $$(`.seg-b[data-ci="${i}"]`).forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", x === b); }); upd(); });
  $$("[data-cc]").forEach(inp => inp.oninput = () => { comments[+inp.dataset.cc] = inp.value; });
  upd();
  $("#pub").onclick = async () => {
    if (levels.some(l => l == null)) { toast("Évaluez tous les critères avant de publier."); return; }
    const sum = crit.reduce((a, c, i) => a + c.pts * levels[i], 0);
    const g = { levels, comments, general: $("#gen").value.trim(), points: Math.round(sum * 100) / 100, max, note20: Math.round(sum / max * 200) / 10 };
    try { await DB.addFeedback(code, "note:" + key, JSON.stringify(g)); await DB.addEvent(code, "grade", { item: key, note20: g.note20 }); toast(`Note publiée : ${fmt1(g.note20)}/20`); location.hash = `#/formateur/eleve/${code}/productions`; }
    catch (e) { toast("Échec de la publication : " + e.message); }
  };
}

function renderJournal(box, events) {
  const lab = {
    login: "Connexion", start: "Démarrage du parcours (charte signée)", step: "Étape validée", exercise: "Exercice", situation: "Mise en situation envoyée", quiz: "Quiz", mission: "Mission rendue",
    paste: "⚠️ Collage de texte", blur: "⚠️ Sortie d'onglet pendant une évaluation", bilan_start: "Bilan démarré", bilan: "Bilan envoyé", feedback_read: "Retours lus", exam_start: "Cas d'examen commencé", exam: "Cas d'examen envoyé", grade: "Note publiée par le formateur", retest: "Test de positionnement repassé"

let PROPOSAL = null;
function buildProposal() {
  const f = $("#nf"); const v = n => f[n].value;
  const pos = {}; Object.keys(COMPETENCES).filter(c => c !== "SYNTH").forEach(c => pos[c] = Number(v(c)));
  const blocs = { 1: Number(v("b1")), 2: Number(v("b2")), 3: Number(v("b3")), 4: Number(v("b4")) };
  const profil = { savoirs: Number(v("savoirs")), application: Number(v("application")), analyse: Number(v("analyse")) };
  const p1 = TRAINABLE.filter(c => pos[c] < 40).sort((a, b) => pos[a] - pos[b] || blocWeight(a, blocs) - blocWeight(b, blocs));
  const p2 = TRAINABLE.filter(c => pos[c] >= 40 && pos[c] < 65).sort((a, b) => pos[a] - pos[b]);
  const selected = p1.concat(p2).slice(0, 14);
  const bl = b => selected.some(c => MODULES[c].bloc === b) || blocs[b] < 8;
  const exams = { "EXAM-B3": bl(3), "EXAM-B4": bl(4) && profil.analyse < 35, "EXAM-B12": (bl(1) || bl(2)) && profil.analyse < 35 };
  PROPOSAL = { pos, blocs, profil, order: selected, exams, synth: profil.analyse < 35, prenom: v("prenom").trim(), nom: v("nom").trim().toUpperCase(), classe: v("classe"), date: v("date"), vigilance: v("vigilance").split("\n").map(x => x.trim()).filter(Boolean) };
  drawProposal();
}
function blocWeight(c, blocs) { return blocs[MODULES[c].bloc]; }
function distribute(mods, exams) {
  // unités de 14 jours max + jour final ; un cas d'examen par jour ; les modules en surplus sont doublés
  const units = mods.map(m => ({ modules: [m] }));
  const ex = Object.keys(exams || {}).filter(k => exams[k]);
  if (ex.includes("EXAM-B3")) units.splice(Math.min(5, units.length), 0, { modules: [], exam: "EXAM-B3" });
  ex.filter(k => k !== "EXAM-B3").forEach(k => units.push({ modules: [], exam: k }));
  while (units.length > 14) {
    let i = units.length - 1; while (i > 0 && !(units[i].modules.length === 1 && units[i - 1].modules.length === 1 && !units[i].exam && !units[i - 1].exam)) i--;
    if (i <= 0) break; units[i - 1].modules.push(units[i].modules[0]); units.splice(i, 1);
  }
  const plan = units.map((u, i) => Object.assign({ jour: i + 1 }, u));
  plan.push({ jour: plan.length + 1, modules: [], exam: "EXAM-FINAL", bilan: "FINAL", visio: "V" + Math.ceil((plan.length + 1) / 5), retest: true });
  if (plan.length >= 7) { plan[4].bilan = "S1"; plan[4].visio = "V1"; }
  if (plan.length >= 12) { plan[9].bilan = "S2"; plan[9].visio = "V2"; }
  if (plan[plan.length - 1].visio === "V1" || plan[plan.length - 1].visio === "V2") plan[plan.length - 1].visio = "V3";
  return plan;
}
function drawProposal() {
  const P = PROPOSAL; const mods = P.order.concat(P.synth ? ["SYNTH"] : []);
  if (!mods.length) { $("#proposal").innerHTML = `<div class="alert warn">Aucune compétence sous 65 % : un parcours de remédiation n'est pas nécessaire.</div>`; return; }
  const plan = distribute(mods, P.exams);
  P.plan = plan;
  $("#proposal").innerHTML = `<div class="card section"><h3>Modules proposés (ordre de priorité)</h3>
    <p class="small muted">Priorité 1 : compétences sous 40 %, de la plus faible à la plus forte. Priorité 2 : entre 40 et 65 %. Ajustez l'ordre ou retirez des modules.</p>
    ${P.order.map((c, i) => `<div class="check" style="align-items:center"><span class="pill ${P.pos[c] < 40 ? "bad" : "warn"}">${P.pos[c]} %</span><span class="pill bloc bloc-${MODULES[c].bloc}">${c}</span><span style="flex:1">${esc(MODULES[c].titre)}</span>
      <button class="btn small ghost" onclick="moveMod(${i},-1)" ${i === 0 ? "disabled" : ""}>↑</button><button class="btn small ghost" onclick="moveMod(${i},1)" ${i === P.order.length - 1 ? "disabled" : ""}>↓</button><button class="btn small ghost" onclick="removeMod(${i})">Retirer</button></div>`).join("")}
    <div class="btn-row" style="margin-top:10px"><select class="input" id="addm" style="max-width:340px"><option value="">Ajouter un module…</option>${TRAINABLE.filter(c => !P.order.includes(c)).map(c => `<option value="${c}">${c} — ${esc(MODULES[c].titre)} (${P.pos[c]} %)</option>`).join("")}</select>
      <label class="check" style="border:none"><input type="checkbox" id="syn" ${P.synth ? "checked" : ""}><span>Journée « Méthode : analyser, décider, argumenter »</span></label></div>
    <h4>Cas d'examen rédigés (corrigés par vous)</h4>
    ${["EXAM-B3", "EXAM-B4", "EXAM-B12"].map(k => `<label class="check" style="border:none;padding:3px 0"><input type="checkbox" data-ex="${k}" ${P.exams[k] ? "checked" : ""}><span>${esc(EXAMS[k].titre)}</span></label>`).join("")}
    <p class="small muted">Le cas d'examen final, le bilan final et le nouveau passage du test de positionnement occupent toujours le dernier jour.</p></div>
  <div class="card section"><h3>Planning généré</h3><div class="scroll-x"><table class="dt">${plan.map(d => `<tr><td><b>Jour ${d.jour}</b></td><td>${dayContentHTML(d)}</td><td class="num">${fmtDuration(dayMinutes({ code: "x", planning: plan }, d) * 60)}</td></tr>`).join("")}</table></div>
    <p class="small muted">Volume total : ${fmtDuration(plan.reduce((a, d) => a + dayMinutes({ code: "x", planning: plan }, d), 0) * 60)} sur ${plan.length} jours ouvrés.</p>
    <label class="field"><span>Objectif affiché à l'élève</span><input class="input" id="obj" value="Consolider les compétences prioritaires du positionnement et atteindre au moins 10/20 de moyenne aux blocs professionnels."></label>
    <div class="btn-row"><button class="btn primary" onclick="saveProposal()">Créer le parcours et générer le code d'accès</button></div></div>`;
  $("#addm").onchange = e => { if (e.target.value) { P.order.push(e.target.value); drawProposal(); } };
  $("#syn").onchange = e => { P.synth = e.target.checked; drawProposal(); };
  $$("[data-ex]").forEach(c => c.onchange = () => { P.exams[c.dataset.ex] = c.checked; drawProposal(); });
}
function moveMod(i, d) { const o = PROPOSAL.order; [o[i], o[i + d]] = [o[i + d], o[i]]; drawProposal(); }
function removeMod(i) { PROPOSAL.order.splice(i, 1); drawProposal(); }
async function saveProposal() {
  const P = PROPOSAL; const existing = (await DB.listStudents()).map(s => s.code);
  const ini = (P.prenom.slice(0, 1) + P.nom.replace(/[^A-Z]/g, "").slice(0, 2)).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  let code; do { code = `MCO-${ini}-${String(10 + Math.floor(Math.random() * 90))}`; } while (existing.includes(code));
  const moy = Math.round((P.blocs[1] + P.blocs[2] + P.blocs[3] + P.blocs[4]) / 4 * 10) / 10;
  const stu = { code, nom: `${P.prenom} ${P.nom}`, prenom: P.prenom, classe: P.classe, date_positionnement: P.date || dayKey().split("-").reverse().join("/"), moyenne_initiale: moy, blocs_initiaux: P.blocs, profil: P.profil, positionnement: P.pos, vigilance: P.vigilance, objectif: $("#obj").value, planning: P.plan };
  try { await DB.saveStudent(stu); toast(`Parcours créé. Code : ${code}`, 5000); location.hash = `#/formateur/eleve/${code}/reglages`; }
  catch (e) { toast("Échec de l'enregistrement : " + e.message); }
}
