    if (x.t === "tab") return `<div class="ex"><div class="q"><span class="n">${i + 1}.</span><span class="pill" style="margin-right:6px">Tableau à compléter</span>${x.q}</div><div class="scroll-x"><table class="tab"><tr>${x.cols.map(h => `<th>${esc(h)}</th>`).join("")}</tr>${x.rows.map(r => `<tr><td><b>${esc(r.label)}</b></td>${r.cells.map(c => c.v != null ? `<td>${esc(c.v)}</td>` : `<td>${ans ? `<b style="color:var(--ok)">${String(c.r).replace(".", ",")}</b>` : "<i class=\"muted\">à calculer</i>"}</td>`).join("")}</tr>`).join("")}</table></div>${ans ? `<div class="fb info">${x.c}</div>` : ""}</div>`;
    if (x.t === "ordre") { const shown = ans ? x.items : shuffled(x.items, id + pre + i); return `<div class="ex"><div class="q"><span class="n">${i + 1}.</span><span class="pill" style="margin-right:6px">Remettre dans l'ordre</span>${x.q}</div><ol class="small">${shown.map(t => `<li>${esc(t)}</li>`).join("")}</ol>${ans ? `<div class="fb info">Ordre correct ci-dessus. ${x.c}</div>` : `<p class="tiny muted">Présenté mélangé à l'élève.</p>`}</div>`; }
    if (x.t === "assoc") return `<div class="ex"><div class="q"><span class="n">${i + 1}.</span><span class="pill" style="margin-right:6px">Associer</span>${x.q}</div><table class="tab">${x.pairs.map(p => `<tr><td><b>${esc(p[0])}</b></td><td>${ans ? esc(p[1]) : "<i class=\"muted\">…</i>"}</td></tr>`).join("")}</table>${ans ? `<div class="fb info">${x.c}</div>` : ""}</div>`;
    let body = x.t === "num" ? `<div class="small muted">Réponse numérique${x.u ? " en " + esc(x.u) : ""}${ans ? ` · attendu : <b>${String(x.r).replace(".", ",")}</b>${x.tol ? ` (tolérance ± ${String(x.tol).replace(".", ",")})` : ""}` : ""}</div>`
      : x.t === "vf" ? `<div class="small muted">Vrai ou faux${ans ? ` · réponse : <b>${x.a ? "Vrai" : "Faux"}</b>` : ""}</div>` : qcm(x, id + pre + i);
    return `<div class="ex"><div class="q"><span class="n">${i + 1}.</span>${x.q}</div>${body}${ans ? `<div class="fb info">${x.c}</div>` : ""}</div>`;
  };
  const sec = (n, t, html) => `<div class="card section"><div class="section-title"><h2 class="mb0"><span class="muted">${n}.</span> ${t}</h2></div>${html}</div>`;
  shell(`<div class="crumbs"><a href="#/formateur">Élèves</a> › <a href="#/formateur/contenus">Contenus</a> › ${id}</div>
    <div class="mod-head bloc-${m.bloc}"><span class="pill bloc bloc-${m.bloc}">${m.bloc ? "Bloc " + m.bloc + " · " + id : "Méthode transversale"}</span><h1>${esc(m.titre)}</h1><div class="muted">${esc(m.sous)} · ${m.duree} min</div></div>
    <div class="sticky-bar"><label class="check" style="border:none;padding:0"><input type="checkbox" id="ansT" ${ans ? "checked" : ""}><span>Afficher les corrigés</span></label>
      <div class="btn-row">${prev ? `<a class="btn small" href="#/formateur/contenus/${prev}">← ${prev === "SYNTH" ? "Méthode" : prev}</a>` : ""}${next ? `<a class="btn small" href="#/formateur/contenus/${next}">${next === "SYNTH" ? "Méthode" : next} →</a>` : ""}</div></div>
    <div class="content">
    <div class="objectifs"><b>Objectifs du module</b><ul>${m.objectifs.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>
    ${sec(1, "Cours", `<p class="small muted">Temps de lecture minimum imposé à l'élève : ${Math.round(minRead(id) / 60)} min, et défilement jusqu'en bas.</p>${m.cours.map(c => `<h3>${esc(c.t)}</h3>${c.h}`).join("")}`)}
    ${sec(2, "Exemple résolu", `<div class="formule" style="font-weight:500">${esc(m.exemple.enonce)}</div>${m.exemple.etapes.map((e, i) => `<div class="reveal-step on"><h4>Étape ${i + 1} — ${esc(e.t)}</h4><div>${e.h}</div></div>`).join("")}<p class="tiny muted">L'élève découvre les étapes une par une.</p>`)}
    ${sec(3, "Exercices auto-corrigés", `<p class="small muted">Deux essais pour les calculs, un pour les QCM ; la correction s'affiche ensuite. Les propositions des QCM sont mélangées pour chaque élève.</p>${m.exercices.map((x, i) => item(x, i, "ex")).join("")}`)}
    ${sec(4, "Mise en situation", `<h3>${esc(m.situation.titre)}</h3>${m.situation.contexte}<h4>Questions</h4><ol>${m.situation.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ol>
      ${ans ? `<h4>Corrigé</h4>${m.situation.corrige.map((c, i) => `<div class="corrige"><b>Question ${i + 1}</b>${c}</div>`).join("")}` : ""}
      <h4>Grille d'auto-évaluation</h4><ul>${m.situation.grille.map(g => `<li>${esc(g)}</li>`).join("")}</ul>`)}
    ${sec(5, "Quiz de validation", `<p class="small muted">${m.quiz.length} questions, ${QUIZ_PASS} % requis, ordre des questions et des réponses mélangé à chaque tentative.</p>${m.quiz.map((x, i) => item(Object.assign({ t: "qcm" }, x), i, "q")).join("")}`)}
    ${sec(6, "Mission en entreprise", `<h3>${esc(m.mission.titre)}</h3><p>${esc(m.mission.consigne)}</p>`)}
    ${sec("+", "Questions de bilan", `<p class="small muted">Questions inédites réservées aux bilans chronométrés (mi-parcours et final).</p>${m.bilan.map((x, i) => item(x, i, "b")).join("")}`)}
    </div>`);
  $("#ansT").onchange = e => { SHOW_ANS = e.target.checked; const y = window.scrollY; viewTrainerContent(id); window.scrollTo(0, y); };
}

function viewExamContent(id) {
  const e = EXAMS[id], ans = SHOW_ANS;
  shell(`<div class="crumbs"><a href="#/formateur">Élèves</a> › <a href="#/formateur/contenus">Contenus</a> › ${esc(e.titre)}</div>
    <div class="mod-head bloc-${e.bloc}"><span class="pill bad">Cas d'examen · ${e.duree} min</span><h1>${esc(e.titre)}</h1><div class="muted">${esc(e.sous)}</div></div>
    <div class="sticky-bar"><label class="check" style="border:none;padding:0"><input type="checkbox" id="ansT" ${ans ? "checked" : ""}><span>Afficher le corrigé et la grille</span></label></div>
    <div class="card content">${e.contexte}<h3>Questions</h3><ol>${e.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>
    ${ans ? `<div class="card section"><h3>Corrigé</h3>${e.corrige.map((c, i) => `<div class="corrige"><b>Question ${i + 1}</b>${c}</div>`).join("")}</div>
    <div class="card section"><h3>Grille de notation (/20)</h3><table class="dt"><tr><th>Critère</th><th>Attendu</th><th class="num">Points</th></tr>${e.criteres.map(c => `<tr><td>${esc(c.t)}</td><td class="small muted">${esc(c.hint || "")}</td><td class="num">${c.pts}</td></tr>`).join("")}</table></div>` : ""}`);
  $("#ansT").onchange = ev => { SHOW_ANS = ev.target.checked; viewExamContent(id); };
}

route();

</script>
</body>
</html>
